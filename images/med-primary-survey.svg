<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การประเมินผู้บาดเจ็บเบื้องต้น (Primary survey — DRSABCDE)</text>
<circle cx="62" cy="78" r="24" fill="#b91c1c"/><text x="62.0" y="86.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">D</text>
<rect x="100.0" y="52.0" width="860.0" height="54.0" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="116.0" y="74.0" font-size="14" text-anchor="start" fill="#b91c1c" font-weight="bold">Danger</text>
<text x="300.0" y="74.0" font-size="12" text-anchor="start" fill="#0f172a">อันตรายต่อตัวเรา/ผู้อื่น/ผู้ป่วย? (ไฟฟ้า ก๊าซ ไฟ พื้นที่อับอากาศ)</text>
<text x="300.0" y="92.0" font-size="12" text-anchor="start" fill="#0f172a">ทำให้ปลอดภัยก่อน — อย่าเพิ่มผู้บาดเจ็บ</text>
<circle cx="62" cy="142" r="24" fill="#c2410c"/><text x="62.0" y="150.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">R</text>
<rect x="100.0" y="116.0" width="860.0" height="54.0" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
<text x="116.0" y="138.0" font-size="14" text-anchor="start" fill="#c2410c" font-weight="bold">Response</text>
<text x="300.0" y="138.0" font-size="12" text-anchor="start" fill="#0f172a">เรียก เขย่าไหล่เบา ๆ — ตอบสนองหรือไม่ (AVPU: Alert, Voice,</text>
<text x="300.0" y="156.0" font-size="12" text-anchor="start" fill="#0f172a">Pain, Unresponsive)</text>
<circle cx="62" cy="206" r="24" fill="#ca8a04"/><text x="62.0" y="214.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">S</text>
<rect x="100.0" y="180.0" width="860.0" height="54.0" rx="10" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="116.0" y="202.0" font-size="14" text-anchor="start" fill="#ca8a04" font-weight="bold">Send for help</text>
<text x="300.0" y="202.0" font-size="12" text-anchor="start" fill="#0f172a">แจ้งสะพานเดินเรือ/ผู้ดูแลการแพทย์ ขอเครื่อง AED ชุดปฐมพยาบาล</text>
<text x="300.0" y="220.0" font-size="12" text-anchor="start" fill="#0f172a">ออกซิเจน — แจ้งตำแหน่งชัดเจน</text>
<circle cx="62" cy="270" r="24" fill="#15803d"/><text x="62.0" y="278.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">A</text>
<rect x="100.0" y="244.0" width="860.0" height="54.0" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="116.0" y="266.0" font-size="14" text-anchor="start" fill="#15803d" font-weight="bold">Airway</text>
<text x="300.0" y="266.0" font-size="12" text-anchor="start" fill="#0f172a">เปิดทางเดินหายใจ: กดหน้าผาก เชยคาง (สงสัยบาดเจ็บกระดูกสันหลัง:</text>
<text x="300.0" y="284.0" font-size="12" text-anchor="start" fill="#0f172a">ดึงขากรรไกร jaw thrust) — มองหาสิ่งอุดตัน</text>
<circle cx="62" cy="334" r="24" fill="#0369a1"/><text x="62.0" y="342.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
<rect x="100.0" y="308.0" width="860.0" height="54.0" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/>
<text x="116.0" y="330.0" font-size="14" text-anchor="start" fill="#0369a1" font-weight="bold">Breathing</text>
<text x="300.0" y="330.0" font-size="12" text-anchor="start" fill="#0f172a">ดู ฟัง สัมผัส ไม่เกิน 10 วินาที — ไม่หายใจ/หายใจเฮือก (gasping)</text>
<text x="300.0" y="348.0" font-size="12" text-anchor="start" fill="#0f172a">→ เริ่ม CPR และใช้ AED</text>
<circle cx="62" cy="398" r="24" fill="#1d4ed8"/><text x="62.0" y="406.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">C</text>
<rect x="100.0" y="372.0" width="860.0" height="54.0" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="116.0" y="394.0" font-size="14" text-anchor="start" fill="#1d4ed8" font-weight="bold">Circulation</text>
<text x="300.0" y="394.0" font-size="12" text-anchor="start" fill="#0f172a">ห้ามเลือดที่ออกมาก (กดตรงแผล) ดูสัญญาณช็อก ชีพจร สีผิว</text>
<text x="300.0" y="412.0" font-size="12" text-anchor="start" fill="#0f172a">อุณหภูมิผิว</text>
<circle cx="62" cy="462" r="24" fill="#7c3aed"/><text x="62.0" y="470.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">D</text>
<rect x="100.0" y="436.0" width="860.0" height="54.0" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="116.0" y="458.0" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">Disability</text>
<text x="300.0" y="458.0" font-size="12" text-anchor="start" fill="#0f172a">ระดับความรู้สึกตัว (AVPU/GCS) รูม่านตา น้ำตาลในเลือด</text>
<text x="300.0" y="476.0" font-size="12" text-anchor="start" fill="#0f172a">การขยับแขนขา</text>
<circle cx="62" cy="526" r="24" fill="#be185d"/><text x="62.0" y="534.0" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">E</text>
<rect x="100.0" y="500.0" width="860.0" height="54.0" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/>
<text x="116.0" y="522.0" font-size="14" text-anchor="start" fill="#be185d" font-weight="bold">Exposure</text>
<text x="300.0" y="522.0" font-size="12" text-anchor="start" fill="#0f172a">ตรวจทั้งตัวหาบาดแผลซ่อนเร้น แล้วห่มให้อบอุ่น</text>
<text x="300.0" y="540.0" font-size="12" text-anchor="start" fill="#0f172a">(ป้องกันตัวเย็น) — รักษาความเป็นส่วนตัว</text>
<text x="500.0" y="580.0" font-size="12.5" text-anchor="middle" fill="#334155" font-weight="bold">จากนั้น secondary survey (ประวัติ อาการ ตรวจทั้งตัวละเอียด สัญญาณชีพซ้ำ) → บันทึก → ปรึกษา TMAS ตามความจำเป็น (ดู IMGS)</text>
</svg>
