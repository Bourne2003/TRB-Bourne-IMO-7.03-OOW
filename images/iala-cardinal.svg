<text x="170" y="495" text-anchor="middle" font-size="13" fill="#0f172a">เหลือง-ดำ-เหลือง · ยอดชนยอด</text>
<text x="170" y="512" text-anchor="middle" font-size="13" fill="#0f172a">VQ(9) 10s / Q(9) 15s</text>
<rect x="20" y="60" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="34" y="86" font-size="14" font-weight="bold">ช่วยจำ: ไฟแวบตามหน้าปัดนาฬิกา</text>
<text x="34" y="107" font-size="14">E = 3 นาฬิกา → 3 แวบ</text>
<text x="34" y="128" font-size="14">S = 6 นาฬิกา → 6 แวบ + LFl</text>
<text x="34" y="149" font-size="14">W = 9 นาฬิกา → 9 แวบ</text>
<text x="34" y="170" font-size="14">N = ต่อเนื่อง (ไม่มีกลุ่ม)</text>
<rect x="680" y="60" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="694" y="86" font-size="14" font-weight="bold">ช่วยจำ topmark:</text>
<text x="694" y="107" font-size="14">N ชี้ขึ้น (เหนือ) · S ชี้ลง (ใต้)</text>
<text x="694" y="128" font-size="14">W ยอดชนกัน = รูปแก้วไวน์</text>
<text x="694" y="149" font-size="14">E ฐานชนกัน = รูปไข่ (Egg)</text>
<text x="694" y="170" font-size="14">สีดำอยู่ด้านที่กรวยชี้</text>
<text x="500" y="295" text-anchor="middle" font-size="13" fill="#0369a1">ผ่านทางเหนือของทุ่น N</text>
