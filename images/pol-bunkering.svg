<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การป้องกันมลพิษระหว่างรับน้ำมันเชื้อเพลิง (Bunkering)</text>
<rect x="40.0" y="250.0" width="560.0" height="160.0" rx="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<text x="420.0" y="400.0" font-size="12" text-anchor="middle" fill="#334155">ดาดฟ้าเรือ (main deck)</text>
<rect x="120.0" y="310.0" width="80.0" height="50.0" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
<text x="160.0" y="340.0" font-size="11.5" text-anchor="middle" fill="#78350f" font-weight="bold">Manifold</text>
<rect x="100.0" y="360.0" width="120.0" height="18.0" rx="0" fill="#fde68a" stroke="#a16207" stroke-width="1"/>
<text x="160.0" y="373.0" font-size="10" text-anchor="middle" fill="#78350f">save-all / drip tray</text>
<path d="M 240 470 Q 250 380 201 335" fill="none" stroke="#1f2937" stroke-width="6"/><circle cx="60" cy="402" r="8" fill="#0f172a"/><circle cx="300" cy="402" r="8" fill="#0f172a"/><circle cx="560" cy="402" r="8" fill="#0f172a"/><text x="440.0" y="435.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">● = scupper plugs ปิดทุกจุด</text>
<rect x="400.0" y="280.0" width="150.0" height="80.0" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
<text x="475.0" y="312.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">SOPEP locker</text>
<text x="475.0" y="330.0" font-size="10.5" text-anchor="middle" fill="#0f172a">sorbents · ปั๊มมือ</text>
<text x="475.0" y="345.0" font-size="10.5" text-anchor="middle" fill="#0f172a">ถังเปล่า · ทราย/ขี้เลื่อย</text>
<path d="M 40 470 L 600 470 L 580 520 L 60 520 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/><text x="320.0" y="502.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">เรือส่งน้ำมัน (bunker barge)</text>
<text x="256.0" y="450.0" font-size="11" text-anchor="start" fill="#0f172a">สายส่ง (bunker hose)</text>
<rect x="250.0" y="120.0" width="160.0" height="110.0" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<rect x="252.0" y="150.0" width="156.0" height="78.0" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="0"/>
<text x="290.0" y="112.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">ถังน้ำมัน</text>
<line x1="250.0" y1="138.0" x2="410.0" y2="138.0" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="415.0" y="142.0" font-size="11" text-anchor="start" fill="#b91c1c" font-weight="bold">สูงสุด ≈ 85–90%</text>
<line x1="330.0" y1="120.0" x2="330.0" y2="80.0" stroke="#0f172a" stroke-width="3"/>
<path d="M 318 80 L 342 80 L 330 64 Z" fill="#0f172a"/><text x="350.0" y="78.0" font-size="11" text-anchor="start" fill="#0f172a">ท่อระบาย (vent) + save-all</text>
<path d="M 160 310 L 160 250 L 250 200" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#ar)"/><rect x="620.0" y="60.0" width="350.0" height="480.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="634.0" y="84.0" font-size="12" text-anchor="start" fill="#1d4ed8" font-weight="bold">ก่อนเริ่ม</text>
<text x="634.0" y="106.5" font-size="12" text-anchor="start" fill="#0f172a">• ประชุม/checklist กับ barge — ชนิด ปริมาณ</text>
<text x="634.0" y="129.0" font-size="12" text-anchor="start" fill="#0f172a">  อัตรา ความดัน ลำดับถัง สัญญาณหยุด</text>
<text x="634.0" y="151.5" font-size="12" text-anchor="start" fill="#0f172a">• วัด sounding/ullage ทุกถังก่อนเริ่ม</text>
<text x="634.0" y="174.0" font-size="12" text-anchor="start" fill="#0f172a">• ปิด scupper plugs, save-all ว่าง</text>
<text x="634.0" y="196.5" font-size="12" text-anchor="start" fill="#0f172a">• SOPEP พร้อม, ไฟ/ป้ายห้ามสูบบุหรี่ ธง B/ไฟแดง</text>
<text x="634.0" y="219.0" font-size="12" text-anchor="start" fill="#0f172a">• วาล์วถูกต้อง ท่อที่ไม่ใช้ปิด blank</text>
<text x="634.0" y="241.5" font-size="12" text-anchor="start" fill="#0f172a">• สื่อสารทดสอบแล้ว (วิทยุ/โทรศัพท์)</text>
<text x="634.0" y="264.0" font-size="12" text-anchor="start" fill="#0f172a"></text>
<text x="634.0" y="286.5" font-size="12" text-anchor="start" fill="#1d4ed8" font-weight="bold">ระหว่าง</text>
<text x="634.0" y="309.0" font-size="12" text-anchor="start" fill="#0f172a">• เริ่มช้า ตรวจว่าน้ำมันเข้าถังที่ถูก</text>
<text x="634.0" y="331.5" font-size="12" text-anchor="start" fill="#0f172a">• มีคนเฝ้า manifold และวัดถังตลอด</text>
<text x="634.0" y="354.0" font-size="12" text-anchor="start" fill="#0f172a">• ลดอัตราเมื่อใกล้เต็ม (topping off)</text>
<text x="634.0" y="376.5" font-size="12" text-anchor="start" fill="#0f172a">• ตรวจรั่ว สายส่ง หน้าแปลน รอบ ๆ เรือ</text>
<text x="634.0" y="399.0" font-size="12" text-anchor="start" fill="#0f172a"></text>
<text x="634.0" y="421.5" font-size="12" text-anchor="start" fill="#1d4ed8" font-weight="bold">หลังเสร็จ</text>
<text x="634.0" y="444.0" font-size="12" text-anchor="start" fill="#0f172a">• Drain สาย ปิดวาล์ว วัดถัง เทียบ BDN</text>
<text x="634.0" y="466.5" font-size="12" text-anchor="start" fill="#0f172a">• เก็บตัวอย่าง MARPOL sample</text>
<text x="634.0" y="489.0" font-size="12" text-anchor="start" fill="#0f172a">• บันทึก ORB Part I และ logbook</text>
<text x="634.0" y="511.5" font-size="12" text-anchor="start" fill="#0f172a">• ถ้าต่าง/มีปัญหา → Letter of Protest</text>
</svg>
