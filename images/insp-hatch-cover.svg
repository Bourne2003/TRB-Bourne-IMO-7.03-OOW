<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ฝาระวาง (Hatch cover): ส่วนประกอบระบบผนึกกันน้ำ และข้อบกพร่องที่พบบ่อย</text>
<rect x="120.0" y="260.0" width="26.0" height="220.0" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
<rect x="110.0" y="250.0" width="70.0" height="14.0" rx="0" fill="#64748b" stroke="#0f172a" stroke-width="2"/>
<text x="116.0" y="500.0" font-size="12" text-anchor="start" fill="#0f172a" font-weight="bold">Hatch coaming</text>
<rect x="138.0" y="230.0" width="10.0" height="20.0" rx="0" fill="#475569" stroke="#0f172a" stroke-width="1.5"/>
<path d="M 90 180 L 540 180 L 540 230 L 90 230 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/><text x="320.0" y="210.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">แผ่นฝาระวาง (hatch cover panel)</text>
<rect x="126.0" y="230.0" width="34.0" height="14.0" rx="0" fill="#111827" stroke="#0f172a" stroke-width="1"/>
<rect x="132" y="238" width="22" height="10" rx="3" fill="#1f2937"/><path d="M 90 260 L 114 260 L 114 230 " fill="none" stroke="#b45309" stroke-width="5"/><path d="M 180 250 L 180 270 L 230 270 L 230 250" fill="none" stroke="#0369a1" stroke-width="3"/><line x1="205.0" y1="270.0" x2="205.0" y2="320.0" stroke="#0369a1" stroke-width="3"/>
<circle cx="205" cy="328" r="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><rect x="280.0" y="230.0" width="30.0" height="20.0" rx="0" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
<rect x="280.0" y="250.0" width="30.0" height="14.0" rx="0" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
<circle cx="170" cy="236" r="10" fill="#b91c1c" opacity="0.9"/><text x="170.0" y="240.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<circle cx="164" cy="264" r="10" fill="#b91c1c" opacity="0.9"/><text x="164.0" y="268.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<circle cx="90" cy="275" r="10" fill="#b91c1c" opacity="0.9"/><text x="90.0" y="279.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<circle cx="205" cy="345" r="10" fill="#b91c1c" opacity="0.9"/><text x="205.0" y="349.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<circle cx="295" cy="275" r="10" fill="#b91c1c" opacity="0.9"/><text x="295.0" y="279.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
<circle cx="380" cy="292" r="10" fill="#b91c1c"/><text x="380.0" y="296.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<text x="398.0" y="296.0" font-size="12.5" text-anchor="start" fill="#0f172a">ยางผนึก (packing/gasket) ในราง</text>
<circle cx="380" cy="320" r="10" fill="#b91c1c"/><text x="380.0" y="324.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="398.0" y="324.0" font-size="12.5" text-anchor="start" fill="#0f172a">Compression bar บนขอบ coaming</text>
<circle cx="380" cy="348" r="10" fill="#b91c1c"/><text x="380.0" y="352.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<text x="398.0" y="352.0" font-size="12.5" text-anchor="start" fill="#0f172a">Cleat/ตัวล็อก (quick-acting cleat)</text>
<circle cx="380" cy="376" r="10" fill="#b91c1c"/><text x="380.0" y="380.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<text x="398.0" y="380.0" font-size="12.5" text-anchor="start" fill="#0f172a">รางระบายน้ำ + non-return valve</text>
<circle cx="380" cy="404" r="10" fill="#b91c1c"/><text x="380.0" y="408.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
<text x="398.0" y="408.0" font-size="12.5" text-anchor="start" fill="#0f172a">Bearing pad (steel-to-steel contact)</text>
<text x="220.0" y="150.0" font-size="13" text-anchor="middle" fill="#334155" font-weight="bold">ภาพตัดขอบฝาระวางกับขอบ coaming (แนวคิด)</text>
<rect x="640.0" y="60.0" width="345.0" height="470.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="654.0" y="86.0" font-size="12.3" text-anchor="start" fill="#7f1d1d" font-weight="bold">ข้อบกพร่องที่พบบ่อย</text>
<text x="654.0" y="108.5" font-size="12.3" text-anchor="start" fill="#0f172a">• ยางแข็ง แตก ขาด หลุดจากราง</text>
<text x="654.0" y="131.0" font-size="12.3" text-anchor="start" fill="#0f172a">  หรือมีรอยกดถาวร (permanent set)</text>
<text x="654.0" y="153.5" font-size="12.3" text-anchor="start" fill="#0f172a">  ลึกเกินเกณฑ์ผู้ผลิต</text>
<text x="654.0" y="176.0" font-size="12.3" text-anchor="start" fill="#0f172a">• Compression bar คด บิ่น เป็นสนิม</text>
<text x="654.0" y="198.5" font-size="12.3" text-anchor="start" fill="#0f172a">• Cleat หลวม หาย ยางรอง (washer)</text>
<text x="654.0" y="221.0" font-size="12.3" text-anchor="start" fill="#0f172a">  เสื่อม ปรับระยะไม่ถูก</text>
<text x="654.0" y="243.5" font-size="12.3" text-anchor="start" fill="#0f172a">• รางระบายน้ำตัน non-return valve</text>
<text x="654.0" y="266.0" font-size="12.3" text-anchor="start" fill="#0f172a">  ติด/หาย → น้ำล้นเข้าระวาง</text>
<text x="654.0" y="288.5" font-size="12.3" text-anchor="start" fill="#0f172a">• Bearing pad สึก → ยางรับแรงเกิน</text>
<text x="654.0" y="311.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ขอบ coaming/ฝาเป็นสนิม รอยร้าวที่มุม</text>
<text x="654.0" y="333.5" font-size="12.3" text-anchor="start" fill="#0f172a">• แผ่นฝาบุบ/เสียรูปจากเครน หรือคลื่น</text>
<text x="654.0" y="356.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ล้อ ราง โซ่ ไฮดรอลิก รั่ว/เสียหาย</text>
<text x="654.0" y="378.5" font-size="12.3" text-anchor="start" fill="#0f172a"></text>
<text x="654.0" y="401.0" font-size="12.3" text-anchor="start" fill="#7f1d1d" font-weight="bold">การทดสอบความผนึกน้ำ</text>
<text x="654.0" y="423.5" font-size="12.3" text-anchor="start" fill="#0f172a">• Hose test (ฉีดน้ำตามแนวรอยต่อ)</text>
<text x="654.0" y="446.0" font-size="12.3" text-anchor="start" fill="#0f172a">• Ultrasonic test (ทำได้แม้มีสินค้า)</text>
<text x="654.0" y="468.5" font-size="12.3" text-anchor="start" fill="#0f172a">• Chalk test (ดูรอยสัมผัสยาง)</text>
<text x="654.0" y="491.0" font-size="12.3" text-anchor="start" fill="#0f172a">• Light test (ดูแสงลอดจากในระวาง)</text>
</svg>
