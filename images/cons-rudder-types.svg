<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="420" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ชนิดของหางเสือ (Rudder types)</text>
<text x="180.0" y="70.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Unbalanced</text>
<rect x="140.0" y="120.0" width="120.0" height="200.0" rx="6" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<line x1="140.0" y1="80.0" x2="140.0" y2="330.0" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 4"/>
<text x="144.0" y="95.0" font-size="10.5" text-anchor="start" fill="#b91c1c" font-weight="bold">แกนหมุน</text>
<circle cx="140.0" cy="150" r="6" fill="#0f172a"/><circle cx="140.0" cy="230" r="6" fill="#0f172a"/><circle cx="140.0" cy="300" r="6" fill="#0f172a"/><text x="266.0" y="236.0" font-size="10.5" text-anchor="start" fill="#334155">pintles/gudgeons</text>
<text x="180.0" y="360.0" font-size="12" text-anchor="middle" fill="#334155">แกนอยู่ขอบหน้า แรงบิดสูง</text>
<text x="180.0" y="342.0" font-size="10.5" text-anchor="middle" fill="#475569">← หัวเรือ</text>
<text x="480.0" y="70.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Semi-balanced (horn type)</text>
<rect x="440.0" y="120.0" width="120.0" height="200.0" rx="6" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<rect x="436.0" y="100.0" width="32.0" height="110.0" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
<text x="432.0" y="160.0" font-size="11" text-anchor="end" fill="#334155">horn</text>
<line x1="464.0" y1="80.0" x2="464.0" y2="330.0" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 4"/>
<text x="468.0" y="95.0" font-size="10.5" text-anchor="start" fill="#b91c1c" font-weight="bold">แกนหมุน</text>
<text x="480.0" y="360.0" font-size="12" text-anchor="middle" fill="#334155">บางส่วนอยู่หน้าแกน มี horn</text>
<text x="480.0" y="342.0" font-size="10.5" text-anchor="middle" fill="#475569">← หัวเรือ</text>
<text x="780.0" y="70.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Balanced / spade</text>
<rect x="740.0" y="120.0" width="120.0" height="200.0" rx="6" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<line x1="770.0" y1="80.0" x2="770.0" y2="330.0" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 4"/>
<text x="774.0" y="95.0" font-size="10.5" text-anchor="start" fill="#b91c1c" font-weight="bold">แกนหมุน</text>
<text x="780.0" y="360.0" font-size="12" text-anchor="middle" fill="#334155">ประมาณ 20–30% อยู่หน้าแกน</text>
<text x="780.0" y="342.0" font-size="10.5" text-anchor="middle" fill="#475569">← หัวเรือ</text>
<text x="500.0" y="400.0" font-size="12" text-anchor="middle" fill="#0f172a">ส่วนประกอบ: rudder stock, rudder carrier (รับน้ำหนัก), bearings, pintles/gudgeons, stopper (จำกัดมุม), steering gear (ดู 1.1.6)</text>
