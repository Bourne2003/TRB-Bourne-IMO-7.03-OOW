<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การช่วยฟื้นคืนชีพ (CPR) ผู้ใหญ่ และการใช้ AED — หลักการตามแนวทางสากล</text>
<rect x="30.0" y="60.0" width="220.0" height="210.0" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/>
<rect x="30.0" y="60.0" width="220.0" height="44.0" rx="12" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<rect x="30.0" y="88.0" width="220.0" height="16.0" rx="0" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<text x="140.0" y="89.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">1. ตรวจ</text>
<text x="140.0" y="134.0" font-size="11.3" text-anchor="middle" fill="#0f172a">ไม่ตอบสนอง</text>
<text x="140.0" y="156.0" font-size="11.3" text-anchor="middle" fill="#0f172a">ไม่หายใจปกติ</text>
<text x="140.0" y="178.0" font-size="11.3" text-anchor="middle" fill="#0f172a">→ ขอความช่วยเหลือ</text>
<text x="140.0" y="200.0" font-size="11.3" text-anchor="middle" fill="#0f172a">ขอ AED</text>
<line x1="252.0" y1="165.0" x2="268.0" y2="165.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="270.0" y="60.0" width="220.0" height="210.0" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2.5"/>
<rect x="270.0" y="60.0" width="220.0" height="44.0" rx="12" fill="#c2410c" stroke="#c2410c" stroke-width="0"/>
<rect x="270.0" y="88.0" width="220.0" height="16.0" rx="0" fill="#c2410c" stroke="#c2410c" stroke-width="0"/>
<text x="380.0" y="89.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">2. กดหน้าอก 30 ครั้ง</text>
<text x="380.0" y="134.0" font-size="11.3" text-anchor="middle" fill="#0f172a">กลางหน้าอก</text>
<text x="380.0" y="156.0" font-size="11.3" text-anchor="middle" fill="#0f172a">(ครึ่งล่างกระดูกหน้าอก)</text>
<text x="380.0" y="178.0" font-size="11.3" text-anchor="middle" fill="#0f172a">ลึก 5–6 cm</text>
<text x="380.0" y="200.0" font-size="11.3" text-anchor="middle" fill="#0f172a">100–120 ครั้ง/นาที</text>
<text x="380.0" y="222.0" font-size="11.3" text-anchor="middle" fill="#0f172a">ปล่อยให้หน้าอกคืนตัว</text>
<line x1="492.0" y1="165.0" x2="508.0" y2="165.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="510.0" y="60.0" width="220.0" height="210.0" rx="12" fill="#fff" stroke="#0369a1" stroke-width="2.5"/>
<rect x="510.0" y="60.0" width="220.0" height="44.0" rx="12" fill="#0369a1" stroke="#0369a1" stroke-width="0"/>
<rect x="510.0" y="88.0" width="220.0" height="16.0" rx="0" fill="#0369a1" stroke="#0369a1" stroke-width="0"/>
<text x="620.0" y="89.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">3. ช่วยหายใจ 2 ครั้ง</text>
<text x="620.0" y="134.0" font-size="11.3" text-anchor="middle" fill="#0f172a">เปิดทางเดินหายใจ</text>
<text x="620.0" y="156.0" font-size="11.3" text-anchor="middle" fill="#0f172a">เป่าลมจนหน้าอกยก</text>
<text x="620.0" y="178.0" font-size="11.3" text-anchor="middle" fill="#0f172a">(ใช้ pocket mask)</text>
<text x="620.0" y="200.0" font-size="11.3" text-anchor="middle" fill="#0f172a">ทำไม่ได้/ไม่ยินดี:</text>
<text x="620.0" y="222.0" font-size="11.3" text-anchor="middle" fill="#0f172a">กดหน้าอกต่อเนื่อง</text>
<line x1="732.0" y1="165.0" x2="748.0" y2="165.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="750.0" y="60.0" width="220.0" height="210.0" rx="12" fill="#fff" stroke="#15803d" stroke-width="2.5"/>
<rect x="750.0" y="60.0" width="220.0" height="44.0" rx="12" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<rect x="750.0" y="88.0" width="220.0" height="16.0" rx="0" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="860.0" y="89.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">4. AED</text>
<text x="860.0" y="134.0" font-size="11.3" text-anchor="middle" fill="#0f172a">เปิดเครื่อง ทำตามเสียงสั่ง</text>
<text x="860.0" y="156.0" font-size="11.3" text-anchor="middle" fill="#0f172a">ติดแผ่นบนหน้าอกเปลือย</text>
<text x="860.0" y="178.0" font-size="11.3" text-anchor="middle" fill="#0f172a">ห้ามสัมผัสขณะวิเคราะห์/ช็อก</text>
<text x="860.0" y="200.0" font-size="11.3" text-anchor="middle" fill="#0f172a">CPR ต่อทันทีหลังช็อก</text>
<rect x="30.0" y="290.0" width="940.0" height="160.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="46.0" y="316.0" font-size="12" text-anchor="start" fill="#0f172a">• ทำต่อเนื่องสลับ 30:2 จนผู้ป่วยฟื้น (หายใจปกติ ขยับ) AED สั่งหยุด ทีมรับช่วง หรือผู้ช่วยหมดแรง — เปลี่ยนคนกดทุก ~2 นาที</text>
<text x="46.0" y="343.0" font-size="12" text-anchor="start" fill="#0f172a">• ผู้ป่วยจมน้ำ: เริ่มด้วยการช่วยหายใจ 5 ครั้งก่อน (ตามแนวทางสำหรับการจมน้ำ) · เด็ก/ทารกมีวิธีเฉพาะ</text>
<text x="46.0" y="370.0" font-size="12" text-anchor="start" fill="#0f172a">• ผู้ป่วยหายใจได้แต่ไม่รู้สึกตัว → ท่าพักฟื้น (recovery position) เฝ้าดูการหายใจ</text>
<text x="46.0" y="397.0" font-size="12" text-anchor="start" fill="#0f172a">• สำลักอุดทางเดินหายใจ (ผู้ใหญ่ รู้สึกตัว): ตบหลัง 5 ครั้ง สลับกดท้อง (abdominal thrusts) 5 ครั้ง — หมดสติให้เริ่ม CPR</text>
<text x="46.0" y="424.0" font-size="12" text-anchor="start" fill="#0f172a">• ตัวเลขในภาพสรุปจากแนวทางการช่วยชีวิตสากลในปัจจุบัน — ปฏิบัติตามการฝึก STCW A-VI/4 และคู่มือ IMGS ฉบับที่ใช้บนเรือ</text>
</svg>
