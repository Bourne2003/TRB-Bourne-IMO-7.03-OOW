<text x="100" y="468" font-size="12">ตำแหน่ง SART = จุดแรกที่ใกล้เรือที่สุด · ยาวประมาณ 8 nm</text>
<text x="100" y="486" font-size="12">ใกล้ &lt; ~1 nm: จุดกลายเป็นส่วนโค้ง → วงกลมรอบศูนย์กลาง</text>
<text x="280" y="190" font-size="11" fill="#bbf7d0">SART</text>
<text x="260" y="400" text-anchor="middle" font-size="11" fill="#bbf7d0">range scale 12 nm</text>
<circle cx="740" cy="250" r="170" fill="#052e16" stroke="#334155" stroke-width="3"/><circle cx="740" cy="250" r="3" fill="#fff"/>
