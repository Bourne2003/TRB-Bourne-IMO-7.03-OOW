<text x="680" y="120" font-size="11" fill="#bbf7d0">Racon "K" (−·−)</text>
<text x="580" y="450" font-size="13" font-weight="bold">Racon: รหัสมอร์สเริ่มด้านหลังเป้า ยื่นออกไปตามรัศมี</text>
<text x="580" y="468" font-size="12">ใช้ระบุทุ่น/ประภาคาร/แท่น · ระยะวัดที่จุดเริ่มต้นของรหัส</text>
<text x="580" y="486" font-size="12">interference rejection อาจลบ racon/SART ออก</text>
<line x1="40" y1="510" x2="960" y2="510" stroke="#cbd5e1"/>
<text x="500" y="536" text-anchor="middle" font-size="15" font-weight="bold">ภาพ SART เปลี่ยนไปเมื่อเรือเราเข้าใกล้ (ใช้ระบุระยะคร่าว ๆ)</text>
