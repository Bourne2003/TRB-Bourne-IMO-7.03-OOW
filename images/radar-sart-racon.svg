<text x="820" y="742" text-anchor="middle" font-size="12" font-weight="bold">ใกล้มาก: วงกลมซ้อนรอบเรือเรา</text>
<text x="500" y="770" text-anchor="middle" font-size="12" fill="#334155">ใกล้ SART แล้วลด gain/ปรับ clutter เพื่อหาทิศ — ค้นหาด้วยสายตา/ไฟส่องควบคู่ (MSC.510(105): ตรวจพบได้ ≥ 5 nm จากเสาอากาศ 15 m)</text>
