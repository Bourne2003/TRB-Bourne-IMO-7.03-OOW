<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
  <rect width="820" height="470" fill="#fff"/>
  <defs><marker id="d" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker>
  <marker id="s" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Under Keel Clearance (UKC)</text>
  <rect x="0" y="120" width="820" height="290" fill="#dbeafe"/>
  <line x1="0" y1="120" x2="820" y2="120" stroke="#1d4ed8" stroke-width="2"/>
  <text x="14" y="113" font-size="13" fill="#1d4ed8">ระดับน้ำจริง (actual water level)</text>
  <line x1="0" y1="190" x2="820" y2="190" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="14" y="183" font-size="13" fill="#b91c1c">Chart Datum (≈ LAT)</text>
  <path d="M 0 410 L 820 410 L 820 470 L 0 470 z" fill="#d6b98c"/>
  <path d="M 0 410 Q 100 400 200 410 T 400 408 T 600 412 T 820 408" fill="none" stroke="#92400e" stroke-width="2"/>
  <text x="14" y="455" font-size="13" fill="#78350f">พื้นทะเล (seabed)</text>
  <path d="M 300 80 L 600 80 L 600 300 Q 600 330 570 330 L 330 330 Q 300 330 300 300 z" fill="#475569"/>
  <path d="M 300 120 L 600 120 L 600 300 Q 600 330 570 330 L 330 330 Q 300 330 300 300 z" fill="#334155"/>
  <path d="M 300 330 L 600 330 L 600 352 L 300 352 z" fill="#94a3b8" opacity="0.6"/>
  <text x="450" y="346" text-anchor="middle" font-size="11" fill="#0f172a">squat + wave response + heel + survey/tide allowance</text>
  <text x="450" y="230" text-anchor="middle" font-size="16" fill="#fff">ตัวเรือ (hull)</text>
  <line x1="640" y1="120" x2="640" y2="330" stroke="#0f172a" stroke-width="1.5" marker-start="url(#s)" marker-end="url(#d)"/>
  <text x="648" y="230" font-size="13" fill="#0f172a">Static draught</text>
  <line x1="640" y1="330" x2="640" y2="410" stroke="#0f172a" stroke-width="1.5" marker-start="url(#s)" marker-end="url(#d)"/>
  <text x="648" y="370" font-size="13" fill="#0f172a">Static UKC</text>
  <line x1="250" y1="352" x2="250" y2="410" stroke="#15803d" stroke-width="2" marker-start="url(#s)" marker-end="url(#d)"/>
  <text x="120" y="385" font-size="13" fill="#15803d" font-weight="bold">Dynamic (net) UKC</text>
  <line x1="740" y1="120" x2="740" y2="190" stroke="#1d4ed8" stroke-width="1.5" marker-start="url(#s)" marker-end="url(#d)"/>
  <text x="748" y="160" font-size="12" fill="#1d4ed8">Height</text>
  <text x="748" y="175" font-size="12" fill="#1d4ed8">of tide</text>
  <line x1="780" y1="190" x2="780" y2="410" stroke="#b91c1c" stroke-width="1.5" marker-start="url(#s)" marker-end="url(#d)"/>
  <text x="704" y="300" font-size="12" fill="#b91c1c">Charted</text>
  <text x="704" y="316" font-size="12" fill="#b91c1c">depth</text>
  <text x="410" y="440" text-anchor="middle" font-size="13" fill="#0f172a">Depth of water = Charted depth + Height of tide · Static UKC = Depth − Draught</text>
</svg>
