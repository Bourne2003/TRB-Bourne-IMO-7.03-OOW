<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การกัดกร่อน (Corrosion): กลไก ชนิด และการป้องกัน</text>
<text x="250.0" y="66.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">กลไกไฟฟ้าเคมี (electrochemical cell)</text>
<rect x="60.0" y="90.0" width="380.0" height="150.0" rx="0" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="250.0" y="112.0" font-size="12" text-anchor="middle" fill="#075985" font-weight="bold">อิเล็กโทรไลต์ (น้ำทะเล/ความชื้น/ตะกอน)</text>
<rect x="80.0" y="180.0" width="140.0" height="40.0" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
<text x="150.0" y="205.0" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="bold">Anode (ผุกร่อน)</text>
<rect x="280.0" y="180.0" width="140.0" height="40.0" rx="0" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
<text x="350.0" y="205.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">Cathode</text>
<path d="M 150 180 Q 250 130 350 180" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arR)"/><text x="250.0" y="146.0" font-size="11" text-anchor="middle" fill="#b91c1c">อิออนโลหะละลายจาก anode</text>
<line x1="150.0" y1="230.0" x2="350.0" y2="230.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<text x="250.0" y="250.0" font-size="11" text-anchor="middle" fill="#0f172a">อิเล็กตรอนไหลในเนื้อโลหะ</text>
<text x="250.0" y="275.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">ต้องมีครบ 4 อย่าง: anode, cathode, อิเล็กโทรไลต์, ทางไฟฟ้า</text>
<text x="250.0" y="293.0" font-size="11.5" text-anchor="middle" fill="#15803d">ตัดได้ข้อใดข้อหนึ่ง (coating, anode เสียสละ, ทำให้แห้ง) = หยุดการกัดกร่อน</text>
<text x="735.0" y="66.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ชนิดของการกัดกร่อนที่พบในเรือ</text>
<rect x="560.0" y="92.0" width="90.0" height="36.0" rx="0" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
<rect x="560.0" y="114.0" width="90.0" height="14.0" rx="0" fill="#b45309" stroke="#b45309" stroke-width="0"/>
<text x="660.0" y="106.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">General (uniform)</text>
<text x="660.0" y="123.0" font-size="11.5" text-anchor="start" fill="#334155">บางลงทั่วทั้งแผ่น สนิมเกล็ด (scale)</text>
<rect x="560.0" y="144.0" width="90.0" height="36.0" rx="0" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
<path d="M 572 144 q 5 14 10 0" fill="#b45309"/><path d="M 592 144 q 5 14 10 0" fill="#b45309"/><path d="M 612 144 q 5 14 10 0" fill="#b45309"/><path d="M 632 144 q 5 14 10 0" fill="#b45309"/><text x="660.0" y="158.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">Pitting</text>
<text x="660.0" y="175.0" font-size="11.5" text-anchor="start" fill="#334155">หลุมเฉพาะจุด ลึก — พื้นถัง/ท้องระวางใต้ตะกอน</text>
<rect x="560.0" y="196.0" width="90.0" height="36.0" rx="0" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
<path d="M 560 196 L 650 196 L 650 200 L 610 200 L 606 212 L 602 200 L 560 200 Z" fill="#b45309"/><line x1="606.0" y1="200.0" x2="606.0" y2="232.0" stroke="#0f172a" stroke-width="1" stroke-dasharray="2 2"/>
<text x="660.0" y="210.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">Grooving</text>
<text x="660.0" y="227.0" font-size="11.5" text-anchor="start" fill="#334155">ร่องตามแนวเชื่อม/ขอบ — ร้ายเพราะเฉพาะจุด</text>
<rect x="560.0" y="248.0" width="90.0" height="36.0" rx="0" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
<rect x="560.0" y="248.0" width="45.0" height="36.0" rx="0" fill="#fcd34d" stroke="#475569" stroke-width="1"/>
<text x="582.0" y="270.0" font-size="11" text-anchor="middle" fill="#78350f" font-weight="bold">Cu</text>
<text x="628.0" y="270.0" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="bold">Fe</text>
<text x="660.0" y="262.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">Galvanic</text>
<text x="660.0" y="279.0" font-size="11.5" text-anchor="start" fill="#334155">โลหะต่างชนิดสัมผัสกันในน้ำทะเล</text>
<rect x="560.0" y="300.0" width="90.0" height="36.0" rx="0" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
<circle cx="570" cy="328" r="5" fill="#b45309"/><circle cx="588" cy="328" r="5" fill="#b45309"/><circle cx="606" cy="328" r="5" fill="#b45309"/><circle cx="624" cy="328" r="5" fill="#b45309"/><circle cx="642" cy="328" r="5" fill="#b45309"/><text x="660.0" y="314.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">Erosion-corrosion / MIC</text>
<text x="660.0" y="331.0" font-size="11.5" text-anchor="start" fill="#334155">การไหลแรง (ท่อ ปากดูด) / แบคทีเรีย (SRB)</text>
<rect x="40.0" y="340.0" width="450.0" height="240.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="56.0" y="366.0" font-size="12.3" text-anchor="start" fill="#7c2d12" font-weight="bold">สาเหตุ/ปัจจัยเร่งในระวางและถังอับเฉา</text>
<text x="56.0" y="390.0" font-size="12.3" text-anchor="start" fill="#0f172a">• น้ำทะเลและความชื้น วงจรเปียก-แห้ง</text>
<text x="56.0" y="414.0" font-size="12.3" text-anchor="start" fill="#0f172a">• Coating เสื่อม/เสียหาย (grab, การเชื่อม, ขอบคม)</text>
<text x="56.0" y="438.0" font-size="12.3" text-anchor="start" fill="#0f172a">• อุณหภูมิสูง (ใต้ดาดฟ้าที่ถูกแดด, ข้างถังน้ำมันอุ่น)</text>
<text x="56.0" y="462.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ตะกอนค้างในถัง (ใต้ตะกอนเกิด pitting)</text>
<text x="56.0" y="486.0" font-size="12.3" text-anchor="start" fill="#0f172a">• กากสินค้ากัดกร่อน (ถ่านหิน กำมะถัน เกลือ ปุ๋ย)</text>
<text x="56.0" y="510.0" font-size="12.3" text-anchor="start" fill="#0f172a">• Anode หมด/ไม่จมน้ำ (anode ทำงานเมื่อจมเท่านั้น)</text>
<text x="56.0" y="534.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ความเค้นและการสั่น (stress corrosion/fatigue)</text>
<text x="56.0" y="558.0" font-size="12.3" text-anchor="start" fill="#0f172a">• แบคทีเรียลดซัลเฟต (SRB) ในน้ำนิ่ง</text>
<rect x="510.0" y="340.0" width="450.0" height="240.0" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="526.0" y="366.0" font-size="12.3" text-anchor="start" fill="#14532d" font-weight="bold">การป้องกันและควบคุม</text>
<text x="526.0" y="390.0" font-size="12.3" text-anchor="start" fill="#0f172a">• Coating ที่ดี (ถังอับเฉาเรือใหม่ตาม PSPC — SOLAS II-1/3-2)</text>
<text x="526.0" y="414.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ซ่อม coating จุดเสียหายเร็ว (touch-up) ตาม MSC.1/Circ.1330</text>
<text x="526.0" y="438.0" font-size="12.3" text-anchor="start" fill="#0f172a">• Sacrificial anodes (สังกะสี/อะลูมิเนียม) และ impressed current</text>
<text x="526.0" y="462.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ล้างตะกอน ล้างกากสินค้ากัดกร่อนด้วยน้ำ (และน้ำจืดถ้าทำได้)</text>
<text x="526.0" y="486.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ป้องกันความเสียหายทางกลระหว่างขนถ่าย</text>
<text x="526.0" y="510.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ตรวจตามแผน วัดความหนา (UTM) เทียบค่าที่ยอมให้</text>
<text x="526.0" y="534.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ระบายอากาศ/ทำให้แห้ง (ระวาง void)</text>
<text x="526.0" y="558.0" font-size="12.3" text-anchor="start" fill="#0f172a">• บันทึกและติดตามแนวโน้ม (trend)</text>
</svg>
