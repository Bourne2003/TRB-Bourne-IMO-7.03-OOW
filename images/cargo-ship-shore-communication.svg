<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การสื่อสารระหว่างการขนถ่ายสินค้า (Ship–shore communication)</text>
<line x1="170.0" y1="120.0" x2="500.0" y2="120.0" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="500.0" y1="120.0" x2="830.0" y2="120.0" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="500.0" y1="120.0" x2="500.0" y2="270.0" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="500.0" y1="270.0" x2="170.0" y2="270.0" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="500.0" y1="270.0" x2="830.0" y2="270.0" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="500.0" y1="270.0" x2="500.0" y2="400.0" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="830.0" y1="120.0" x2="830.0" y2="270.0" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="500.0" y1="270.0" x2="830.0" y2="120.0" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="170.0" y1="120.0" x2="500.0" y2="270.0" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="30.0" y="86.0" width="280.0" height="68.0" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="170.0" y="114.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">นายเรือ</text>
<text x="170.0" y="136.0" font-size="11.5" text-anchor="middle" fill="#334155">Master</text>
<rect x="360.0" y="86.0" width="280.0" height="68.0" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="500.0" y="114.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ต้นเรือ / Chief Officer</text>
<text x="500.0" y="136.0" font-size="11.5" text-anchor="middle" fill="#334155">ผู้รับผิดชอบงานสินค้า</text>
<rect x="690.0" y="86.0" width="280.0" height="68.0" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="830.0" y="114.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">Terminal / Stevedore</text>
<text x="830.0" y="136.0" font-size="11.5" text-anchor="middle" fill="#334155">Shore supervisor, foreman</text>
<rect x="360.0" y="236.0" width="280.0" height="68.0" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="500.0" y="264.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">OOW (นายยามสินค้า)</text>
<text x="500.0" y="286.0" font-size="11.5" text-anchor="middle" fill="#334155">Cargo watch</text>
<rect x="30.0" y="236.0" width="280.0" height="68.0" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="170.0" y="264.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ห้องเครื่อง</text>
<text x="170.0" y="286.0" font-size="11.5" text-anchor="middle" fill="#334155">ballast / power / pumps</text>
<rect x="690.0" y="236.0" width="280.0" height="68.0" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="830.0" y="264.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ผู้ควบคุมเครน/ปั๊มฝั่ง</text>
<text x="830.0" y="286.0" font-size="11.5" text-anchor="middle" fill="#334155">Crane / loading arm</text>
<rect x="360.0" y="366.0" width="280.0" height="68.0" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="500.0" y="394.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ลูกเรือยาม / AB</text>
<text x="500.0" y="416.0" font-size="11.5" text-anchor="middle" fill="#334155">gangway, mooring, deck rounds</text>
<rect x="40.0" y="450.0" width="920.0" height="60.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="56.0" y="474.0" font-size="12" text-anchor="start" fill="#7f1d1d" font-weight="bold">ตกลงก่อนเริ่ม: แผนขนถ่าย/อัตรา, ช่องวิทยุและภาษา, ผู้ติดต่อ, สัญญาณ "STOP" ฉุกเฉิน (วิทยุ/แตร/ไฟ), Emergency stop ของปั๊ม/เครน,</text>
<text x="56.0" y="494.0" font-size="12" text-anchor="start" fill="#7f1d1d">ขีดจำกัด (draught, list, stress, air draught ใต้เครน), การแจ้งเตือนล่วงหน้าก่อนเปลี่ยนอัตรา/จบงาน (topping off) — ทวนคำสั่งทุกครั้ง</text>
</svg>
