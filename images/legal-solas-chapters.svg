<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SOLAS 1974 (as amended) — บทต่าง ๆ</text>
<rect x="40.0" y="55.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="75.0" y="81.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">I</text>
<rect x="116.0" y="55.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="128.0" y="80.0" font-size="12.5" text-anchor="start" fill="#0f172a">บททั่วไป การสำรวจและใบรับรอง</text>
<rect x="510.0" y="55.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="545.0" y="81.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">II-1</text>
<rect x="586.0" y="55.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="598.0" y="80.0" font-size="12.5" text-anchor="start" fill="#0f172a">โครงสร้าง การแบ่งช่อง เสถียรภาพ เครื่องจักร ไฟฟ้า</text>
<rect x="40.0" y="104.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="75.0" y="130.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">II-2</text>
<rect x="116.0" y="104.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="128.0" y="129.0" font-size="12.5" text-anchor="start" fill="#0f172a">การป้องกัน ตรวจจับ ดับไฟ</text>
<rect x="510.0" y="104.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="545.0" y="130.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">III</text>
<rect x="586.0" y="104.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="598.0" y="129.0" font-size="12.5" text-anchor="start" fill="#0f172a">อุปกรณ์และการจัดการช่วยชีวิต</text>
<rect x="40.0" y="153.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="75.0" y="179.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">IV</text>
<rect x="116.0" y="153.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="128.0" y="178.0" font-size="12.5" text-anchor="start" fill="#0f172a">การสื่อสารทางวิทยุ (GMDSS)</text>
<rect x="510.0" y="153.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="545.0" y="179.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">V</text>
<rect x="586.0" y="153.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="598.0" y="178.0" font-size="12.5" text-anchor="start" fill="#0f172a">ความปลอดภัยในการเดินเรือ</text>
<rect x="40.0" y="202.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="75.0" y="228.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">VI</text>
<rect x="116.0" y="202.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="128.0" y="227.0" font-size="12.5" text-anchor="start" fill="#0f172a">การบรรทุกสินค้าและน้ำมันเชื้อเพลิง</text>
<rect x="510.0" y="202.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="545.0" y="228.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">VII</text>
<rect x="586.0" y="202.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="598.0" y="227.0" font-size="12.5" text-anchor="start" fill="#0f172a">การบรรทุกสินค้าอันตราย</text>
<rect x="40.0" y="251.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="75.0" y="277.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">VIII</text>
<rect x="116.0" y="251.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="128.0" y="276.0" font-size="12.5" text-anchor="start" fill="#0f172a">เรือนิวเคลียร์</text>
<rect x="510.0" y="251.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="545.0" y="277.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">IX</text>
<rect x="586.0" y="251.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="598.0" y="276.0" font-size="12.5" text-anchor="start" fill="#0f172a">การจัดการเพื่อความปลอดภัย (ISM Code)</text>
<rect x="40.0" y="300.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="75.0" y="326.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">X</text>
<rect x="116.0" y="300.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="128.0" y="325.0" font-size="12.5" text-anchor="start" fill="#0f172a">เรือความเร็วสูง (HSC Code)</text>
<rect x="510.0" y="300.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="545.0" y="326.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">XI-1</text>
<rect x="586.0" y="300.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="598.0" y="325.0" font-size="12.5" text-anchor="start" fill="#0f172a">มาตรการพิเศษ: RO, ESP, IMO number, CSR, PSC</text>
<rect x="40.0" y="349.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="75.0" y="375.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">XI-2</text>
<rect x="116.0" y="349.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="128.0" y="374.0" font-size="12.5" text-anchor="start" fill="#0f172a">มาตรการพิเศษด้านการรักษาความปลอดภัย (ISPS)</text>
<rect x="510.0" y="349.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="545.0" y="375.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">XII</text>
<rect x="586.0" y="349.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="598.0" y="374.0" font-size="12.5" text-anchor="start" fill="#0f172a">มาตรการเพิ่มเติมสำหรับ bulk carrier</text>
<rect x="40.0" y="398.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="75.0" y="424.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">XIII</text>
<rect x="116.0" y="398.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="128.0" y="423.0" font-size="12.5" text-anchor="start" fill="#0f172a">การตรวจสอบการปฏิบัติตาม (IMSAS)</text>
<rect x="510.0" y="398.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="545.0" y="424.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">XIV</text>
<rect x="586.0" y="398.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="598.0" y="423.0" font-size="12.5" text-anchor="start" fill="#0f172a">เรือในน่านน้ำขั้วโลก (Polar Code)</text>
<rect x="40.0" y="447.0" width="70.0" height="40.0" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="75.0" y="473.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">XV</text>
<rect x="116.0" y="447.0" width="374.0" height="40.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="128.0" y="472.0" font-size="12.5" text-anchor="start" fill="#0f172a">การขนส่งบุคลากรอุตสาหกรรม (IP Code)</text>
<text x="500.0" y="510.0" font-size="12" text-anchor="middle" fill="#334155">เรือต้องมีใบรับรองตาม SOLAS บทที่ I และอยู่ใต้การตรวจของรัฐเจ้าของธง/RO และรัฐเจ้าท่า — ติดตามการแก้ไขที่มีผลบังคับล่าสุดเสมอ</text>
</svg>
