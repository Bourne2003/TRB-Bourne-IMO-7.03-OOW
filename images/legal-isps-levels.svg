<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ISPS Code — ระดับการรักษาความปลอดภัยและผู้รับผิดชอบ</text>
<rect x="30.0" y="60.0" width="150.0" height="76.0" rx="10" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="105.0" y="94.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">ระดับ 1</text>
<text x="105.0" y="116.0" font-size="11.5" text-anchor="middle" fill="#fff">ปกติ (normal)</text>
<rect x="190.0" y="60.0" width="380.0" height="76.0" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
<text x="204.0" y="90.0" font-size="11.5" text-anchor="start" fill="#0f172a">มาตรการพื้นฐานตลอดเวลา: ควบคุมการเข้าออก ตรวจบุคคล/สัมภาระ</text>
<text x="204.0" y="110.0" font-size="11.5" text-anchor="start" fill="#0f172a">เขตหวงห้าม ตรวจตราดาดฟ้าและบริเวณเรือ การขนถ่ายเสบียง</text>
<rect x="30.0" y="150.0" width="150.0" height="76.0" rx="10" fill="#ca8a04" stroke="#ca8a04" stroke-width="0"/>
<text x="105.0" y="184.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">ระดับ 2</text>
<text x="105.0" y="206.0" font-size="11.5" text-anchor="middle" fill="#fff">เพิ่มขึ้น (heightened)</text>
<rect x="190.0" y="150.0" width="380.0" height="76.0" rx="10" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/>
<text x="204.0" y="180.0" font-size="11.5" text-anchor="start" fill="#0f172a">มาตรการเพิ่มเติมช่วงเวลาที่ความเสี่ยงสูงขึ้น: เพิ่มยาม</text>
<text x="204.0" y="200.0" font-size="11.5" text-anchor="start" fill="#0f172a">จำกัดทางเข้า ตรวจละเอียดขึ้น</text>
<rect x="30.0" y="240.0" width="150.0" height="76.0" rx="10" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<text x="105.0" y="274.0" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">ระดับ 3</text>
<text x="105.0" y="296.0" font-size="11.5" text-anchor="middle" fill="#fff">พิเศษ (exceptional)</text>
<rect x="190.0" y="240.0" width="380.0" height="76.0" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="204.0" y="270.0" font-size="11.5" text-anchor="start" fill="#0f172a">ช่วงเวลาจำกัดที่เหตุใกล้จะเกิด/เกิดขึ้น: ปฏิบัติตามคำสั่ง</text>
<text x="204.0" y="290.0" font-size="11.5" text-anchor="start" fill="#0f172a">หน่วยงานรัฐ อาจหยุดการทำงาน อพยพ</text>
<rect x="600.0" y="60.0" width="370.0" height="256.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="614.0" y="84.0" font-size="12" text-anchor="start" fill="#1d4ed8" font-weight="bold">ผู้รับผิดชอบ</text>
<text x="614.0" y="107.0" font-size="12" text-anchor="start" fill="#0f172a">• SSO — Ship Security Officer (บนเรือ)</text>
<text x="614.0" y="130.0" font-size="12" text-anchor="start" fill="#0f172a">• CSO — Company Security Officer</text>
<text x="614.0" y="153.0" font-size="12" text-anchor="start" fill="#0f172a">• PFSO — Port Facility Security Officer</text>
<text x="614.0" y="176.0" font-size="12" text-anchor="start" fill="#0f172a">• Contracting Government/รัฐ กำหนดระดับ</text>
<text x="614.0" y="199.0" font-size="12" text-anchor="start" fill="#0f172a"></text>
<text x="614.0" y="222.0" font-size="12" text-anchor="start" fill="#1d4ed8" font-weight="bold">เอกสาร/ระบบ</text>
<text x="614.0" y="245.0" font-size="12" text-anchor="start" fill="#0f172a">• Ship Security Plan (SSP) — ลับ</text>
<text x="614.0" y="268.0" font-size="12" text-anchor="start" fill="#0f172a">• ISSC 5 ปี · บันทึกกิจกรรมความปลอดภัย</text>
<text x="614.0" y="291.0" font-size="12" text-anchor="start" fill="#0f172a">• Declaration of Security (DoS) เมื่อจำเป็น</text>
<rect x="30.0" y="340.0" width="940.0" height="165.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="46.0" y="366.0" font-size="11.8" text-anchor="start" fill="#0f172a">Ship Security Alert System (SSAS — SOLAS XI-2/6): ส่งสัญญาณเตือนแบบเงียบ (covert) จากเรือไปยังบริษัท/รัฐ — ไม่มีสัญญาณบนเรือ ไม่ส่งไปเรืออื่น</text>
<text x="46.0" y="396.0" font-size="11.8" text-anchor="start" fill="#0f172a">อย่างน้อยสองจุดเปิด (สะพานเดินเรือ + อีกจุด) · ทดสอบตามแผน (แจ้งผู้รับก่อน) · ห้ามบอกตำแหน่งสวิตช์ให้คนที่ไม่เกี่ยวข้อง</text>
<text x="46.0" y="426.0" font-size="11.8" text-anchor="start" fill="#0f172a">OOW: ควบคุมทางขึ้นเรือ (gangway) ตามระดับ บันทึกผู้มาเยือน ตรวจบัตร เฝ้าระวังเรือเล็กเข้าใกล้ รายงานสิ่งผิดปกติต่อ SSO/นายเรือ</text>
<text x="46.0" y="456.0" font-size="11.8" text-anchor="start" fill="#0f172a">การฝึก: security drills อย่างน้อยทุก 3 เดือน (และเมื่อเปลี่ยนลูกเรือมากกว่า 25%) · exercises อย่างน้อยปีละครั้ง</text>
<text x="46.0" y="486.0" font-size="11.8" text-anchor="start" fill="#0f172a">โจรสลัด/ปล้นเรือ: ปฏิบัติตาม SSP, แนวทางอุตสาหกรรม (BMP ฉบับปัจจุบัน), รายงานศูนย์ข้อมูลภูมิภาค (เช่น ReCAAP ISC ในเอเชีย, UKMTO)</text>
</svg>
