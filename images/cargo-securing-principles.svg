<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">หลักการยึดสินค้า (CSS Code): แรง มุม lashing และ Maximum Securing Load (MSL)</text>
<rect x="160.0" y="170.0" width="200.0" height="140.0" rx="0" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="260.0" y="246.0" font-size="14" text-anchor="middle" fill="#78350f" font-weight="bold">สินค้า W ตัน</text>
<rect x="60.0" y="310.0" width="400.0" height="16.0" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>
<line x1="160.0" y1="200.0" x2="80.0" y2="310.0" stroke="#b91c1c" stroke-width="3"/>
<line x1="360.0" y1="200.0" x2="440.0" y2="310.0" stroke="#b91c1c" stroke-width="3"/>
<path d="M 110 310 A 30 30 0 0 0 98 287" fill="none" stroke="#0f172a"/><text x="120.0" y="298.0" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">α</text>
<line x1="260.0" y1="146.0" x2="380.0" y2="146.0" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arB)"/>
<text x="260.0" y="138.0" font-size="12" text-anchor="start" fill="#1d4ed8" font-weight="bold">แรงขวาง (โคลง)</text>
<line x1="260.0" y1="320.0" x2="260.0" y2="380.0" stroke="#15803d" stroke-width="3" marker-end="url(#arG)"/>
<text x="270.0" y="375.0" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">แรงเสียดทาน/น้ำหนัก</text>
<text x="260.0" y="70.0" font-size="12" text-anchor="middle" fill="#0f172a">มุม lashing (α) ต่ำ → ต้านการเลื่อนได้ดี</text>
<text x="260.0" y="88.0" font-size="12" text-anchor="middle" fill="#334155">มุมสูงขึ้น → ต้านการยกตัว/ล้มได้ดีขึ้น — ใช้ตามที่ CSM กำหนด</text>
<text x="520.0" y="70.0" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">MSL เป็น % ของแรงขาดต่ำสุด (MBL) — CSS Code Annex 13</text>
<rect x="520.0" y="90.0" width="360.0" height="26.0" rx="0" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="880.0" y="90.0" width="80.0" height="26.0" rx="0" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="528.0" y="108.0" font-size="12" text-anchor="start" fill="#0f172a">Shackles, rings, deck eyes, turnbuckles (เหล็กกล้าอ่อน)</text>
<text x="920.0" y="108.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">50%</text>
<rect x="520.0" y="118.0" width="360.0" height="26.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="880.0" y="118.0" width="80.0" height="26.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="528.0" y="136.0" font-size="12" text-anchor="start" fill="#0f172a">Fibre rope</text>
<text x="920.0" y="136.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">33%</text>
<rect x="520.0" y="146.0" width="360.0" height="26.0" rx="0" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="880.0" y="146.0" width="80.0" height="26.0" rx="0" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="528.0" y="164.0" font-size="12" text-anchor="start" fill="#0f172a">Web lashing</text>
<text x="920.0" y="164.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">50%</text>
<rect x="520.0" y="174.0" width="360.0" height="26.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="880.0" y="174.0" width="80.0" height="26.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="528.0" y="192.0" font-size="12" text-anchor="start" fill="#0f172a">Wire rope (ใช้ครั้งเดียว)</text>
<text x="920.0" y="192.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">80%</text>
<rect x="520.0" y="202.0" width="360.0" height="26.0" rx="0" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="880.0" y="202.0" width="80.0" height="26.0" rx="0" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="528.0" y="220.0" font-size="12" text-anchor="start" fill="#0f172a">Wire rope (ใช้ซ้ำ)</text>
<text x="920.0" y="220.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">30%</text>
<rect x="520.0" y="230.0" width="360.0" height="26.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<rect x="880.0" y="230.0" width="80.0" height="26.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="528.0" y="248.0" font-size="12" text-anchor="start" fill="#0f172a">Steel band (ใช้ครั้งเดียว)</text>
<text x="920.0" y="248.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">70%</text>
<rect x="520.0" y="258.0" width="360.0" height="26.0" rx="0" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="880.0" y="258.0" width="80.0" height="26.0" rx="0" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="528.0" y="276.0" font-size="12" text-anchor="start" fill="#0f172a">Chains</text>
<text x="920.0" y="276.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">50%</text>
<rect x="520.0" y="300.0" width="440.0" height="140.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="534.0" y="324.0" font-size="12" text-anchor="start" fill="#7c2d12" font-weight="bold">กฎหัวแม่มือ (rule-of-thumb) ของ CSS Code:</text>
<text x="534.0" y="344.0" font-size="12" text-anchor="start" fill="#7c2d12">ผลรวม MSL ของอุปกรณ์ยึดแต่ละข้าง (ซ้ายและขวา)</text>
<text x="534.0" y="364.0" font-size="12" text-anchor="start" fill="#7c2d12">ของสินค้าหนึ่งหน่วย ควรเท่ากับน้ำหนักของสินค้า</text>
<text x="534.0" y="384.0" font-size="12" text-anchor="start" fill="#7c2d12">เช่น สินค้า 30 ตัน → ข้างละ ≥ 30 t MSL</text>
<text x="534.0" y="404.0" font-size="12" text-anchor="start" fill="#7c2d12">ใช้เมื่อไม่มีวิธีคำนวณละเอียด (Advanced calculation</text>
<text x="534.0" y="424.0" font-size="12" text-anchor="start" fill="#7c2d12">method ใน CSM) — แรงเร่งจริงขึ้นกับตำแหน่ง/GM</text>
</svg>
