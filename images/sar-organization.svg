<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="420" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">โครงสร้างการค้นหาและช่วยเหลือ (SAR system) ตาม IAMSAR</text>
<rect x="390" y="55" width="220" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="500.0" y="85" text-anchor="middle" font-size="14" font-weight="bold">SAR Coordinator (SC)</text><text x="500.0" y="107" text-anchor="middle" font-size="11" fill="#334155">รัฐ/หน่วยงานรับผิดชอบระบบ SAR</text>
<rect x="390" y="160" width="220" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="500.0" y="190" text-anchor="middle" font-size="14" font-weight="bold">RCC / MRCC → SMC</text><text x="500.0" y="212" text-anchor="middle" font-size="11" fill="#334155">SAR Mission Coordinator</text>
<rect x="120" y="270" width="220" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="230.0" y="300" text-anchor="middle" font-size="14" font-weight="bold">OSC (On-Scene Coordinator)</text><text x="230.0" y="322" text-anchor="middle" font-size="11" fill="#334155">มักเป็นเรือ/หน่วยแรกที่ถึง</text>
<rect x="390" y="270" width="220" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="500.0" y="300" text-anchor="middle" font-size="14" font-weight="bold">SRU / เรือพาณิชย์</text><text x="500.0" y="322" text-anchor="middle" font-size="11" fill="#334155">หน่วยค้นหา (ships, boats)</text>
<rect x="660" y="270" width="220" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="770.0" y="300" text-anchor="middle" font-size="14" font-weight="bold">ACO / อากาศยาน</text><text x="770.0" y="322" text-anchor="middle" font-size="11" fill="#334155">Aircraft coordinator</text>
<line x1="500" y1="125" x2="500" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<line x1="500" y1="230" x2="230" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<line x1="500" y1="230" x2="500" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<line x1="500" y1="230" x2="770" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<line x1="342" y1="305" x2="388" y2="305" stroke="#334155" stroke-width="2" stroke-dasharray="5 4"/><line x1="612" y1="305" x2="658" y2="305" stroke="#334155" stroke-width="2" stroke-dasharray="5 4"/>
<text x="40" y="380" font-size="13">ระยะของเหตุ: Uncertainty (INCERFA) → Alert (ALERFA) → Distress (DETRESFA)</text>
<text x="40" y="402" font-size="13">เรือพาณิชย์ที่ได้รับสัญญาณ: ตอบรับ · plot · แจ้ง RCC · ไปที่เกิดเหตุ (SOLAS V/33) · ทำหน้าที่ OSC ถ้าได้รับมอบหมาย</text>
</svg>
