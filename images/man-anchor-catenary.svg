<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker><marker id="arO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c2410c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การทอดสมอ: โซ่สมอรูปโค้ง catenary และวงแกว่ง (swinging circle)</text>
<rect x="30" y="150" width="600" height="180" fill="#e0f2fe"/><rect x="30" y="330" width="600" height="30" fill="#d6d3d1"/><text x="40.0" y="352.0" font-size="12" text-anchor="start" fill="#44403c" font-weight="bold">พื้นทะเล (holding ground)</text>
<path d="M 510 110 L 620 110 L 620 180 L 540 180 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/><polyline points="124.0,330.0 241.0,330.0 245.7,330.0 250.3,329.8 255.0,329.6 259.6,329.2 264.3,328.8 268.9,328.3 273.6,327.6 278.2,326.9 282.9,326.1 287.5,325.2 292.2,324.2 296.8,323.1 301.5,321.9 306.1,320.6 310.8,319.2 315.4,317.7 320.1,316.1 324.7,314.4 329.4,312.6 334.0,310.7 338.7,308.8 343.3,306.7 348.0,304.5 352.6,302.2 357.3,299.8 361.9,297.4 366.6,294.8 371.2,292.1 375.9,289.3 380.5,286.5 385.2,283.5 389.8,280.4 394.5,277.2 399.1,274.0 403.8,270.6 408.4,267.1 413.1,263.5 417.7,259.8 422.4,256.0 427.0,252.1 431.7,248.1 436.3,244.0 441.0,239.8 445.6,235.5 450.3,231.0 454.9,226.5 459.6,221.9 464.2,217.1 468.9,212.3 473.5,207.3 478.2,202.2 482.8,197.0 487.5,191.7 492.1,186.3 496.8,180.8 501.4,175.2 506.1,169.4 510.7,163.6 515.4,157.6 520.0,151.5" fill="none" stroke="#0f172a" stroke-width="3"/><path d="M 120.02712196864155 316 l -14 14 l 30 0 z" fill="#0f172a"/><text x="119.0" y="308.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">สมอ (anchor)</text>
<text x="230.0" y="352.0" font-size="11.5" text-anchor="start" fill="#1c1917">โซ่ส่วนที่นอนพื้น → แรงที่สมอเป็นแนวนอน (สมอกินดิน)</text>
<line x1="620.0" y1="120.0" x2="620.0" y2="330.0" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arO)"/>
<line x1="620.0" y1="330.0" x2="620.0" y2="120.0" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arO)"/>
<text x="612.0" y="245.0" font-size="12.5" text-anchor="end" fill="#c2410c" font-weight="bold">y ≈ 35 m</text>
<text x="612.0" y="263.0" font-size="11.5" text-anchor="end" fill="#c2410c">(ความลึก + ความสูง</text>
<text x="612.0" y="279.0" font-size="11.5" text-anchor="end" fill="#c2410c">ช่องโซ่เหนือน้ำ)</text>
<line x1="30.0" y1="150.0" x2="630.0" y2="150.0" stroke="#0284c7" stroke-width="2"/>
<line x1="430.0" y1="90.0" x2="500.0" y2="90.0" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="424.0" y="94.0" font-size="12" text-anchor="end" fill="#1d4ed8" font-weight="bold">ลม/กระแสดันเรือ → แรง H</text>
<rect x="30" y="385" width="600" height="195" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="44.0" y="409.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">ความยาวโซ่ส่วนโค้งที่ทำให้แรงที่สมอเป็นแนวนอนพอดี:</text>
<text x="44.0" y="430.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">s = √( y² + 2·a·y )   โดย a = H ÷ w</text>
<text x="44.0" y="451.0" font-size="12.5" text-anchor="start" fill="#0f172a">H = แรงดึงแนวนอนจากลม กระแส คลื่น · w = น้ำหนักโซ่ในน้ำต่อเมตร</text>
<text x="44.0" y="472.0" font-size="12.5" text-anchor="start" fill="#0f172a">ตัวอย่าง: โซ่ 68 mm (≈ 88 kg/m ในน้ำ), y = 35 m</text>
<text x="44.0" y="493.0" font-size="12.5" text-anchor="start" fill="#0f172a">  H = 15 t → a ≈ 170 m → s ≈ 115 m (≈ 4.2 shackles) + ส่วนนอนพื้น</text>
<text x="44.0" y="514.0" font-size="12.5" text-anchor="start" fill="#0f172a">  H = 30 t → a ≈ 341 m → s ≈ 158 m (≈ 5.8 shackles) + ส่วนนอนพื้น</text>
<text x="44.0" y="535.0" font-size="12.5" text-anchor="start" fill="#0f172a">1 shackle = 15 fathoms = 27.5 m · กฎหัวแม่มือ ≈ 1.5√(ความลึก m) shackles</text>
<text x="44.0" y="556.0" font-size="12.5" text-anchor="start" fill="#0f172a">เผื่อเสมอ: โซ่นอนพื้นอีกช่วงหนึ่ง และเพิ่มเมื่อสภาพอากาศแย่ลง</text>
<text x="820.0" y="70.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">วงแกว่ง (มุมมองจากด้านบน)</text>
<circle cx="820" cy="330" r="150" fill="#f0f9ff" stroke="#0369a1" stroke-width="2" stroke-dasharray="7 4"/><circle cx="820" cy="330" r="5" fill="#0f172a"/><text x="828.0" y="346.0" font-size="11" text-anchor="start" fill="#0f172a" font-weight="bold">สมอ</text>
<line x1="820.0" y1="330.0" x2="900.0" y2="290.0" stroke="#0f172a" stroke-width="2"/>
<polygon points="900.0,290.0 910.6,276.8 968.4,247.9 974.7,260.4 916.9,289.4" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
<line x1="820.0" y1="330.0" x2="670.0" y2="330.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arR)"/>
<text x="745.0" y="322.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">รัศมี</text>
<text x="820.0" y="505.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">รัศมีวงแกว่ง ≈ ความยาวโซ่ (ระยะราบ)</text>
<text x="820.0" y="523.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">+ ความยาวเรือ (LOA) — ใช้ตั้ง anchor watch</text>
<text x="820.0" y="541.0" font-size="12" text-anchor="middle" fill="#b91c1c">circle/guard zone บน ECDIS และเรดาร์</text>
<text x="820.0" y="566.0" font-size="12" text-anchor="middle" fill="#334155">ระวังระยะกับเรือข้างเคียงที่วงแกว่งต่างกัน</text>
</svg>
