<text x="687" y="94" font-size="12.5" font-weight="bold">ข้อมูลสมมติ</text>
<text x="687" y="115" font-size="12.5">charted depth จุดตื้น 8.6 m</text>
<text x="687" y="136" font-size="12.5">draught 10.5 m · squat ≈ 0.5 m</text>
<text x="687" y="157" font-size="12.5">UKC ขั้นต่ำตามบริษัท 1.0 m</text>
<text x="687" y="178" font-size="12.5"></text>
<text x="687" y="199" font-size="12.5" font-weight="bold">ความลึกที่ต้องการ</text>
<text x="687" y="220" font-size="12.5">10.5 + 0.5 + 1.0 = 12.0 m</text>
<text x="687" y="241" font-size="12.5" font-weight="bold">ระดับน้ำที่ต้องการ</text>
<text x="687" y="262" font-size="12.5">12.0 − 8.6 = 3.4 m เหนือ CD</text>
<text x="687" y="283" font-size="12.5"></text>
<text x="687" y="304" font-size="12.5">factor ขาขึ้น (3.4−0.7)/3.3 = 0.82</text>
<text x="687" y="325" font-size="12.5">factor ขาลง (3.4−0.8)/3.2 = 0.81</text>
<text x="687" y="346" font-size="12.5">→ จาก curve ≈ HW−1h46m ถึง HW+1h50m</text>
<text x="687" y="367" font-size="12.5"></text>
<text x="687" y="388" font-size="12.5">เผื่อความกดอากาศสูง/ลมออกฝั่ง</text>
<text x="687" y="409" font-size="12.5">และความคลาดของพยากรณ์ด้วย</text>
<text x="70" y="502" font-size="11" fill="#64748b">เส้นโค้งสมมติเป็นรูป cosine ระหว่าง LW–HW เพื่ออธิบายหลักการ บนเรือจริงใช้ tidal curve ของท่าใน ATT หรือ TotalTide</text>
