<text x="46.0" y="504.0" font-size="12" text-anchor="start" fill="#0f172a">ILO รับผิดชอบมาตรฐานแรงงาน (MLC 2006) · IMO Member State Audit Scheme (บังคับ) ตรวจการปฏิบัติตามของรัฐภาคี (III Code)</text>
