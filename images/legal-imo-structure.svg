<text x="46.0" y="426.0" font-size="12" text-anchor="start" fill="#0f172a">Tacit acceptance — การแก้ไขภาคผนวก/บททางเทคนิคมีผลตามวันที่กำหนด เว้นแต่รัฐคัดค้านถึงเกณฑ์ (ทำให้ SOLAS/MARPOL ทันสมัยเร็ว)</text>
<text x="46.0" y="452.0" font-size="12" text-anchor="start" fill="#0f172a">ตราสาร: อนุสัญญา (convention) · พิธีสาร (protocol) · ประมวล (code — บังคับเมื่ออ้างในอนุสัญญา เช่น ISM, ISPS, IMDG, FSS, LSA)</text>
