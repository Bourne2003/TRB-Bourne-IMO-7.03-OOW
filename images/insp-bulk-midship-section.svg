<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ภาคตัดกลางลำเรือ Bulk carrier (single side skin): โครงสร้างสำคัญและจุดที่มักพบความเสียหาย</text>
<path d="M 80 120 L 580 120 L 580 520 Q 580 560 540 560 L 120 560 Q 80 560 80 520 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/><path d="M 80 500 L 580 500" stroke="#0f172a" stroke-width="2.5"/><rect x="81" y="501" width="498" height="58" fill="#bfdbfe" opacity="0.6"/><line x1="110.0" y1="500.0" x2="110.0" y2="558.0" stroke="#475569" stroke-width="1.2"/>
<line x1="165.0" y1="500.0" x2="165.0" y2="558.0" stroke="#475569" stroke-width="1.2"/>
