<text x="135.0" y="175.0" font-size="11.5" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Topside tank</text>
<text x="120.0" y="480.0" font-size="11.5" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Hopper</text>
<text x="120.0" y="494.0" font-size="11.5" text-anchor="middle" fill="#1e3a8a" font-weight="bold">tank</text>
<rect x="180.0" y="92.0" width="300.0" height="28.0" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
<rect x="170.0" y="78.0" width="320.0" height="16.0" rx="0" fill="#64748b" stroke="#0f172a" stroke-width="2"/>
<text x="330.0" y="72.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">ฝาระวาง (hatch cover) บน hatch coaming</text>
<path d="M 200 500 L 130 400 L 170 330 Q 330 270 490 330 L 530 400 L 460 500 Z" fill="#fde68a" opacity="0.5"/><text x="330.0" y="420.0" font-size="14" text-anchor="middle" fill="#78350f" font-weight="bold">ระวางสินค้า (cargo hold)</text>
<circle cx="100" cy="300" r="11" fill="#b91c1c"/><text x="100.0" y="304.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<circle cx="170" cy="470" r="11" fill="#b91c1c"/><text x="170.0" y="474.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<circle cx="370" cy="505" r="11" fill="#b91c1c"/><text x="370.0" y="509.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<circle cx="480" cy="110" r="11" fill="#b91c1c"/><text x="480.0" y="114.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<circle cx="540" cy="142" r="11" fill="#b91c1c"/><text x="540.0" y="146.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
<circle cx="162" cy="122" r="11" fill="#b91c1c"/><text x="162.0" y="126.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">6</text>
<circle cx="570" cy="260" r="11" fill="#b91c1c"/><text x="570.0" y="264.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">7</text>
<circle cx="450" cy="545" r="11" fill="#b91c1c"/><text x="450.0" y="549.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">8</text>
<circle cx="472" cy="486" r="11" fill="#b91c1c"/><text x="472.0" y="490.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">9</text>
<rect x="620.0" y="60.0" width="365.0" height="560.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="634.0" y="84.0" font-size="14" text-anchor="start" fill="#7c2d12" font-weight="bold">จุดที่ต้องตรวจเป็นพิเศษ (ตัวอย่าง)</text>
<circle cx="644" cy="108" r="11" fill="#b91c1c"/><text x="644.0" y="112.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<text x="664.0" y="112.0" font-size="11.5" text-anchor="start" fill="#0f172a">Side shell frames และ end brackets</text>
<text x="664.0" y="129.0" font-size="11.5" text-anchor="start" fill="#0f172a">— grab/รถตักชน, กัดกร่อนที่ปลายล่าง</text>
<text x="664.0" y="146.0" font-size="11.5" text-anchor="start" fill="#0f172a">(necking), แยกจากเปลือกเรือ</text>
<circle cx="644" cy="169" r="11" fill="#b91c1c"/><text x="644.0" y="173.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="664.0" y="173.0" font-size="11.5" text-anchor="start" fill="#0f172a">แผ่น hopper ด้านลาด — grab กระแทก</text>
<text x="664.0" y="190.0" font-size="11.5" text-anchor="start" fill="#0f172a">บุบ, กัดกร่อนจากกากสินค้า</text>
<circle cx="644" cy="213" r="11" fill="#b91c1c"/><text x="644.0" y="217.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<text x="664.0" y="217.0" font-size="11.5" text-anchor="start" fill="#0f172a">Tank top (inner bottom) —</text>
<text x="664.0" y="234.0" font-size="11.5" text-anchor="start" fill="#0f172a">grab/ค้อนทุบ บุบ, น้ำหนักเกิน</text>
<text x="664.0" y="251.0" font-size="11.5" text-anchor="start" fill="#0f172a">(local strength)</text>
<circle cx="644" cy="274" r="11" fill="#b91c1c"/><text x="644.0" y="278.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<text x="664.0" y="278.0" font-size="11.5" text-anchor="start" fill="#0f172a">Hatch coaming มุมช่องระวาง (hatch</text>
<text x="664.0" y="295.0" font-size="11.5" text-anchor="start" fill="#0f172a">corners) — รอยร้าวจากความเค้นสูง,</text>
<text x="664.0" y="312.0" font-size="11.5" text-anchor="start" fill="#0f172a">เครน/grab ชน</text>
<circle cx="644" cy="335" r="11" fill="#b91c1c"/><text x="644.0" y="339.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
<text x="664.0" y="339.0" font-size="11.5" text-anchor="start" fill="#0f172a">ใต้ดาดฟ้าใน topside tank — แดดร้อน</text>
<text x="664.0" y="356.0" font-size="11.5" text-anchor="start" fill="#0f172a">กัดกร่อนเร็ว coating เสื่อม</text>
<circle cx="644" cy="379" r="11" fill="#b91c1c"/><text x="644.0" y="383.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">6</text>
<text x="664.0" y="383.0" font-size="11.5" text-anchor="start" fill="#0f172a">Cross deck/ดาดฟ้าระหว่างช่องระวาง</text>
<text x="664.0" y="400.0" font-size="11.5" text-anchor="start" fill="#0f172a">และฝาระวาง — คลื่นซัด เสียรูป</text>
<text x="664.0" y="417.0" font-size="11.5" text-anchor="start" fill="#0f172a">ซีลรั่ว</text>
<circle cx="644" cy="440" r="11" fill="#b91c1c"/><text x="644.0" y="444.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">7</text>
<text x="664.0" y="444.0" font-size="11.5" text-anchor="start" fill="#0f172a">เปลือกเรือด้านข้าง (side shell) —</text>
<text x="664.0" y="461.0" font-size="11.5" text-anchor="start" fill="#0f172a">ถูกเรือลากจูง/ท่าชน, กัดกร่อนบริเวณ</text>
<text x="664.0" y="478.0" font-size="11.5" text-anchor="start" fill="#0f172a">splash zone</text>
<circle cx="644" cy="501" r="11" fill="#b91c1c"/><text x="644.0" y="505.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">8</text>
<text x="664.0" y="505.0" font-size="11.5" text-anchor="start" fill="#0f172a">แผ่นท้องเรือ/โครงภายใน double</text>
<text x="664.0" y="522.0" font-size="11.5" text-anchor="start" fill="#0f172a">bottom — pitting ใต้ตะกอน, slamming</text>
<text x="664.0" y="539.0" font-size="11.5" text-anchor="start" fill="#0f172a">ที่หัวเรือ</text>
<circle cx="644" cy="562" r="11" fill="#b91c1c"/><text x="644.0" y="566.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">9</text>
<text x="664.0" y="566.0" font-size="11.5" text-anchor="start" fill="#0f172a">รอยต่อ hopper กับ inner bottom และ</text>
<text x="664.0" y="583.0" font-size="11.5" text-anchor="start" fill="#0f172a">bulkhead stools — จุดรวมความเค้น</text>
<text x="664.0" y="600.0" font-size="11.5" text-anchor="start" fill="#0f172a">รอยร้าว</text>
</svg>
