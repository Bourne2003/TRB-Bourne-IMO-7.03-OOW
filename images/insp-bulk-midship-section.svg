<text x="330.0" y="540.0" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Double bottom tank (ballast/น้ำมัน)</text>
<path d="M 80 400 L 200 500 L 80 500 Z" fill="#bfdbfe" stroke="#0f172a" stroke-width="2.5" opacity="0.9"/><path d="M 80 120 L 190 120 L 190 165 L 80 230 Z" fill="#bfdbfe" stroke="#0f172a" stroke-width="2.5" opacity="0.9"/><line x1="80.0" y1="245.0" x2="98.0" y2="245.0" stroke="#b45309" stroke-width="3"/>
