<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การยกของหนัก (Heavy lift) ด้วยปั้นจั่นของเรือ: ผลต่อ KG, GM และมุมเอียง</text>
<g transform="rotate(5.1 330 330)"><path d="M 180 200 L 480 200 L 480 400 Q 480 430 450 430 L 210 430 Q 180 430 180 400 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/><rect x="180.0" y="370.0" width="50.0" height="60.0" rx="0" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="205.0" y="404.0" font-size="11" text-anchor="middle" fill="#1d4ed8" font-weight="bold">WB</text>
<line x1="330.0" y1="200.0" x2="330.0" y2="80.0" stroke="#334155" stroke-width="6"/>
<line x1="330.0" y1="90.0" x2="560.0" y2="60.0" stroke="#334155" stroke-width="5"/>
<circle cx="560" cy="60" r="6" fill="#0f172a"/><line x1="560.0" y1="60.0" x2="560.0" y2="170.0" stroke="#0f172a" stroke-width="1.5"/>
<rect x="535.0" y="170.0" width="50.0" height="34.0" rx="0" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="560.0" y="192.0" font-size="11" text-anchor="middle" fill="#78350f" font-weight="bold">120 t</text>
<circle cx="330" cy="345" r="6" fill="#b91c1c"/><text x="318.0" y="349.0" font-size="13" text-anchor="end" fill="#b91c1c" font-weight="bold">G₀</text>
<circle cx="354" cy="308" r="6" fill="#c2410c"/><text x="366.0" y="312.0" font-size="12" text-anchor="start" fill="#c2410c" font-weight="bold">G₁ (ขณะยก)</text>
<circle cx="330" cy="265" r="5" fill="#15803d"/><text x="318.0" y="269.0" font-size="13" text-anchor="end" fill="#15803d" font-weight="bold">M</text>
<line x1="330.0" y1="345.0" x2="352.0" y2="311.0" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 3"/>
</g><rect x="20" y="330" width="640" height="210" fill="#e0f2fe" opacity="0.55"/><line x1="20.0" y1="330.0" x2="660.0" y2="330.0" stroke="#0284c7" stroke-width="2"/>
<text x="30.0" y="324.0" font-size="11" text-anchor="start" fill="#0284c7">ผิวน้ำ</text>
<text x="40.0" y="100.0" font-size="12" text-anchor="start" fill="#334155" font-weight="bold">เมื่อของพ้นพื้น (ท่า/เรือลำเลียง) น้ำหนักทั้งหมด</text>
<text x="40.0" y="118.0" font-size="12" text-anchor="start" fill="#334155" font-weight="bold">"กระทำที่หัวปั้นจั่น (jib head)" ทันที</text>
<text x="190.0" y="230.0" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="bold">เรือเอียงไปด้านที่ยก</text>
<text x="190.0" y="246.0" font-size="11" text-anchor="start" fill="#b91c1c">(ในภาพ ≈ 5° หลังเติม ballast ถ่วงไว้)</text>
<text x="180.0" y="490.0" font-size="11.5" text-anchor="start" fill="#1d4ed8">WB = ถังอับเฉาด้านตรงข้าม (counter ballast)</text>
<rect x="680.0" y="60.0" width="300.0" height="470.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="692.0" y="84.0" font-size="12" text-anchor="start" fill="#0f172a" font-weight="bold">ตัวอย่างจำลอง (เรือ MPP สมมุติ)</text>
<text x="692.0" y="106.0" font-size="12" text-anchor="start" fill="#0f172a">Δ 12,000 t · KG 7.50 m · KM 8.50 m</text>
<text x="692.0" y="128.0" font-size="12" text-anchor="start" fill="#0f172a">GM 1.00 m (แก้ FSE แล้ว)</text>
<text x="692.0" y="150.0" font-size="12" text-anchor="start" fill="#0f172a">ยก 120 t · หัวปั้นจั่นสูง 30 m จาก keel</text>
<text x="692.0" y="172.0" font-size="12" text-anchor="start" fill="#0f172a">ระยะยื่น (outreach) 15 m จากแนวกลางลำ</text>
<text x="692.0" y="194.0" font-size="12" text-anchor="start" fill="#0f172a"></text>
<text x="692.0" y="216.0" font-size="12" text-anchor="start" fill="#0f172a">1) ของพ้นพื้น: KG₁ = (12,000×7.5 + 120×30)</text>
<text x="692.0" y="238.0" font-size="12" text-anchor="start" fill="#0f172a">    ÷ 12,120 = 7.72 m → GM₁ = 0.78 m</text>
<text x="692.0" y="260.0" font-size="12" text-anchor="start" fill="#0f172a">2) มุมเอียง: tan θ = (120×15)</text>
<text x="692.0" y="282.0" font-size="12" text-anchor="start" fill="#0f172a">    ÷ (12,120×0.78) → θ ≈ 10.8°</text>
<text x="692.0" y="304.0" font-size="12" text-anchor="start" fill="#0f172a">3) เติม ballast 90 t ถังกราบตรงข้าม</text>
<text x="692.0" y="326.0" font-size="12" text-anchor="start" fill="#0f172a">    (แขน 10 m): ก่อนยกเอียงตรงข้าม ≈ 4.1°</text>
<text x="692.0" y="348.0" font-size="12" text-anchor="start" fill="#0f172a">    ขณะยกที่ระยะยื่นสูงสุด ≈ 5.1°</text>
<text x="692.0" y="370.0" font-size="12" text-anchor="start" fill="#0f172a"></text>
<text x="692.0" y="392.0" font-size="12" text-anchor="start" fill="#0f172a">4) วางบนดาดฟ้ากลางลำ (Kg 12 m) แล้ว</text>
<text x="692.0" y="414.0" font-size="12" text-anchor="start" fill="#0f172a">    สูบ ballast ออก → GM ≈ 0.95 m</text>
<text x="692.0" y="436.0" font-size="12" text-anchor="start" fill="#0f172a"></text>
<text x="692.0" y="458.0" font-size="12" text-anchor="start" fill="#0f172a" font-weight="bold">สูตรจำ: GG₁ = w × d ÷ Δ (d = ระยะจากจุด</text>
<text x="692.0" y="480.0" font-size="12" text-anchor="start" fill="#0f172a">เดิมของของถึงหัวปั้นจั่น) · tan θ = w × y ÷ (Δ × GM)</text>
</svg>
