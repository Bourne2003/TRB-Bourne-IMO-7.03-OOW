<circle cx="750" cy="250" r="170" fill="#052e16" stroke="#334155" stroke-width="3"/>
<text x="750" y="62" text-anchor="middle" font-size="16" font-weight="bold">Relative vectors</text>
<text x="758" y="266" font-size="11" fill="#fde68a">own ship (นิ่งบนจอ RM)</text>
<circle cx="848.6" cy="132.5" r="7" fill="none" stroke="#4ade80" stroke-width="2"/>
