<text x="500" y="466" text-anchor="middle" font-size="12" fill="#334155">A = เป้าในตัวอย่าง 2.3 (255° 14 kn) · B = 090° 10 kn · C = 330° 15 kn · เรือเรา 000° 12 kn · vector 12 นาที (สเกลเดียวกันทุกเส้น)</text>
<text x="40" y="440" font-size="13">True vectors บอก "เรือลำนั้นกำลังไปทางไหน" (aspect, ประเภทสถานการณ์ COLREG) · Relative vectors บอก "จะเข้าใกล้เราแค่ไหน" (ชี้ผ่านเรา = เสี่ยงชน)</text>
