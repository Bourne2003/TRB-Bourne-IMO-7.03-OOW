<path d="M 866.0 212 L 872.0 212 L 872.0 254 L 866.0 254" fill="none" stroke="#facc15"/><text x="878.0" y="237" font-size="11" fill="#facc15">Annex II</text>
<path d="M 800.0 286 L 920.0 286 L 908.0 300 L 812.0 300 Z" fill="#1e293b" stroke="#475569"/>
<text x="860.0" y="326" text-anchor="middle" font-size="12" fill="#e2e8f0">เหลือง 2 ดวงกะพริบสลับ</text>
<text x="24" y="362" font-size="12" fill="#334155">ไฟ Annex II อยู่ต่ำกว่าไฟ Rule 26(b)(i)/(c)(i) ห่างกัน ≥ 0.9 m มองเห็นรอบตัว ≥ 1 ไมล์ แต่ระยะน้อยกว่าไฟเรือประมงตามกฎหลัก</text>
<text x="24" y="382" font-size="12" fill="#334155">อวนลาก (ทั้ง demersal และ pelagic) ยาว ≥ 20 m ต้องแสดง · &lt; 20 m อาจแสดง · อวนล้อมอาจแสดง (may) เฉพาะเมื่อถูกเครื่องมือประมงขัดขวาง · เหลืองดวงทึบในภาพ = จังหวะที่ดับ</text>
<text x="24" y="402" font-size="12" fill="#334155">ลากคู่ (pair trawling): กลางคืนแต่ละลำส่องไฟฉายไปข้างหน้าและไปทางอีกลำของคู่ และเมื่อปล่อย/กู้อวน/อวนติด ให้แสดงไฟตามสามกรอบแรกด้วย</text>
</svg>
