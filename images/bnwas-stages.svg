<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="400" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">BNWAS (Res. MSC.128(75)) — ลำดับการเตือนเมื่อไม่มีการรีเซ็ต</text>
<rect x="40" y="100" width="220" height="70" fill="#e2e8f0" stroke="#0f172a"/>
<text x="150.0" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Dormant period</text>
<text x="150.0" y="152" text-anchor="middle" font-size="12" fill="#0f172a">3–12 นาที (ตั้งค่า)</text>
<rect x="260" y="100" width="150" height="70" fill="#fde68a" stroke="#0f172a"/>
<text x="335.0" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ไฟเตือนบนสะพาน</text>
<text x="335.0" y="152" text-anchor="middle" font-size="12" fill="#0f172a">15 วินาที</text>
<rect x="410" y="100" width="170" height="70" fill="#fdba74" stroke="#0f172a"/>
<text x="495.0" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">1st stage: เสียงบนสะพาน</text>
<text x="495.0" y="152" text-anchor="middle" font-size="12" fill="#0f172a">15 วินาที</text>
<rect x="580" y="100" width="190" height="70" fill="#f87171" stroke="#0f172a"/>
<text x="675.0" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">2nd stage: นายเรือ/backup</text>
<text x="675.0" y="152" text-anchor="middle" font-size="12" fill="#0f172a">90 วินาที*</text>
<rect x="770" y="100" width="190" height="70" fill="#b91c1c" stroke="#0f172a"/>
<text x="865.0" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3rd stage: ลูกเรืออื่น</text>
<text x="865.0" y="152" text-anchor="middle" font-size="12" fill="#fff"></text>
<line x1="40" y1="200" x2="960" y2="200" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/><text x="900" y="222" font-size="13">เวลา</text>
<text x="40" y="260" font-size="13">• รีเซ็ตได้ด้วยการกดปุ่ม reset หรือการตรวจจับการเคลื่อนไหว/การใช้งานอุปกรณ์ที่เชื่อมต่อ (ตามแบบที่ติดตั้ง)</text>
<text x="40" y="282" font-size="13">• โหมด: Automatic (ทำงานเมื่อ heading/track control ทำงาน) · Manual ON · Manual OFF (ตามที่นายเรือกำหนด)</text>
<text x="40" y="304" font-size="13">• ปุ่ม Emergency call (ถ้าติดตั้ง — มาตรฐานให้ "อาจจัดให้มี"): เรียกขอความช่วยเหลือไปยัง 2nd/3rd stage ทันที</text>
<text x="40" y="326" font-size="13">• การกดปุ่มค้างไม่ยืด dormant period · การเลือกโหมดและค่า Td ล็อกให้นายเรือเท่านั้น</text>
<text x="40" y="348" font-size="12" fill="#64748b">* ปกติ 90 วินาที เรือใหญ่ตั้งตอนติดตั้งให้นานขึ้นได้ถึง 3 นาที (ให้เวลาคนจาก 2nd stage มาถึงสะพาน)</text>
<text x="40" y="370" font-size="12" fill="#64748b">เรือที่ไม่ใช่เรือโดยสาร: ตั้งให้ 2nd และ 3rd stage ดังพร้อมกันทุกจุดได้ และถ้าตั้งเช่นนั้นจะไม่มี 3rd stage แยก</text>
</svg>
