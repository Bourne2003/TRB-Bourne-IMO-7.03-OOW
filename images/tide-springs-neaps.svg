<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="960" height="440" fill="#fff"/>
<defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
<text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">น้ำเกิด (Springs) และน้ำตาย (Neaps)</text>
<circle cx="40" cy="220" r="30" fill="#facc15" stroke="#b45309" stroke-width="2"/><text x="40" y="270" text-anchor="middle" font-size="13" font-weight="bold">ดวงอาทิตย์</text>
<line x1="75" y1="220" x2="130" y2="220" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
<text x="320" y="70" text-anchor="middle" font-size="16" font-weight="bold">SPRINGS — จันทร์ดับ / จันทร์เพ็ญ</text>
<ellipse cx="320" cy="230" rx="105" ry="58" fill="#bfdbfe" opacity="0.8" transform="rotate(0 320 230)"/>
<circle cx="320" cy="230" r="38" fill="#16a34a" stroke="#14532d" stroke-width="2"/><text x="320" y="235" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">โลก</text>
<circle cx="435.0" cy="230.0" r="14" fill="#e5e7eb" stroke="#374151" stroke-width="2"/><text x="455.0" y="235.0" font-size="12">จันทร์เพ็ญ</text>
<circle cx="205.0" cy="230.0" r="14" fill="#e5e7eb" stroke="#374151" stroke-width="2"/><text x="225.0" y="235.0" font-size="12">จันทร์ดับ</text>
<text x="320" y="400" text-anchor="middle" font-size="13" fill="#334155">แรงดวงอาทิตย์ + ดวงจันทร์เสริมกัน → range มาก</text>
<text x="720" y="70" text-anchor="middle" font-size="16" font-weight="bold">NEAPS — จันทร์ครึ่งดวง</text>
<ellipse cx="720" cy="230" rx="82" ry="66" fill="#bfdbfe" opacity="0.8" transform="rotate(90 720 230)"/>
<circle cx="720" cy="230" r="38" fill="#16a34a" stroke="#14532d" stroke-width="2"/><text x="720" y="235" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">โลก</text>
<circle cx="720.0" cy="115.0" r="14" fill="#e5e7eb" stroke="#374151" stroke-width="2"/><text x="740.0" y="120.0" font-size="12">ข้างแรม 8 ค่ำ (last quarter)</text>
<circle cx="720.0" cy="345.0" r="14" fill="#e5e7eb" stroke="#374151" stroke-width="2"/><text x="740.0" y="350.0" font-size="12">ข้างขึ้น 8 ค่ำ (first quarter)</text>
<text x="720" y="400" text-anchor="middle" font-size="13" fill="#334155">แรงตั้งฉากกัน หักล้างบางส่วน → range น้อย</text>
<text x="492" y="182" font-size="12" fill="#b45309">← ดวงอาทิตย์อยู่ทางซ้าย</text>
<text x="480" y="424" text-anchor="middle" font-size="11" fill="#64748b">มองจากเหนือขั้วโลกเหนือ ดวงจันทร์โคจรทวนเข็มนาฬิกา (จันทร์ดับ → ขึ้น 8 ค่ำ → เพ็ญ → แรม 8 ค่ำ) · ภาพไม่ได้ตามมาตราส่วน</text>
<line x1="480" y1="60" x2="480" y2="400" stroke="#e2e8f0" stroke-width="2"/>
</svg>
