<text x="296" y="151" font-size="12" fill="#334155">ขั้วโลกเหนือ (ภูมิศาสตร์) / แกนหมุนโลก</text>
<line x1="316.1" y1="434.5" x2="263.9" y2="165.5" stroke="#b91c1c" stroke-width="1.5"/>
<circle cx="268.1" cy="187.1" r="5" fill="#b91c1c"/>
<text x="13.1" y="135.1" font-size="12" fill="#b91c1c">ขั้วแม่เหล็กเหนือ (ทางฟิสิกส์เป็นขั้ว S)</text>
<line x1="213.1" y1="139.1" x2="265.1" y2="181.1" stroke="#b91c1c"/>
<text x="251.9" y="434.9" font-size="12" fill="#b91c1c">ขั้วแม่เหล็กใต้</text>
<line x1="177.1" y1="321.9" x2="402.9" y2="278.1" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="185.1" y="339.9" font-size="12" fill="#b45309" font-weight="bold">magnetic equator (dip = 0°)</text>
<circle cx="402.9" cy="278.1" r="4" fill="#0f172a"/>
<line x1="402.9" y1="278.1" x2="393.7" y2="230.9" stroke="#15803d" stroke-width="3" marker-end="url(#a)"/>
<text x="420.7" y="279.8" font-size="14" font-weight="bold" fill="#0f172a">A</text>
<circle cx="354.3" cy="204.7" r="4" fill="#0f172a"/>
<line x1="354.3" y1="204.7" x2="312.5" y2="228.2" stroke="#15803d" stroke-width="3" marker-end="url(#a)"/>
<text x="367.0" y="198.7" font-size="14" font-weight="bold" fill="#0f172a">B</text>
<circle cx="298.0" cy="185.3" r="4" fill="#0f172a"/>
<line x1="298.0" y1="185.3" x2="288.3" y2="232.3" stroke="#15803d" stroke-width="3" marker-end="url(#a)"/>
<text x="304.9" y="177.3" font-size="14" font-weight="bold" fill="#0f172a">C</text>
<text x="40" y="520" font-size="12" fill="#334155">ลูกศรเขียว = ทิศของสนามที่ผิวโลก: A ศูนย์สูตรแม่เหล็ก (แนวราบ), B ละติจูดแม่เหล็ก ~45° (dip ~63°), C ใกล้ขั้ว (dip ~82°)</text>
<text x="40" y="540" font-size="12" fill="#334155">ซีกโลกเหนือปลายเหนือของเข็มถูกดึงลง (dip ลง) · ซีกโลกใต้ดึงขึ้น · แกนแม่เหล็กเอียงจากแกนหมุนโลก ~10° (ภาพไม่ตามสเกล)</text>
<line x1="640" y1="150" x2="791.1" y2="150" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#a)"/>
<line x1="791.1" y1="150" x2="791.1" y2="330.0" stroke="#b91c1c" stroke-width="3.5" marker-end="url(#a)"/>
<line x1="640" y1="150" x2="791.1" y2="330.0" stroke="#15803d" stroke-width="4" marker-end="url(#a)"/>
<path d="M 710 150 A 70 70 0 0 1 685.0 203.6" fill="none" stroke="#0f172a" stroke-width="1.5"/>
<text x="716" y="188" font-size="14" font-weight="bold">θ (dip)</text>
<text x="660" y="138" font-size="14" font-weight="bold" fill="#1d4ed8">H — แรงแนวราบ (ชี้ magnetic north)</text>
<text x="801.1" y="240.0" font-size="14" font-weight="bold" fill="#b91c1c">Z — แรงแนวดิ่ง</text>
<text x="660" y="300.0" font-size="14" font-weight="bold" fill="#15803d">T — total force</text>
<rect x="560" y="410" width="385" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="574" y="434" font-size="13">H = T cos θ · Z = T sin θ · tan θ = Z / H</text>
<text x="574" y="455" font-size="13">H มากสุดใกล้ magnetic equator → เข็มทิศเสถียรสุด</text>
<text x="574" y="476" font-size="13">ใกล้ขั้วแม่เหล็ก H → 0 → เข็มทิศแม่เหล็กใช้ไม่ได้ดี</text>
<text x="574" y="497" font-size="13">Z เปลี่ยนตามละติจูด → Flinders bar/heeling magnet</text>
</svg>
