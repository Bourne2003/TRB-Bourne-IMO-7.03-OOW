<text x="50.0" y="372.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">ลูกเรือ > 25% ไม่ได้ฝึกบนเรือนี้เดือนก่อน</text>
<text x="380.0" y="372.0" font-size="12" text-anchor="start" fill="#0f172a">fire + abandon ship ภายใน 24 ชม. หลังออกจากท่า</text>
<text x="800.0" y="372.0" font-size="12" text-anchor="start" fill="#334155">SOLAS III/19.3.2</text>
<rect x="30.0" y="388.0" width="940.0" height="34.0" rx="4" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="30.0" y="388.0" width="8.0" height="34.0" rx="0" fill="#0f766e" stroke="#0f766e" stroke-width="0"/>
<text x="50.0" y="410.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">ลูกเรือใหม่: ฝึกใช้ LSA/อุปกรณ์ดับเพลิง</text>
<text x="380.0" y="410.0" font-size="12" text-anchor="start" fill="#0f172a">โดยเร็ว ไม่เกิน 2 สัปดาห์หลังขึ้นเรือ</text>
<text x="800.0" y="410.0" font-size="12" text-anchor="start" fill="#334155">SOLAS III/19.4</text>
<rect x="30.0" y="446.0" width="940.0" height="135.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="46.0" y="470.0" font-size="12" text-anchor="start" fill="#7f1d1d" font-weight="bold">สัญญาณ</text>
<text x="46.0" y="495.0" font-size="12" text-anchor="start" fill="#0f172a">• General emergency alarm: สั้น 7 ครั้งหรือมากกว่า + ยาว 1 ครั้ง (หวูดและระบบสัญญาณ) → ไปจุดรวมพลพร้อม lifejacket/immersion suit</text>
<text x="46.0" y="520.0" font-size="12" text-anchor="start" fill="#0f172a">• สัญญาณไฟไหม้/คนตกน้ำ/อื่น ๆ: ตาม muster list ของเรือ (เช่น ระฆัง/สัญญาณต่อเนื่อง, "O" มอร์ส −−− สำหรับคนตกน้ำในบางเรือ)</text>
<text x="46.0" y="545.0" font-size="12" text-anchor="start" fill="#0f172a">• คำสั่งสละเรือ: คำสั่งวาจาของนายเรือ · ประกาศ PA ระบุชนิดเหตุและตำแหน่งเสมอ · การฝึก: ประกาศว่า "This is a drill"</text>
<text x="46.0" y="570.0" font-size="12" text-anchor="start" fill="#0f172a">• ทุกคนต้องรู้: จุดรวมพล หน้าที่ของตน ทางหนี ตำแหน่ง lifejacket/immersion suit/EEBD ของตน</text>
<text x="500.0" y="600.0" font-size="11.5" text-anchor="middle" fill="#334155">บันทึกการฝึกทุกครั้งใน log book (SOLAS III/19.5) — ถ้าไม่ได้ฝึกตามกำหนด ต้องบันทึกเหตุผลและขอบเขตที่ทำได้</text>
</svg>
