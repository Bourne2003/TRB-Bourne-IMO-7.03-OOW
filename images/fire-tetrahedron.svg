<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="500" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">องค์ประกอบของไฟ (Fire triangle / tetrahedron) และหลักการดับไฟ</text>
<polygon points="260,100 80,400 440,400" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/><text x="150.0" y="240.0" font-size="15" text-anchor="end" fill="#7c2d12" font-weight="bold">เชื้อเพลิง</text>
<text x="150.0" y="258.0" font-size="12" text-anchor="end" fill="#7c2d12">(Fuel)</text>
<text x="370.0" y="240.0" font-size="15" text-anchor="start" fill="#1d4ed8" font-weight="bold">ออกซิเจน</text>
<text x="370.0" y="258.0" font-size="12" text-anchor="start" fill="#1d4ed8">(Oxygen ≥ ~16%)</text>
<text x="260.0" y="430.0" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="bold">ความร้อน (Heat)</text>
<circle cx="260" cy="290" r="52" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="260.0" y="284.0" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="bold">ปฏิกิริยาลูกโซ่</text>
<text x="260.0" y="302.0" font-size="11" text-anchor="middle" fill="#7f1d1d">(chain reaction)</text>
<text x="520.0" y="80.0" font-size="14" text-anchor="start" fill="#0f172a" font-weight="bold">หลักการดับไฟ = เอาองค์ประกอบใดองค์ประกอบหนึ่งออก</text>
<rect x="520.0" y="110.0" width="450.0" height="58.0" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
<text x="536.0" y="134.0" font-size="14" text-anchor="start" fill="#b91c1c" font-weight="bold">Cooling (ลดความร้อน)</text>
<text x="536.0" y="155.0" font-size="12" text-anchor="start" fill="#0f172a">น้ำ — ดูดความร้อนสูงมาก (จุดเด่นของน้ำ)</text>
<rect x="520.0" y="180.0" width="450.0" height="58.0" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
<text x="536.0" y="204.0" font-size="14" text-anchor="start" fill="#1d4ed8" font-weight="bold">Smothering (ตัดออกซิเจน)</text>
<text x="536.0" y="225.0" font-size="12" text-anchor="start" fill="#0f172a">โฟม CO₂ ผ้าห่มดับไฟ ปิดช่องเปิด/ระบายอากาศ</text>
<rect x="520.0" y="250.0" width="450.0" height="58.0" rx="10" fill="#fff" stroke="#7c2d12" stroke-width="2"/>
<text x="536.0" y="274.0" font-size="14" text-anchor="start" fill="#7c2d12" font-weight="bold">Starving (ตัดเชื้อเพลิง)</text>
<text x="536.0" y="295.0" font-size="12" text-anchor="start" fill="#0f172a">ปิดวาล์วน้ำมัน (quick-closing) ย้ายของไหม้ได้ออก</text>
<rect x="520.0" y="320.0" width="450.0" height="58.0" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text x="536.0" y="344.0" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">Breaking chain reaction</text>
<text x="536.0" y="365.0" font-size="12" text-anchor="start" fill="#0f172a">ผงเคมีแห้ง (dry powder) สารดับเพลิงบางชนิด</text>
<rect x="520.0" y="400.0" width="450.0" height="80.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="534.0" y="424.0" font-size="12" text-anchor="start" fill="#0f172a">Flash point — อุณหภูมิต่ำสุดที่ไอติดไฟวาบเมื่อมีประกายไฟ</text>
<text x="534.0" y="444.0" font-size="12" text-anchor="start" fill="#0f172a">Fire point — ไอเกิดพอให้ลุกไหม้ต่อเนื่อง</text>
<text x="534.0" y="464.0" font-size="12" text-anchor="start" fill="#0f172a">Auto-ignition temp. — ติดไฟเองโดยไม่ต้องมีประกายไฟ</text>
</svg>
