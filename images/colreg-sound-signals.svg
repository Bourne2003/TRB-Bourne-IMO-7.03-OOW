<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 782" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="782" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="dm" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">สัญญาณเสียง (Rules 34–35) — short ≈ 1 วินาที, prolonged 4–6 วินาที</text>
<rect x="10" y="60" width="980" height="30" fill="#fff"/>
<text x="20" y="81" font-size="14" font-weight="bold" fill="#1e3a8a">1 short</text>
<rect x="220" y="68" width="14" height="14" rx="3" fill="#111827"/>
