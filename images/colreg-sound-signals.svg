<rect x="220" y="238" width="56" height="14" rx="3" fill="#111827"/>
<rect x="284" y="238" width="56" height="14" rx="3" fill="#111827"/>
<rect x="348" y="238" width="14" height="14" rx="3" fill="#111827"/>
