<rect x="10" y="638" width="980" height="30" fill="#f8fafc"/>
<text x="20" y="659" font-size="14" font-weight="bold" fill="#1e3a8a">เกยตื้น ≤ 1 นาที</text>
<circle cx="224" cy="653" r="5" fill="#b45309"/>
<circle cx="240" cy="653" r="5" fill="#b45309"/>
<circle cx="256" cy="653" r="5" fill="#b45309"/>
<rect x="268" y="646" width="56" height="14" rx="3" fill="#b45309"/>
<line x1="276" y1="647" x2="276" y2="659" stroke="#fff" stroke-width="1.5"/><line x1="284" y1="647" x2="284" y2="659" stroke="#fff" stroke-width="1.5"/><line x1="292" y1="647" x2="292" y2="659" stroke="#fff" stroke-width="1.5"/><line x1="300" y1="647" x2="300" y2="659" stroke="#fff" stroke-width="1.5"/><line x1="308" y1="647" x2="308" y2="659" stroke="#fff" stroke-width="1.5"/><line x1="316" y1="647" x2="316" y2="659" stroke="#fff" stroke-width="1.5"/><text x="296.0" y="644" text-anchor="middle" font-size="9" fill="#b45309">ระฆัง</text>
<circle cx="336" cy="653" r="5" fill="#b45309"/>
<circle cx="352" cy="653" r="5" fill="#b45309"/>
<circle cx="368" cy="653" r="5" fill="#b45309"/>
<text x="470" y="659" font-size="13">ตีระฆัง 3 ครั้ง + รัวระฆัง + ตีระฆัง 3 ครั้ง (+ฆ้องถ้า ≥100 m)</text><text x="900" y="659" font-size="12" fill="#64748b">Rule 35(h)</text>
<rect x="20" y="682" width="14" height="10" rx="2" fill="#111827"/><text x="40" y="692" font-size="12" fill="#334155">หวูด (whistle)</text><rect x="150" y="682" width="24" height="10" rx="2" fill="#b45309"/><text x="180" y="692" font-size="12" fill="#334155">รัวระฆัง (bell)</text><circle cx="300" cy="687" r="5" fill="#b45309"/><text x="310" y="692" font-size="12" fill="#334155">ตีระฆัง 1 ครั้ง (stroke)</text><rect x="450" y="682" width="24" height="10" rx="2" fill="#7c3aed"/><text x="480" y="692" font-size="12" fill="#334155">รัวฆ้อง (gong)</text>
<text x="20" y="714" font-size="12" fill="#334155">Rule 34(a)–(c) ใช้เฉพาะเมื่อมองเห็นกัน · Rule 35 ใช้ในหรือใกล้บริเวณทัศนวิสัยจำกัด ทั้งกลางวันและกลางคืน · เรือ 12–&lt;20 m และ &lt;12 m ใช้เสียงอื่นที่มีประสิทธิภาพแทนได้ (35(i),(j))</text>
<text x="20" y="734" font-size="12" fill="#334155">ไฟประกอบ Rule 34(b): ไฟขาว all-round เห็นได้ ≥ 5 ไมล์ แวบละ ~1 วินาที เว้น ~1 วินาที และระหว่างชุดสัญญาณ ≥ 10 วินาที · ความยาวแถบในภาพเป็นสัดส่วนโดยประมาณ</text>
</svg>
