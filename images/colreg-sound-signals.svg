<rect x="306" y="442" width="14" height="14" rx="3" fill="#111827"/>
<text x="470" y="455" font-size="13">เรือประมงทอดสมอ / RAM ทอดสมอทำงาน (แทนระฆัง)</text><text x="900" y="455" font-size="12" fill="#64748b">Rule 35(d)</text>
<rect x="10" y="468" width="980" height="30" fill="#fff"/>
