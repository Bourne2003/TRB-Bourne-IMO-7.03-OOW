<line x1="228" y1="579" x2="228" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="236" y1="579" x2="236" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="244" y1="579" x2="244" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="252" y1="579" x2="252" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="260" y1="579" x2="260" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="268" y1="579" x2="268" y2="591" stroke="#fff" stroke-width="1.5"/><text x="248.0" y="576" text-anchor="middle" font-size="9" fill="#b45309">ระฆัง</text>
<rect x="284" y="578" width="56" height="14" rx="3" fill="#7c3aed"/>
<line x1="292" y1="579" x2="292" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="300" y1="579" x2="300" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="308" y1="579" x2="308" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="316" y1="579" x2="316" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="324" y1="579" x2="324" y2="591" stroke="#fff" stroke-width="1.5"/><line x1="332" y1="579" x2="332" y2="591" stroke="#fff" stroke-width="1.5"/><text x="312.0" y="576" text-anchor="middle" font-size="9" fill="#7c3aed">ฆ้อง</text>
<text x="470" y="591" font-size="13">รัวระฆังหัวเรือ แล้วรัวฆ้องท้ายเรือทันที ~5 วินาที</text><text x="900" y="591" font-size="12" fill="#64748b">Rule 35(g)</text>
<rect x="10" y="604" width="980" height="30" fill="#fff"/>
<text x="20" y="625" font-size="14" font-weight="bold" fill="#1e3a8a">S L S (option)</text>
