<text x="20" y="557" font-size="14" font-weight="bold" fill="#1e3a8a">ทอดสมอ ≤ 1 นาที</text>
<rect x="220" y="544" width="56" height="14" rx="3" fill="#b45309"/>
<line x1="228" y1="545" x2="228" y2="557" stroke="#fff" stroke-width="1.5"/><line x1="236" y1="545" x2="236" y2="557" stroke="#fff" stroke-width="1.5"/><line x1="244" y1="545" x2="244" y2="557" stroke="#fff" stroke-width="1.5"/><line x1="252" y1="545" x2="252" y2="557" stroke="#fff" stroke-width="1.5"/><line x1="260" y1="545" x2="260" y2="557" stroke="#fff" stroke-width="1.5"/><line x1="268" y1="545" x2="268" y2="557" stroke="#fff" stroke-width="1.5"/><text x="248.0" y="542" text-anchor="middle" font-size="9" fill="#b45309">ระฆัง</text>
<text x="470" y="557" font-size="13">รัวระฆังส่วนหน้าเรือ ~5 วินาที</text><text x="900" y="557" font-size="12" fill="#64748b">Rule 35(g)</text>
<rect x="10" y="570" width="980" height="30" fill="#f8fafc"/>
