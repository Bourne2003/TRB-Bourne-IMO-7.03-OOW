<rect x="220" y="306" width="56" height="14" rx="3" fill="#111827"/>
<text x="470" y="319" font-size="13">เข้าใกล้โค้ง/บริเวณที่บังสายตา (ฝ่ายที่ได้ยินตอบ 1 long)</text><text x="900" y="319" font-size="12" fill="#64748b">Rule 34(e)</text>
