<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="960" height="480" fill="#fff"/>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="context-stroke"/></marker></defs>
<text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ไจโรสโคป: Rigidity in space และ Precession</text>
<ellipse cx="240" cy="260" rx="170" ry="170" fill="none" stroke="#94a3b8" stroke-width="6"/>
<ellipse cx="240" cy="260" rx="60" ry="150" fill="none" stroke="#64748b" stroke-width="6"/>
<ellipse cx="240" cy="260" rx="150" ry="42" fill="none" stroke="#475569" stroke-width="5"/>
<ellipse cx="240" cy="260" rx="26" ry="95" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
<path d="M 210 190 q -22 70 0 140" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="70" y1="260" x2="410" y2="260" stroke="#b91c1c" stroke-width="3"/>
<text x="415" y="265" font-size="13" fill="#b91c1c" font-weight="bold">spin axis</text>
<line x1="240" y1="60" x2="240" y2="460" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4"/><text x="246" y="55" font-size="12" fill="#15803d">vertical axis</text>
<line x1="418" y1="198" x2="262" y2="215" stroke="#1e3a8a" stroke-width="1"/>
<text x="420" y="196" font-size="12" fill="#1e3a8a" font-weight="bold">rotor (หมุนเร็วมาก)</text>
<text x="420" y="212" font-size="11" fill="#475569">จานตั้งฉากกับ spin axis</text>
<text x="90" y="475" font-size="13">gimbals ให้อิสระ 3 แกน (free gyroscope)</text>
<ellipse cx="700" cy="250" rx="120" ry="45" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<path d="M 780 212 q 30 5 40 25" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)"/><text x="795" y="202" font-size="12" fill="#1d4ed8">ทิศการหมุน</text>
<line x1="700" y1="295" x2="700" y2="370" stroke="#b91c1c" stroke-width="4" marker-end="url(#a)"/><text x="710" y="360" font-size="13" fill="#b91c1c" font-weight="bold">แรงที่กระทำ (torque)</text>
<line x1="700" y1="250" x2="700" y2="170" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="5 3"/><text x="706" y="180" font-size="11" fill="#0f172a">spin axis</text>
<line x1="580" y1="250" x2="580" y2="325" stroke="#15803d" stroke-width="4" marker-end="url(#a)"/><text x="400" y="350" font-size="13" fill="#15803d" font-weight="bold">ผลจริงเกิดที่จุดนี้ (ห่าง 90°)</text><text x="400" y="368" font-size="12" fill="#15803d">→ ขอบซ้ายกดลง แกนหมุนเอียง (precession)</text>
<text x="540" y="160" font-size="14" font-weight="bold">Precession: เคลื่อน 90° ตามทิศการหมุน</text>
<text x="540" y="420" font-size="13">อัตรา precession ∝ แรงบิด / โมเมนตัมเชิงมุม</text>
<text x="540" y="442" font-size="13">Free gyro บนโลก: drift = 15° sin L /ชม., tilt = 15° cos L /ชม.</text>
</svg>
