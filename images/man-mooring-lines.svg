<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker><marker id="arO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c2410c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การผูกเรือเข้าเทียบท่า: ชื่อและหน้าที่ของเชือก (ตัวอย่างเทียบกราบขวา)</text>
<rect x="40" y="380" width="920" height="60" fill="#a8a29e" stroke="#57534e"/><text x="500.0" y="418.0" font-size="14" text-anchor="middle" fill="#1c1917" font-weight="bold">หน้าท่า (quay / berth)</text>
<rect x="80" y="372" width="16" height="12" rx="3" fill="#57534e"/><rect x="190" y="372" width="16" height="12" rx="3" fill="#57534e"/><rect x="300" y="372" width="16" height="12" rx="3" fill="#57534e"/><rect x="410" y="372" width="16" height="12" rx="3" fill="#57534e"/><rect x="520" y="372" width="16" height="12" rx="3" fill="#57534e"/><rect x="630" y="372" width="16" height="12" rx="3" fill="#57534e"/><rect x="740" y="372" width="16" height="12" rx="3" fill="#57534e"/><rect x="850" y="372" width="16" height="12" rx="3" fill="#57534e"/><path d="M 200 360 L 760 360 Q 860 360 900 300 Q 860 240 760 240 L 200 240 Q 180 240 180 260 L 180 340 Q 180 360 200 360 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/><text x="540.0" y="305.0" font-size="14" text-anchor="middle" fill="#334155" font-weight="bold">MV Andaman Pearl (หัวเรือไปทางขวา)</text>
<line x1="880.0" y1="316.0" x2="960.0" y2="378.0" stroke="#b91c1c" stroke-width="2.6"/>
<text x="950.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">Head line</text>
<line x1="840.0" y1="345.0" x2="860.0" y2="378.0" stroke="#c2410c" stroke-width="2.6"/>
<text x="845.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#c2410c" font-weight="bold">Fwd breast</text>
<line x1="800.0" y1="355.0" x2="650.0" y2="378.0" stroke="#1d4ed8" stroke-width="2.6"/>
<text x="690.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Fwd spring</text>
<line x1="260.0" y1="355.0" x2="410.0" y2="378.0" stroke="#1d4ed8" stroke-width="2.6"/>
<text x="390.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Aft spring</text>
<line x1="220.0" y1="350.0" x2="205.0" y2="378.0" stroke="#c2410c" stroke-width="2.6"/>
<text x="210.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#c2410c" font-weight="bold">Aft breast</text>
<line x1="190.0" y1="330.0" x2="60.0" y2="378.0" stroke="#b91c1c" stroke-width="2.6"/>
<text x="90.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">Stern line</text>
<text x="500.0" y="500.0" font-size="12.5" text-anchor="middle" fill="#0f172a">Head/Stern lines + Springs = ต้านการเคลื่อนตามยาว (surge) · Breast lines = ต้านการเคลื่อนออกจากท่า (sway)</text>
<text x="500.0" y="520.0" font-size="12.5" text-anchor="middle" fill="#0f172a">Springs ยิ่งขนานกับเรือยิ่งดี · Breast ยิ่งตั้งฉากกับเรือยิ่งดี · มุมก้ม/เงย (vertical angle) ไม่ควรเกินประมาณ 25–30°</text>
<text x="500.0" y="540.0" font-size="12.5" text-anchor="middle" fill="#b91c1c">เชือกที่ทำหน้าที่เดียวกันควรเป็นวัสดุ ขนาด และความยาวใกล้เคียงกัน — ไม่ปนเชือก wire กับ fibre ในทิศเดียวกัน</text>
<rect x="40" y="60" width="920" height="160" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="60.0" y="86.0" font-size="14" text-anchor="start" fill="#9a3412" font-weight="bold">Snap-back: เชือกที่ขาดจะดีดกลับด้วยพลังงานสูงมาก ในทิศและระยะที่ทำนายยาก</text>
<circle cx="160" cy="160" r="12" fill="#57534e"/><text x="160.0" y="200.0" font-size="11" text-anchor="middle" fill="#0f172a">bitt</text>
<rect x="300" y="146" width="40" height="28" fill="#94a3b8" stroke="#0f172a"/><text x="320.0" y="200.0" font-size="11" text-anchor="middle" fill="#0f172a">fairlead</text>
<line x1="172.0" y1="160.0" x2="300.0" y2="160.0" stroke="#0f172a" stroke-width="3"/>
<line x1="340.0" y1="160.0" x2="470.0" y2="160.0" stroke="#0f172a" stroke-width="3" stroke-dasharray="10 6"/>
<path d="M 300 160 q -80 -40 -150 -55" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arO)"/><path d="M 300 160 q -80 40 -170 40" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arO)"/><text x="500.0" y="120.0" font-size="12" text-anchor="start" fill="#7c2d12">• ถือว่าพื้นที่ทั้งหมดบนดาดฟ้าผูกเรือเป็นพื้นที่เสี่ยง</text>
<text x="500.0" y="142.0" font-size="12" text-anchor="start" fill="#7c2d12">  (แนวทางล่าสุดของ UK MCA COSWP — สีที่ทาพื้นอาจให้ความรู้สึกปลอดภัยผิด ๆ)</text>
<text x="500.0" y="164.0" font-size="12" text-anchor="start" fill="#7c2d12">• ยืนให้ห่างแนวเชือกที่ตึง โดยเฉพาะด้านในมุมที่เชือกหักเลี้ยวผ่าน fairlead/pedestal</text>
<text x="500.0" y="186.0" font-size="12" text-anchor="start" fill="#7c2d12">• สื่อสารชัด ใช้คนน้อยที่สุดในพื้นที่ · ตรวจสภาพเชือก/tail ตามแผน (SOLAS II-1/3-8)</text>
</svg>
