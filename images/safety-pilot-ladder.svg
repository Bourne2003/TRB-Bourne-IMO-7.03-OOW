<line x1="346.0" y1="196.0" x2="376.0" y2="196.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="218.0" x2="376.0" y2="218.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="240.0" x2="376.0" y2="240.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="262.0" x2="376.0" y2="262.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="284.0" x2="376.0" y2="284.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="306.0" x2="376.0" y2="306.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="328.0" x2="376.0" y2="328.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="350.0" x2="376.0" y2="350.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="372.0" x2="376.0" y2="372.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="394.0" x2="376.0" y2="394.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="416.0" x2="376.0" y2="416.0" stroke="#92400e" stroke-width="4"/>
<line x1="346.0" y1="438.0" x2="376.0" y2="438.0" stroke="#92400e" stroke-width="4"/>
<rect x="326.0" y="347.0" width="70.0" height="7.0" rx="0" fill="#78350f" stroke="#78350f" stroke-width="0"/>
<text x="418.0" y="340.0" font-size="11" text-anchor="start" fill="#78350f" font-weight="bold">spreader (ยาว ≥ 1.8 m)</text>
<text x="418.0" y="356.0" font-size="11" text-anchor="start" fill="#78350f">ตัวล่างสุด = ขั้นที่ 5 จากล่าง</text>
<line x1="361.0" y1="445.0" x2="361.0" y2="445.0" stroke="#0f172a" stroke-width="1"/>
<rect x="400" y="455" width="120" height="30" rx="8" fill="#f97316" stroke="#7c2d12" stroke-width="2"/><text x="460.0" y="475.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">เรือนำร่อง</text>
<line x1="410.0" y1="445.0" x2="410.0" y2="120.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arR)"/>
<line x1="410.0" y1="120.0" x2="410.0" y2="445.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arR)"/>
<text x="418.0" y="250.0" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="bold">ระยะปีน (climb)</text>
<text x="418.0" y="268.0" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="bold">≥ 1.5 m และ ≤ 9 m</text>
<text x="418.0" y="286.0" font-size="11" text-anchor="start" fill="#b91c1c">จากผิวน้ำ</text>
<circle cx="300" cy="105" r="13" fill="none" stroke="#dc2626" stroke-width="5"/><text x="300.0" y="85.0" font-size="10.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">ห่วงชูชีพ+ไฟ</text>
<rect x="250.0" y="125.0" width="20.0" height="14.0" rx="0" fill="#facc15" stroke="#854d0e" stroke-width="1"/>
<text x="240.0" y="140.0" font-size="10.5" text-anchor="end" fill="#854d0e">ไฟส่อง</text>
<rect x="326.0" y="112.0" width="12.0" height="8.0" rx="0" fill="#334155" stroke="#0f172a" stroke-width="1"/>
<line x1="348.0" y1="120.0" x2="338.0" y2="117.0" stroke="#0f172a" stroke-width="2"/>
<line x1="292.0" y1="172.0" x2="330.0" y2="122.0" stroke="#475569" stroke-width="1"/>
<text x="296.0" y="186.0" font-size="10.5" text-anchor="end" fill="#0f172a">ยึดกับจุดแข็งแรง (strong point)</text>
<rect x="560.0" y="60.0" width="410.0" height="470.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="574.0" y="84.0" font-size="11.8" text-anchor="start" fill="#1d4ed8" font-weight="bold">ข้อกำหนดและแนวปฏิบัติหลัก</text>
<text x="574.0" y="106.5" font-size="11.8" text-anchor="start" fill="#0f172a">• บันไดได้รับการรับรอง สภาพดี ขั้นได้ระดับ ยึดแนบข้างเรือ</text>
<text x="574.0" y="129.0" font-size="11.8" text-anchor="start" fill="#0f172a">• ยึดกับจุดแข็งแรงของเรือ — ห้ามผูกกับราว/เสาราวกันตก</text>
<text x="574.0" y="151.5" font-size="11.8" text-anchor="start" fill="#0f172a">• ระยะปีนเกิน 9 m → ใช้ accommodation ladder ร่วมกับ</text>
<text x="574.0" y="174.0" font-size="11.8" text-anchor="start" fill="#0f172a">  pilot ladder (combination arrangement) หรือวิธีอื่นที่อนุมัติ</text>
<text x="574.0" y="196.5" font-size="11.8" text-anchor="start" fill="#0f172a">• Spreader ตามความยาวที่กำหนด กันบันไดบิด</text>
<text x="574.0" y="219.0" font-size="11.8" text-anchor="start" fill="#0f172a">• Man ropes เมื่อนำร่องร้องขอ · heaving line</text>
<text x="574.0" y="241.5" font-size="11.8" text-anchor="start" fill="#0f172a">• ห่วงชูชีพพร้อมไฟติดอัตโนมัติ ไฟส่องสว่างกลางคืน</text>
<text x="574.0" y="264.0" font-size="11.8" text-anchor="start" fill="#0f172a">• เจ้าหน้าที่ที่รับผิดชอบดูแล มีวิทยุติดต่อสะพาน</text>
<text x="574.0" y="286.5" font-size="11.8" text-anchor="start" fill="#0f172a">  ต้อนรับและพานำร่องไปสะพานเดินเรือ</text>
<text x="574.0" y="309.0" font-size="11.8" text-anchor="start" fill="#0f172a">• ด้านใต้ลม (lee) ความเร็วตามที่ตกลง ห่างใบจักร</text>
<text x="574.0" y="331.5" font-size="11.8" text-anchor="start" fill="#0f172a">  และช่องระบายน้ำ</text>
<text x="574.0" y="354.0" font-size="11.8" text-anchor="start" fill="#0f172a">• ตรวจและบันทึกการบำรุงรักษา เก็บรักษาพ้นแดด/สารเคมี</text>
<text x="574.0" y="376.5" font-size="11.8" text-anchor="start" fill="#0f172a"></text>
<text x="574.0" y="399.0" font-size="11.8" text-anchor="start" fill="#1d4ed8" font-weight="bold">ใหม่: MSC.572(110) + MSC.576(110) มีผล 1 ม.ค. 2028</text>
<text x="574.0" y="421.5" font-size="11.8" text-anchor="start" fill="#0f172a">• อุปกรณ์ที่ติดตั้งก่อน 2028 ต้องปรับให้ครบภายใน</text>
<text x="574.0" y="444.0" font-size="11.8" text-anchor="start" fill="#0f172a">  การตรวจเรือครั้งแรกตั้งแต่ 1 ม.ค. 2029</text>
<text x="574.0" y="466.5" font-size="11.8" text-anchor="start" fill="#0f172a">• ตรวจก่อน/หลังใช้ทุกครั้ง + ตรวจละเอียดทุก 3 เดือน</text>
<text x="574.0" y="489.0" font-size="11.8" text-anchor="start" fill="#0f172a">• เลิกใช้บันได/man ropes ภายใน 36 เดือนหลังผลิต</text>
<text x="574.0" y="511.5" font-size="11.8" text-anchor="start" fill="#0f172a">  หรือ 30 เดือนหลังเริ่มใช้ (แล้วแต่อย่างใดถึงก่อน)</text>
</svg>
