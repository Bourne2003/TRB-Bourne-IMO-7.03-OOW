<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การจัดบันไดนำร่อง (Pilot transfer arrangements — SOLAS V/23) — สาระสำคัญ</text>
<rect x="80.0" y="60.0" width="260.0" height="440.0" rx="0" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<line x1="40.0" y1="450.0" x2="520.0" y2="450.0" stroke="#0284c7" stroke-width="2"/>
<text x="44.0" y="470.0" font-size="11" text-anchor="start" fill="#0284c7">ผิวน้ำ</text>
<line x1="346.0" y1="120.0" x2="346.0" y2="445.0" stroke="#a16207" stroke-width="3"/>
<line x1="376.0" y1="120.0" x2="376.0" y2="445.0" stroke="#a16207" stroke-width="3"/>
