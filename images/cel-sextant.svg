<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
  <rect width="900" height="560" fill="#fff"/>
  <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#d97706"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ส่วนประกอบของ Sextant และทางเดินแสง</text>
  <!-- frame sector -->
  <path d="M 430 110 L 262 420 A 352 352 0 0 0 598 420 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <path d="M 430 110 L 300 350 L 560 350 Z" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <!-- arc graduations -->
  <path d="M 262 420 A 352 352 0 0 0 598 420" fill="none" stroke="#0f172a" stroke-width="7"/>
  <g stroke="#0f172a" stroke-width="1.5">
    <line x1="290" y1="433" x2="293" y2="445"/><line x1="320" y1="443" x2="322" y2="455"/><line x1="350" y1="450" x2="351" y2="462"/>
    <line x1="380" y1="455" x2="380" y2="467"/><line x1="410" y1="458" x2="410" y2="470"/><line x1="440" y1="459" x2="440" y2="471"/>
    <line x1="470" y1="457" x2="470" y2="469"/><line x1="500" y1="454" x2="501" y2="466"/><line x1="530" y1="448" x2="532" y2="460"/><line x1="560" y1="440" x2="563" y2="452"/>
  </g>
  <text x="455" y="500" text-anchor="end" font-size="14" fill="#0f172a">Arc (สเกล 0°–120°, ยาวจริงประมาณ 60°)</text>
  <!-- index arm -->
  <line x1="430" y1="110" x2="476" y2="470" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="478" cy="478" r="16" fill="#1e3a8a"/><circle cx="478" cy="478" r="6" fill="#93c5fd"/>
  <text x="470" y="526" text-anchor="end" font-size="13" fill="#1e3a8a" font-weight="bold">Micrometer drum + vernier</text><line x1="472" y1="518" x2="476" y2="494" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="474" y="300" font-size="13" fill="#1e3a8a" font-weight="bold">Index arm</text>
  <!-- light path -->
  <line x1="335" y1="46" x2="430" y2="110" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#ah)"/>
  <text x="220" y="66" font-size="14" fill="#b45309" font-weight="bold">แสงจากดาว ★</text>
  <line x1="430" y1="110" x2="250" y2="180" stroke="#d97706" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="250" y1="180" x2="700" y2="200" stroke="#d97706" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="30" y1="190" x2="248" y2="186" stroke="#0369a1" stroke-width="2.5" stroke-dasharray="3 4"/>
  <text x="30" y="178" font-size="14" fill="#0369a1" font-weight="bold">ขอบฟ้า (มองตรง)</text>
  <!-- index mirror -->
  <line x1="427" y1="135" x2="433" y2="85" stroke="#0f172a" stroke-width="9"/>
  <text x="446" y="88" font-size="14" font-weight="bold" fill="#0f172a">Index mirror</text>
  <!-- horizon mirror -->
  <line x1="246" y1="155" x2="254" y2="205" stroke="#0f172a" stroke-width="9"/>
  <line x1="250" y1="180" x2="254" y2="205" stroke="#7dd3fc" stroke-width="9"/>
  <text x="130" y="236" font-size="14" font-weight="bold" fill="#0f172a">Horizon mirror</text>
  <text x="112" y="254" font-size="12" fill="#334155">(ครึ่งเงา / ครึ่งใส)</text>
  <!-- shades -->
  <rect x="320" y="128" width="30" height="16" fill="#334155" opacity="0.75" transform="rotate(-21 335 136)"/>
  <rect x="345" y="120" width="30" height="16" fill="#065f46" opacity="0.7" transform="rotate(-21 360 128)"/>
  <text x="300" y="112" font-size="12" fill="#334155">Index shades</text>
  <rect x="200" y="200" width="16" height="30" fill="#334155" opacity="0.6"/>
  <text x="160" y="276" font-size="12" fill="#334155">Horizon shades</text>
  <!-- telescope -->
  <rect x="560" y="182" width="140" height="26" rx="6" fill="#64748b" transform="rotate(2.5 630 195)"/>
  <rect x="700" y="186" width="22" height="22" rx="3" fill="#334155"/>
  <text x="590" y="240" font-size="14" font-weight="bold" fill="#334155">Telescope</text>
  <circle cx="752" cy="200" r="12" fill="none" stroke="#0f172a" stroke-width="2"/><circle cx="752" cy="200" r="4" fill="#0f172a"/>
  <text x="772" y="205" font-size="13">ตาผู้สังเกต</text>
  <!-- handle -->
  <path d="M 600 300 Q 680 300 690 360 Q 692 420 610 420" fill="none" stroke="#7c2d12" stroke-width="14" stroke-linecap="round"/>
  <text x="700" y="395" font-size="14" font-weight="bold" fill="#7c2d12">Handle</text>
  <text x="300" y="320" font-size="14" font-weight="bold" fill="#475569">Frame</text>
  <!-- principle box -->
  <rect x="612" y="452" width="275" height="96" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="624" y="476" font-size="13" font-weight="bold" fill="#92400e">Principle of double reflection</text>
  <text x="624" y="498" font-size="12" fill="#0f172a">มุมระหว่างทิศแรกกับทิศสุดท้ายของแสง</text>
  <text x="624" y="516" font-size="12" fill="#0f172a">= 2 × มุมระหว่างกระจกทั้งสองบาน</text>
  <text x="624" y="536" font-size="12" fill="#0f172a">→ altitude ที่อ่าน = 2 × มุมที่แขนหมุน</text>
</svg>
