<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="430" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker><marker id="arO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c2410c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การออกจากท่าโดยใช้ spring (Springing off) — เทียบกราบซ้าย ใบจักรเวียนขวา</text>
<rect x="40" y="340" width="920" height="50" fill="#a8a29e" stroke="#57534e"/><text x="500.0" y="372.0" font-size="13" text-anchor="middle" fill="#1c1917" font-weight="bold">หน้าท่า (อยู่กราบซ้ายของเรือ — หัวเรือหันไปทางซ้ายของภาพ)</text>
<polygon points="65.0,318.0 104.6,300.0 295.0,300.0 295.0,336.0 104.6,336.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<line x1="73.0" y1="326.0" x2="145.0" y2="340.0" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="67" cy="332" r="6" fill="#facc15" stroke="#854d0e"/><text x="180.0" y="90.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">1. Single up เหลือ fwd spring</text>
<text x="180.0" y="110.0" font-size="12" text-anchor="middle" fill="#334155">มีกันชน (fender) ที่หัวเรือ</text>
<polygon points="385.0,318.0 419.1,291.0 603.8,244.9 612.5,279.8 427.8,325.9" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<line x1="393.0" y1="326.0" x2="465.0" y2="340.0" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="387" cy="332" r="6" fill="#facc15" stroke="#854d0e"/><text x="500.0" y="90.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">2. Slow ahead + หางเสือ hard to port</text>
<text x="500.0" y="110.0" font-size="12" text-anchor="middle" fill="#334155">หัวถูก spring ยึด → ท้ายเหวี่ยงออก</text>
<polygon points="705.0,318.0 732.7,284.5 903.8,201.0 919.6,233.4 748.5,316.8" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<line x1="713.0" y1="326.0" x2="785.0" y2="340.0" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="707" cy="332" r="6" fill="#facc15" stroke="#854d0e"/><text x="820.0" y="90.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">3. ท้ายออกพอ → stop, let go spring</text>
<text x="820.0" y="110.0" font-size="12" text-anchor="middle" fill="#334155">ถอยหลังออก (ท้ายปัดซ้ายเล็กน้อย)</text>
<path d="M 600 255 q 10 -40 -10 -75" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR)"/><text x="180.0" y="140.0" font-size="11.5" text-anchor="middle" fill="#1d4ed8">เส้นสีน้ำเงิน = forward spring (นำไปทางท้าย)</text>
<text x="820.0" y="128.0" font-size="11.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">ข้อควรระวัง: ถอยหลังแล้วท้ายปัดซ้าย = กลับเข้าหาท่า</text>
<text x="820.0" y="144.0" font-size="11.5" text-anchor="middle" fill="#b91c1c">จึงต้องให้ท้ายออกได้มุมพอก่อนสั่งถอย</text>
<text x="500.0" y="415.0" font-size="12" text-anchor="middle" fill="#334155">ภาพจำลองแนวคิด — ถ้ามีลมพัดเข้าท่า กระแสแรง หรือเรือใหญ่ ใช้ tug/bow thruster ตามแผนของนายเรือและนำร่อง</text>
</svg>
