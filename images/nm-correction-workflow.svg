<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
  <rect width="980" height="470" fill="#fff"/>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การแก้ไขแผนที่และสิ่งพิมพ์ด้วย Notices to Mariners</text>
  <g font-size="13">
    <rect x="20" y="70" width="170" height="70" rx="10" fill="#1e3a8a"/><text x="105" y="100" text-anchor="middle" fill="#fff" font-weight="bold">Weekly NMs</text><text x="105" y="122" text-anchor="middle" fill="#c7d2fe">ฉบับพิมพ์ / ดิจิทัล</text>
    <line x1="190" y1="105" x2="235" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <rect x="240" y="70" width="190" height="70" rx="10" fill="#2563eb"/><text x="335" y="98" text-anchor="middle" fill="#fff" font-weight="bold">คัดเลือก NM</text><text x="335" y="120" text-anchor="middle" fill="#dbeafe">ตามแผนที่ที่มีบนเรือ</text>
    <line x1="430" y1="105" x2="475" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <rect x="480" y="70" width="210" height="70" rx="10" fill="#0e7490"/><text x="585" y="98" text-anchor="middle" fill="#fff" font-weight="bold">ตรวจ "previous update"</text><text x="585" y="120" text-anchor="middle" fill="#cffafe">ตกหล่น? → ย้อนหา NP234</text>
    <line x1="690" y1="105" x2="735" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <rect x="740" y="70" width="220" height="70" rx="10" fill="#15803d"/><text x="850" y="98" text-anchor="middle" fill="#fff" font-weight="bold">ลงมือแก้ไข</text><text x="850" y="120" text-anchor="middle" fill="#dcfce7">Insert / Delete / Amend / Move</text>
  </g>
  <g font-size="13">
    <rect x="20" y="190" width="300" height="150" rx="10" fill="#fdf2f8" stroke="#be185d"/>
    <text x="34" y="216" font-weight="bold" fill="#9d174d">Permanent NM (แผนที่กระดาษ)</text>
    <text x="34" y="242">• หมึกม่วงแดง เส้นบาง ไม่บังข้อมูล</text>
    <text x="34" y="266">• สัญลักษณ์ตาม NP5011</text>
    <text x="34" y="290">• เขียน "ปี – เลข NM" ที่ Small</text>
    <text x="34" y="310">  Corrections box มุมล่างซ้าย</text>
    <text x="34" y="332">• บันทึกใน chart correction log</text>
    <rect x="340" y="190" width="300" height="150" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="354" y="216" font-weight="bold" fill="#334155">T &amp; P NMs</text>
    <text x="354" y="242">• เขียนดินสอ พร้อมเลข (T)/(P)</text>
    <text x="354" y="266">• เก็บแฟ้ม T&amp;P ตรวจสถานะ</text>
    <text x="354" y="290">• ตรวจ NP247(2) ต้นปี</text>
    <text x="354" y="314">• ลบเมื่อถูกยกเลิก/แทนที่</text>
    <rect x="660" y="190" width="300" height="150" rx="10" fill="#ecfdf5" stroke="#15803d"/>
    <text x="674" y="216" font-weight="bold" fill="#166534">สิ่งพิมพ์ / ดิจิทัล</text>
    <text x="674" y="242">• SD: Section IV · ALL: V · ALRS: VI</text>
    <text x="674" y="266">• ENC: อัปเดต AVCS รายสัปดาห์</text>
    <text x="674" y="290">• ตรวจ update status ใน ECDIS</text>
    <text x="674" y="314">• NAVAREA/NAVTEX → manual update</text>
  </g>
  <rect x="20" y="370" width="940" height="80" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="36" y="398" font-size="14" font-weight="bold" fill="#92400e">ตรวจสอบเป็นระยะ</text>
  <text x="36" y="424" font-size="13">NP234 Cumulative List (ม.ค./ก.ค.) · NP131 Catalogue (รายปี) · New Editions ในแต่ละสัปดาห์ · audit ภายใน/ภายนอก (ISM, PSC, vetting)</text>
</svg>
