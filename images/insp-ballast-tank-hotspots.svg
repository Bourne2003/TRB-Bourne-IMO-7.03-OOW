<circle cx="664" cy="96" r="11" fill="#b91c1c"/><text x="664.0" y="100.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<text x="684.0" y="100.0" font-size="11.5" text-anchor="start" fill="#0f172a">ปลายแขน bracket (bracket toes) —</text>
<text x="684.0" y="117.0" font-size="11.5" text-anchor="start" fill="#0f172a">รอยร้าวล้า (fatigue)</text>
<circle cx="664" cy="139" r="11" fill="#b91c1c"/><text x="664.0" y="143.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="684.0" y="143.0" font-size="11.5" text-anchor="start" fill="#0f172a">รอยต่อ longitudinal กับ web frame</text>
<text x="684.0" y="160.0" font-size="11.5" text-anchor="start" fill="#0f172a">— รอยร้าว, coating แตกตามแนวเชื่อม</text>
<circle cx="664" cy="182" r="11" fill="#b91c1c"/><text x="664.0" y="186.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<text x="684.0" y="186.0" font-size="11.5" text-anchor="start" fill="#0f172a">ใต้ดาดฟ้า (under-deck) — ร้อน</text>
<text x="684.0" y="203.0" font-size="11.5" text-anchor="start" fill="#0f172a">กัดกร่อนเร็วที่สุด</text>
<circle cx="664" cy="225" r="11" fill="#b91c1c"/><text x="664.0" y="229.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<text x="684.0" y="229.0" font-size="11.5" text-anchor="start" fill="#0f172a">พื้นถังใต้ตะกอน — pitting</text>
<circle cx="664" cy="251" r="11" fill="#b91c1c"/><text x="664.0" y="255.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
<text x="684.0" y="255.0" font-size="11.5" text-anchor="start" fill="#0f172a">Sacrificial anode — สึกไปกี่ %</text>
<text x="684.0" y="272.0" font-size="11.5" text-anchor="start" fill="#0f172a">ยึดแน่นหรือไม่</text>
<circle cx="664" cy="294" r="11" fill="#b91c1c"/><text x="664.0" y="298.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">6</text>
<text x="684.0" y="298.0" font-size="11.5" text-anchor="start" fill="#0f172a">Bellmouth/ปากดูด — erosion,</text>
<text x="684.0" y="315.0" font-size="11.5" text-anchor="start" fill="#0f172a">pitting, strum/กระจัง</text>
<circle cx="664" cy="337" r="11" fill="#b91c1c"/><text x="664.0" y="341.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">7</text>
<text x="684.0" y="341.0" font-size="11.5" text-anchor="start" fill="#0f172a">ขอบ manhole — รอยร้าว ขอบบาง</text>
<circle cx="664" cy="363" r="11" fill="#b91c1c"/><text x="664.0" y="367.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">8</text>
<text x="684.0" y="367.0" font-size="11.5" text-anchor="start" fill="#0f172a">บันได แท่นพัก ราว — กัดกร่อน</text>
<text x="684.0" y="384.0" font-size="11.5" text-anchor="start" fill="#0f172a">(ความปลอดภัยของผู้ตรวจ)</text>
<circle cx="664" cy="406" r="11" fill="#b91c1c"/><text x="664.0" y="410.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">9</text>
<text x="684.0" y="410.0" font-size="11.5" text-anchor="start" fill="#0f172a">ขอบ lightening holes/cut-outs และ</text>
<text x="684.0" y="427.0" font-size="11.5" text-anchor="start" fill="#0f172a">coating ตามขอบคม</text>
<text x="340.0" y="565.0" font-size="11.5" text-anchor="middle" fill="#475569">ภาพแนวคิดของถังข้าง/ถังท้องเรือ — ตำแหน่งจริงดูจากแบบโครงสร้างและ Ship Structure Access Manual ของเรือ</text>
