<text x="30" y="405" font-size="12" fill="#334155">แสดงใน ECDIS เป็นรูปดาวในสามเหลี่ยม/วงรี (data quality indicator) เมื่อเปิดแสดง — ใช้เพิ่ม safety margin ในพื้นที่ ZOC ต่ำ (ค่าในตารางสรุปจาก IHO S-57 / S-67)</text>
<text x="30" y="428" font-size="12" fill="#334155">S-101: CATZOC (M_QUAL) ถูกแทนด้วย Quality of Bathymetric Data ที่แยกความแม่นยำตำแหน่ง ความลึก และ seafloor coverage — การแสดงผลแบบดาวกำลังถูกทบทวน</text>
