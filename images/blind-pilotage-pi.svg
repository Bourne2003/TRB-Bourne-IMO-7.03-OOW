<text x="40" y="535" font-size="13">เป้าถาวร (ประภาคาร) เคลื่อนบนจอขนานและสวนทางกับ ground track ของเรา · ถ้าเป้าเคลื่อนตามเส้น PI = อยู่บนเส้นทาง</text>
<text x="40" y="555" font-size="13">ภาพขวา: เป้าเคลื่อนเข้ามาใกล้กว่าเส้น PI (1.2' → 0.9') ถึงเส้น clearing (แดง) = เรือถูกพาไปทางขวาเข้าหาเป้า → แก้เข็มไปทางซ้ายทันที แจ้งนายเรือ</text>
