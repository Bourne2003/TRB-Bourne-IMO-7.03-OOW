<text x="654.0" y="251.0" font-size="12.5" text-anchor="start" fill="#0f172a">• Stopping (full astern): track reach ไม่เกิน 15 L</text>
<text x="654.0" y="272.0" font-size="12.5" text-anchor="start" fill="#0f172a">  (ผ่อนได้สำหรับเรือใหญ่มาก แต่ไม่เกิน 20 L)</text>
<text x="654.0" y="293.0" font-size="12.5" text-anchor="start" fill="#0f172a">ทดลองที่: บรรทุกเต็ม · even keel · น้ำลึก</text>
<text x="654.0" y="314.0" font-size="12.5" text-anchor="start" fill="#0f172a">ไม่จำกัด · ทะเลสงบ · test speed</text>
<text x="654.0" y="335.0" font-size="12.5" text-anchor="start" fill="#0f172a">Final (steady) diameter ในภาพ ≈ 551 m</text>
