<text x="305.0" y="176.0" font-size="12.5" text-anchor="start" fill="#b91c1c" font-weight="bold">≈ 1,700 m (≈ 10 L, 0.9 nm) · ≈ 6 นาที</text>
<text x="305.0" y="194.0" font-size="12" text-anchor="start" fill="#b91c1c">หัวเรือมักปัดไปทางขวา (RH FPP) → เส้นทางเบนไปทางกราบขวา</text>
<text x="305.0" y="212.0" font-size="11" text-anchor="start" fill="#7f1d1d">(ระยะด้านข้างในภาพขยายสเกลให้เห็นชัด)</text>
<line x1="70.0" y1="250.0" x2="214.8" y2="250.0" stroke="#c2410c" stroke-width="5"/>
<text x="70.0" y="236.0" font-size="13" text-anchor="start" fill="#c2410c" font-weight="bold">Crash stop จาก 14 kn (full ahead manoeuvring)</text>
<text x="224.8" y="255.0" font-size="12.5" text-anchor="start" fill="#c2410c" font-weight="bold">≈ 1,200 m (≈ 7 L, 0.65 nm) · ≈ 5.5 นาที</text>
<line x1="70.0" y1="320.0" x2="926.0" y2="320.0" stroke="#64748b" stroke-width="6"/>
<text x="70.0" y="306.0" font-size="13" text-anchor="start" fill="#334155" font-weight="bold">Inertia stop (Stop engine ปล่อยไหลไปเอง) จาก 19 kn จนเหลือ 2 kn ≈ 7,100 m (3.9 nm) · ≈ 46 นาที</text>
<line x1="70.0" y1="352.0" x2="910.0" y2="352.0" stroke="#0f172a" stroke-width="1"/>
