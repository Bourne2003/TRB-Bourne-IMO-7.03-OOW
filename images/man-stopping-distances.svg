<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ระยะหยุดเรือ (Stopping) — crash stop เทียบ inertia stop (เรือสมมุติ บรรทุกเต็ม น้ำลึก)</text>
<text x="70.0" y="92.0" font-size="13" text-anchor="start" fill="#b91c1c" font-weight="bold">Crash stop (Full ahead → Full astern) จาก 19 kn</text>
