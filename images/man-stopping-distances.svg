<text x="550.0" y="372.0" font-size="11" text-anchor="middle" fill="#0f172a">4 km</text>
<line x1="670.0" y1="347.0" x2="670.0" y2="357.0" stroke="#0f172a" stroke-width="1"/>
<text x="670.0" y="372.0" font-size="11" text-anchor="middle" fill="#0f172a">5 km</text>
<line x1="790.0" y1="347.0" x2="790.0" y2="357.0" stroke="#0f172a" stroke-width="1"/>
<text x="790.0" y="372.0" font-size="11" text-anchor="middle" fill="#0f172a">6 km</text>
<line x1="910.0" y1="347.0" x2="910.0" y2="357.0" stroke="#0f172a" stroke-width="1"/>
<text x="910.0" y="372.0" font-size="11" text-anchor="middle" fill="#0f172a">7 km</text>
<text x="40.0" y="410.0" font-size="12" text-anchor="start" fill="#334155">คำศัพท์: Head reach = ระยะตามแนวเข็มเดิมจนหยุด · Track reach = ระยะตามทางเดินจริง · Lateral deviation = ระยะเบนออกด้านข้าง</text>
<text x="40.0" y="430.0" font-size="12" text-anchor="start" fill="#334155">ระยะหยุดขึ้นกับมวล (displacement + added mass) และความเร็วยกกำลังสอง — บรรทุกเต็มหยุดยากกว่าเรือเปล่ามาก; น้ำไหลตามทำให้ไปไกลขึ้นเมื่อเทียบพื้น</text>
<text x="40.0" y="450.0" font-size="12" text-anchor="start" fill="#334155">ตัวเลขจากแบบจำลองอย่างง่าย (มวล 31,000 t, แรงถอย 700 kN, หน่วงกลับเครื่อง 45 s) — ใช้ค่าจาก manoeuvring booklet ของเรือจริงเสมอ</text>
</svg>
