<rect x="576.0" y="418.0" width="14.0" height="14.0" rx="2" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1"/>
<text x="598.0" y="430.0" font-size="11.6" text-anchor="start" fill="#0f172a">ต่ำ (1–2): ยอมรับได้ ควบคุมตามปกติ</text>
<rect x="576.0" y="440.0" width="14.0" height="14.0" rx="2" fill="#fde68a" stroke="#94a3b8" stroke-width="1"/>
<text x="598.0" y="452.0" font-size="11.6" text-anchor="start" fill="#0f172a">ต่ำ–กลาง (3–6): ลดให้ต่ำที่สุดเท่าที่ทำได้ (ALARP)</text>
<rect x="576.0" y="462.0" width="14.0" height="14.0" rx="2" fill="#fecaca" stroke="#94a3b8" stroke-width="1"/>
<text x="598.0" y="474.0" font-size="11.6" text-anchor="start" fill="#0f172a">กลาง–สูง (8–12): ต้องมีมาตรการเพิ่มก่อนเริ่มงาน</text>
<rect x="576.0" y="484.0" width="14.0" height="14.0" rx="2" fill="#f87171" stroke="#94a3b8" stroke-width="1"/>
<text x="598.0" y="496.0" font-size="11.6" text-anchor="start" fill="#0f172a">สูง (15–25): ห้ามทำจนกว่าจะลดความเสี่ยง/อนุมัติระดับสูง</text>
<text x="576.0" y="528.0" font-size="11.6" text-anchor="start" fill="#0f172a">ลำดับการควบคุม: ขจัด → ทดแทน → วิศวกรรม → บริหาร/ขั้นตอน → PPE</text>
<text x="576.0" y="550.0" font-size="11" text-anchor="start" fill="#64748b">แถบสีเป็นตัวอย่าง — ใช้ risk matrix ของบริษัท (SMS) เสมอ</text>
