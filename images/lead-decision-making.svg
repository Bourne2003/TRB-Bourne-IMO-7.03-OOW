<text x="161.8" y="415.4" font-size="10.5" text-anchor="middle" fill="#0f172a">มอบหมายงาน</text>
<text x="161.8" y="431.4" font-size="10.5" text-anchor="middle" fill="#0f172a">สื่อสารชัด</text>
<circle cx="107.3" cy="243.6" r="55" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="107.3" y="225.6" font-size="12.5" text-anchor="middle" fill="#1e3a8a" font-weight="bold">R — Review</text>
<text x="107.3" y="247.6" font-size="10.5" text-anchor="middle" fill="#0f172a">ประเมินผล</text>
<text x="107.3" y="263.6" font-size="10.5" text-anchor="middle" fill="#0f172a">ปรับเมื่อจำเป็น</text>
