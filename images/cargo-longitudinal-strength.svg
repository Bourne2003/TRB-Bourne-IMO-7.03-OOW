<text x="500.0" y="442.0" font-size="12" text-anchor="middle" fill="#0f172a">ค่าจริงต้องคำนวณด้วย loading instrument/loading computer ที่รับรอง เทียบกับค่าที่ยอมให้ (permissible) ทั้งในท่าและในทะเล</text>
