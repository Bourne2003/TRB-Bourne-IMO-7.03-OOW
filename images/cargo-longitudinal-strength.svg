<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ความแข็งแรงตามยาว: Hogging, Sagging, Shear force และ Bending moment</text>
<text x="230.0" y="72.0" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="bold">Hogging (กลางลำโก่งขึ้น)</text>
<path d="M 60 150 Q 230 95 400 150" fill="none" stroke="#b91c1c" stroke-width="16" stroke-linecap="round" opacity="0.85"/><text x="230.0" y="200.0" font-size="11.5" text-anchor="middle" fill="#334155">น้ำหนักมากที่หัว-ท้าย / ยอดคลื่นกลางลำ → ดาดฟ้ารับแรงดึง ท้องเรือรับแรงอัด</text>
<text x="730.0" y="72.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Sagging (กลางลำแอ่นลง)</text>
<path d="M 560 110 Q 730 165 900 110" fill="none" stroke="#1d4ed8" stroke-width="16" stroke-linecap="round" opacity="0.85"/><text x="730.0" y="200.0" font-size="11.5" text-anchor="middle" fill="#334155">น้ำหนักมากกลางลำ / ท้องคลื่นกลางลำ → ดาดฟ้ารับแรงอัด ท้องเรือรับแรงดึง</text>
