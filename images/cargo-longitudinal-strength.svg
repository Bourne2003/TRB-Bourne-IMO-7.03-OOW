<text x="500.0" y="482.0" font-size="12" text-anchor="middle" fill="#b91c1c">นอกจากนี้ต้องดู local strength: น้ำหนักต่อพื้นที่ tank top (t/m²), น้ำหนักกองตู้, น้ำหนักบนฝาระวาง/ดาดฟ้า</text>
<text x="500.0" y="510.0" font-size="11" text-anchor="middle" fill="#475569">กราฟเป็นรูปแบบตัวอย่างเพื่อแสดงแนวคิดเท่านั้น</text>
