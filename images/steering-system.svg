<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
  <rect width="1000" height="560" fill="#fff"/>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
  <marker id="g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker></defs>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ผังระบบถือท้าย (Steering control system &amp; steering gear)</text>
  <rect x="20" y="55" width="300" height="470" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-dasharray="6 4"/>
  <text x="170" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">สะพานเดินเรือ (Bridge)</text>
  <rect x="680" y="55" width="300" height="470" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="6 4"/>
  <text x="830" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">ห้อง Steering gear</text>
  <g font-size="13">
    <rect x="45" y="100" width="250" height="56" rx="8" fill="#1e3a8a"/><text x="170" y="124" text-anchor="middle" fill="#fff" font-weight="bold">Gyro / THD → Autopilot</text><text x="170" y="144" text-anchor="middle" fill="#c7d2fe">Heading / Track control (ECDIS)</text>
    <rect x="45" y="176" width="250" height="56" rx="8" fill="#2563eb"/><text x="170" y="200" text-anchor="middle" fill="#fff" font-weight="bold">Hand steering</text><text x="170" y="220" text-anchor="middle" fill="#dbeafe">Wheel (FU) · Tiller (NFU) · Override</text>
    <rect x="45" y="252" width="250" height="56" rx="8" fill="#0e7490"/><text x="170" y="276" text-anchor="middle" fill="#fff" font-weight="bold">Mode selector</text><text x="170" y="296" text-anchor="middle" fill="#cffafe">AUTO / HAND / NFU · System 1/2</text>
    <rect x="45" y="430" width="250" height="56" rx="8" fill="#f8fafc" stroke="#334155"/><text x="170" y="454" text-anchor="middle" font-weight="bold">Rudder Angle Indicator</text><text x="170" y="474" text-anchor="middle" fill="#475569">(อิสระจากระบบควบคุม) + Alarms</text>
    <path d="M 45 128 L 32 128 L 32 280 L 43 280" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <line x1="170" y1="232" x2="170" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <line x1="295" y1="280" x2="400" y2="280" stroke="#334155" stroke-width="2.5"/>
    <rect x="400" y="230" width="210" height="100" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="505" y="258" text-anchor="middle" font-weight="bold" fill="#78350f">Control system No.1 / No.2</text>
    <text x="505" y="280" text-anchor="middle" fill="#78350f">(electric / hydraulic telemotor)</text>
    <text x="505" y="302" text-anchor="middle" fill="#78350f">สองชุดแยกอิสระ</text>
    <line x1="610" y1="280" x2="700" y2="280" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="705" y="100" width="250" height="70" rx="8" fill="#b91c1c"/><text x="830" y="128" text-anchor="middle" fill="#fff" font-weight="bold">Power unit No.1</text><text x="830" y="150" text-anchor="middle" fill="#fee2e2">มอเตอร์ + ปั๊มไฮดรอลิก</text>
    <rect x="705" y="185" width="250" height="70" rx="8" fill="#b91c1c"/><text x="830" y="213" text-anchor="middle" fill="#fff" font-weight="bold">Power unit No.2</text><text x="830" y="235" text-anchor="middle" fill="#fee2e2">(V/25: เปิดทั้งสองในพื้นที่จำกัด)</text>
    <rect x="705" y="290" width="250" height="80" rx="8" fill="#7f1d1d"/><text x="830" y="320" text-anchor="middle" fill="#fff" font-weight="bold">Actuator</text><text x="830" y="342" text-anchor="middle" fill="#fecaca">Ram (2/4 rams) หรือ Rotary vane</text>
    <text x="830" y="360" text-anchor="middle" fill="#fecaca">+ isolating valves</text>
    <rect x="705" y="390" width="250" height="50" rx="8" fill="#334155"/><text x="830" y="420" text-anchor="middle" fill="#fff" font-weight="bold">Rudder stock → Rudder</text>
    <rect x="705" y="455" width="250" height="56" rx="8" fill="#fff" stroke="#b91c1c"/><text x="830" y="478" text-anchor="middle" font-weight="bold" fill="#991b1b">Local / Emergency control</text><text x="830" y="498" text-anchor="middle" fill="#7f1d1d">โทรศัพท์ถึงสะพาน + gyro repeater</text>
    <line x1="830" y1="170" x2="830" y2="183" stroke="#334155" stroke-width="2"/>
    <line x1="830" y1="255" x2="830" y2="288" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <line x1="830" y1="370" x2="830" y2="388" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <path d="M 705 415 L 560 415 L 560 335" fill="none" stroke="#15803d" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#g)"/>
    <text x="440" y="400" fill="#15803d" font-weight="bold">Feedback (follow-up)</text>
    <path d="M 705 425 L 300 458" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#g)"/>
    <text x="400" y="470" fill="#15803d">มุมหางเสือจริง → RAI</text>
  </g>
</svg>
