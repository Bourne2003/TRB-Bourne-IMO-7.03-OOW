<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
  <rect width="960" height="620" fill="#fff"/>
  <defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ระดับอ้างอิงแนวตั้งบนแผนที่ (Vertical datums)</text>
  <!-- land left with lighthouse, bridge on right -->
  <path d="M 0 140 L 160 140 L 210 300 L 250 420 L 0 420 Z" fill="#f5deb3" stroke="#8b6b3d" stroke-width="2"/>
  <rect x="60" y="70" width="22" height="70" fill="#f8fafc" stroke="#111827"/><circle cx="71" cy="66" r="8" fill="#facc15" stroke="#111827"/>
  <text x="96" y="74" font-size="13" font-weight="bold">ไฟ / ยอดเขา</text>
  <!-- water levels -->
  <g font-size="13">
    <line x1="0" y1="200" x2="960" y2="200" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 4"/><text x="812" y="194" fill="#7c3aed" font-weight="bold">HAT</text>
    <line x1="0" y1="225" x2="960" y2="225" stroke="#1d4ed8" stroke-width="2"/><text x="812" y="220" fill="#1d4ed8" font-weight="bold">MHWS</text>
    <line x1="0" y1="290" x2="960" y2="290" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="3 4"/><text x="812" y="285" fill="#0891b2" font-weight="bold">MSL</text>
    <line x1="0" y1="350" x2="960" y2="350" stroke="#0f766e" stroke-width="2"/><text x="812" y="345" fill="#0f766e" font-weight="bold">MLWS</text>
    <line x1="0" y1="380" x2="960" y2="380" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="10 5"/><text x="808" y="374" fill="#b91c1c" font-weight="bold" font-size="12">LAT ≈ CD</text>
  </g>
  <rect x="250" y="260" width="710" height="360" fill="#dbeafe" opacity="0.45"/>
  <!-- seabed -->
  <path d="M 250 420 Q 330 470 420 500 L 960 520 L 960 620 L 250 620 Z" fill="#d6b98c" stroke="#92400e" stroke-width="2"/>
  <!-- drying bank -->
  <path d="M 230 400 Q 280 330 330 360 Q 360 380 380 420 Z" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <!-- height arrow -->
  <line x1="40" y1="225" x2="40" y2="70" stroke="#0f172a" stroke-width="1.6" marker-start="url(#m)" marker-end="url(#m)"/>
  <text x="8" y="150" font-size="12" transform="rotate(-90 20 150)">Height (เหนือ MHWS)</text>
  <!-- drying height -->
  <line x1="300" y1="380" x2="300" y2="345" stroke="#15803d" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>
  <text x="250" y="330" font-size="12" fill="#15803d" font-weight="bold">Drying height (เหนือ CD)</text>
  <!-- charted depth -->
  <line x1="540" y1="380" x2="540" y2="506" stroke="#b91c1c" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>
  <text x="380" y="470" font-size="13" fill="#b91c1c" font-weight="bold">Charted depth (ใต้ CD)</text>
  <!-- height of tide -->
  <line x1="470" y1="380" x2="470" y2="260" stroke="#1d4ed8" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>
  <line x1="420" y1="260" x2="520" y2="260" stroke="#0284c7" stroke-width="3"/>
  <text x="380" y="252" font-size="12" fill="#0284c7" font-weight="bold">ระดับน้ำขณะนั้น</text>
  <text x="478" y="330" font-size="12" fill="#1d4ed8" font-weight="bold">Height of tide</text>
  <!-- bridge -->
  <rect x="600" y="80" width="200" height="22" fill="#64748b"/>
  <rect x="600" y="102" width="16" height="420" fill="#94a3b8"/><rect x="784" y="102" width="16" height="420" fill="#94a3b8"/>
  <text x="670" y="72" font-size="13" font-weight="bold">สะพาน</text>
  <line x1="740" y1="102" x2="740" y2="200" stroke="#7c3aed" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>
  <text x="622" y="140" font-size="12" fill="#7c3aed" font-weight="bold">Vertical</text><text x="622" y="156" font-size="12" fill="#7c3aed" font-weight="bold">clearance</text>
  <text x="622" y="172" font-size="12" fill="#7c3aed" font-weight="bold">(เหนือ HAT)</text>
  <text x="270" y="572" font-size="13" fill="#334155">ความลึกจริง = Charted depth + Height of tide · ระยะลอดจริง = Clearance + (HAT − ระดับน้ำขณะนั้น)</text>
  <text x="270" y="596" font-size="13" fill="#334155">น้ำเหนือที่แห้ง (drying feature) = Height of tide − Drying height · ลำดับจากบน: HAT &gt; MHWS &gt; MSL &gt; MLWS &gt; LAT</text>
</svg>
