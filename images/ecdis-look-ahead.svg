<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Anti-grounding: look-ahead area และ alarm "crossing safety contour"</text>
<rect x="0" y="40" width="1000" height="430" fill="#dbeefe"/>
<path d="M 560 40 Q 640 160 600 260 Q 570 330 640 470 L 1000 470 L 1000 40 Z" fill="#a8d4f7"/>
<path d="M 560 40 Q 640 160 600 260 Q 570 330 640 470" fill="none" stroke="#111827" stroke-width="4"/>
<path d="M 760 40 Q 820 200 790 300 Q 770 380 800 470 L 1000 470 L 1000 40 Z" fill="#c9a66b"/>
<text x="616" y="232" font-size="14" font-weight="bold">Safety contour</text><text x="840" y="250" font-size="14">บก</text>
<polygon points="268.5,318.1 623.4,180.2 585.4,98.6 251.5,281.9" fill="#fca5a5" opacity="0.55" stroke="#b91c1c" stroke-dasharray="6 4"/>
<g transform="translate(260,300) rotate(65)"><path d="M 0 -18 L 8 10 L -8 10 Z" fill="#111827"/></g>
<line x1="260" y1="300" x2="368.8" y2="249.3" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/>
<text x="120" y="360" font-size="14" font-weight="bold">Own ship + vector</text>
<text x="110" y="150" font-size="14" font-weight="bold" fill="#b91c1c">Look-ahead area</text><text x="110" y="170" font-size="12" fill="#b91c1c">(เช่น 6 นาที × SOG และความกว้างที่ตั้ง)</text>
<circle cx="618" cy="170" r="14" fill="none" stroke="#dc2626" stroke-width="3"/><text x="640" y="112" font-size="14" font-weight="bold" fill="#dc2626">ALARM: crossing safety contour</text><line x1="640" y1="118" x2="624" y2="158" stroke="#dc2626" stroke-width="2"/>
<rect x="20" y="380" width="520" height="80" rx="8" fill="#fff" stroke="#94a3b8"/>
<text x="34" y="404" font-size="13">ถ้าพื้นที่ look-ahead แตะ safety contour หรือ area พิเศษ → ALARM</text>
<text x="34" y="426" font-size="13">สั้นเกินไป → เตือนช้า · ยาวเกินไป → alarm ตลอด (alarm fatigue)</text>
<text x="34" y="448" font-size="13">ห้ามปิดเสียง alarm แบบถาวร — ปรับค่าให้เหมาะกับสถานการณ์แทน</text>
</svg>
