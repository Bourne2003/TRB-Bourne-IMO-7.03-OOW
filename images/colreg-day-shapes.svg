<text x="889" y="484" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ขนาดจริง (Annex I §6)</text>
<text x="804" y="512" font-size="11" fill="#334155">• ลูกกลม Ø ≥ 0.6 m</text>
<text x="804" y="534" font-size="11" fill="#334155">• กรวย ฐาน ≥ 0.6 m สูง = ฐาน</text>
<text x="804" y="556" font-size="11" fill="#334155">• ทรงกระบอก Ø ≥ 0.6 m สูง 2Ø</text>
<text x="804" y="578" font-size="11" fill="#334155">• ข้าวหลามตัด = กรวยคู่ฐานชนกัน</text>
<text x="804" y="600" font-size="11" fill="#334155">• ระยะห่างแนวตั้ง ≥ 1.5 m</text>
<text x="804" y="622" font-size="11" fill="#334155">• เรือ &lt; 20 m ย่อขนาดได้ตามสัดส่วน</text>
<text x="20" y="700" font-size="12" fill="#334155">ภาพไม่ตามมาตราส่วน (ระยะห่างจริงระหว่างทุ่นวัน ≥ 1.5 m ห่างกว่าในภาพมาก) · ทุ่นวันทุกแบบเป็นสีดำ ยกเว้นธง A ของงานดำน้ำ</text>
