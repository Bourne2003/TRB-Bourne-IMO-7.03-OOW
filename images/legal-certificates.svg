<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="680" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ใบรับรองและเอกสารสำคัญของเรือสินค้า (ตัวอย่าง — ตรวจรายการเต็มตาม FAL/รัฐเจ้าของธง)</text>
