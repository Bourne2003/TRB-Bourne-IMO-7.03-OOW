<text x="770.0" y="479.0" font-size="11.5" text-anchor="start" fill="#334155">บันทึกประวัติต่อเนื่อง</text>
<rect x="30.0" y="492.0" width="940.0" height="32.0" rx="4" fill="#eef2ff" stroke="#e2e8f0" stroke-width="1"/>
<text x="46.0" y="513.0" font-size="12" text-anchor="start" fill="#0f172a">ประกันภัยตามอนุสัญญา (CLC · Bunkers · Wreck Removal)</text>
<text x="560.0" y="513.0" font-size="11.5" text-anchor="start" fill="#334155">ความรับผิดทางแพ่ง</text>
<text x="770.0" y="513.0" font-size="11.5" text-anchor="start" fill="#334155">ตามระยะประกัน</text>
<rect x="30.0" y="526.0" width="940.0" height="32.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
