<text x="500.0" y="650.0" font-size="12" text-anchor="middle" fill="#b91c1c">บันทึก (logs): Official log, deck/engine log, ORB, GRB, BWRB, Cargo Record Book, GMDSS log, hours of rest — เป็นเอกสารทางกฎหมาย</text>
<text x="500.0" y="670.0" font-size="11.5" text-anchor="middle" fill="#475569">ใช้ระบบการสำรวจและออกใบรับรองที่ประสานกัน (HSSC) — annual window ± 3 เดือนจากวันครบรอบ</text>
