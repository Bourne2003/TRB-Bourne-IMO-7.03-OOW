<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การคำนวณ trim เมื่อบรรทุกน้ำหนักเพิ่ม (ตัวอย่างจำลอง)</text>
<path d="M 80 150 L 900 150 L 940 200 L 900 300 L 110 300 Q 80 290 80 250 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/><line x1="60.0" y1="230.0" x2="960.0" y2="230.0" stroke="#0284c7" stroke-width="2"/>
<text x="64.0" y="224.0" font-size="11" text-anchor="start" fill="#0284c7">WL เดิม</text>
<line x1="60.0" y1="240.0" x2="960.0" y2="214.0" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 4"/>
<text x="64.0" y="256.0" font-size="11" text-anchor="start" fill="#b91c1c" font-weight="bold">WL ใหม่ (trim by head)</text>
<line x1="490.0" y1="140.0" x2="490.0" y2="310.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="490.0" y="132.0" font-size="11" text-anchor="middle" fill="#475569">⊗ กลางลำ</text>
<circle cx="475.0" cy="230" r="6" fill="#15803d"/><text x="467.0" y="252.0" font-size="11.5" text-anchor="end" fill="#15803d" font-weight="bold">LCF (3.0 m ท้ายกลางลำ)</text>
<rect x="718.1" y="115.0" width="50.0" height="35.0" rx="0" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
<text x="743.1" y="137.0" font-size="12" text-anchor="middle" fill="#78350f" font-weight="bold">400 t</text>
<line x1="475.0" y1="330.0" x2="743.1" y2="330.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arR)"/>
<text x="609.0" y="348.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">ระยะจาก LCF = 53 m</text>
<text x="80.0" y="320.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">AP</text>
<text x="900.0" y="320.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">FP</text>
<rect x="40.0" y="365.0" width="920.0" height="95.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="56.0" y="388.0" font-size="12.3" text-anchor="start" fill="#0f172a">ข้อมูล: LBP 162 m · TPC 42 t/cm · MCTC 380 t·m/cm · draught เดิม F 9.40 m A 9.80 m · บรรทุก 400 t ที่ 50 m หน้ากลางลำ</text>
<text x="56.0" y="409.0" font-size="12.3" text-anchor="start" fill="#0f172a">1) Sinkage = 400 ÷ 42 = 9.5 cm  ·  2) Change of trim = 400 × 53 ÷ 380 = 55.8 cm (by head)</text>
<text x="56.0" y="430.0" font-size="12.3" text-anchor="start" fill="#0f172a">3) แบ่งตามระยะ LCF: ท้าย = 55.8 × 78 ÷ 162 = 26.9 cm (ลด) · หัว = 55.8 − 26.9 = 28.9 cm (เพิ่ม)</text>
<text x="56.0" y="451.0" font-size="12.3" text-anchor="start" fill="#0f172a" font-weight="bold">4) Draught ใหม่: F = 9.40 + 0.095 + 0.289 = 9.78 m · A = 9.80 + 0.095 − 0.269 = 9.63 m</text>
</svg>
