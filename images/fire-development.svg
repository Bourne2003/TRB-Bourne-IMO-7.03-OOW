<text x="635.0" y="366.0" font-size="11" text-anchor="middle" fill="#7f1d1d" font-weight="bold">ลุกลาม</text>
<text x="711.5" y="366.0" font-size="11" text-anchor="middle" fill="#7f1d1d" font-weight="bold">Flashover</text>
<text x="779.0" y="366.0" font-size="11" text-anchor="middle" fill="#7f1d1d" font-weight="bold">เต็มห้อง</text>
<text x="896.0" y="366.0" font-size="11" text-anchor="middle" fill="#7f1d1d" font-weight="bold">มอด</text>
<line x1="711.5" y1="100.0" x2="711.5" y2="350.0" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="40.0" y="400.0" width="920.0" height="95.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="56.0" y="424.0" font-size="12" text-anchor="start" fill="#0f172a">Flashover — ทุกอย่างในห้องติดไฟพร้อมกันจากความร้อนสะสม (ไม่มีใครรอดในห้องได้) → ต้องดับ/จำกัดไฟก่อนถึงจุดนี้</text>
<text x="56.0" y="448.0" font-size="12" text-anchor="start" fill="#0f172a">Backdraught — ห้องปิดที่ไฟขาดออกซิเจน มีก๊าซร้อนสะสม เมื่อเปิดประตูอากาศเข้า → ระเบิดเป็นลูกไฟ: ตรวจความร้อนประตู เปิดอย่างระมัดระวัง</text>
<text x="56.0" y="472.0" font-size="12" text-anchor="start" fill="#0f172a">ควันและก๊าซพิษ (CO, HCN ฯลฯ) ฆ่าคนมากกว่าเปลวไฟ — ใช้ SCBA, หมอบต่ำ, ปิดประตูกันควันลาม, EEBD สำหรับหนีออก</text>
</svg>
