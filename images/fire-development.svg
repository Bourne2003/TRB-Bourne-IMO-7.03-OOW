<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="510" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การถ่ายเทความร้อนและพัฒนาการของไฟในห้อง (Fire development)</text>
<text x="230.0" y="66.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">การถ่ายเทความร้อน 3 แบบ</text>
<rect x="40.0" y="90.0" width="380.0" height="68.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="56.0" y="114.0" font-size="14" text-anchor="start" fill="#9a3412" font-weight="bold">Conduction</text>
<text x="56.0" y="134.0" font-size="11.5" text-anchor="start" fill="#0f172a">ผ่านเนื้อโลหะ — ผนังเหล็ก/ท่อ ทำให้ไฟลาม</text>
<text x="56.0" y="150.0" font-size="11.5" text-anchor="start" fill="#0f172a">ไปห้องข้างเคียง (ต้อง boundary cooling)</text>
<rect x="40.0" y="170.0" width="380.0" height="68.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="56.0" y="194.0" font-size="14" text-anchor="start" fill="#9a3412" font-weight="bold">Convection</text>
<text x="56.0" y="214.0" font-size="11.5" text-anchor="start" fill="#0f172a">อากาศร้อน/ควันลอยขึ้น — ผ่านช่องบันได</text>
<text x="56.0" y="230.0" font-size="11.5" text-anchor="start" fill="#0f172a">ท่อระบายอากาศ ลามขึ้นชั้นบน</text>
<rect x="40.0" y="250.0" width="380.0" height="68.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="56.0" y="274.0" font-size="14" text-anchor="start" fill="#9a3412" font-weight="bold">Radiation</text>
<text x="56.0" y="294.0" font-size="11.5" text-anchor="start" fill="#0f172a">รังสีความร้อนแผ่ไปทุกทิศ — จุดไฟวัตถุ</text>
<text x="56.0" y="310.0" font-size="11.5" text-anchor="start" fill="#0f172a">ที่อยู่ใกล้โดยไม่ต้องสัมผัส</text>
<line x1="500.0" y1="350.0" x2="950.0" y2="350.0" stroke="#0f172a" stroke-width="1.5"/>
<line x1="500.0" y1="90.0" x2="500.0" y2="350.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="725.0" y="380.0" font-size="12" text-anchor="middle" fill="#0f172a">เวลา</text>
