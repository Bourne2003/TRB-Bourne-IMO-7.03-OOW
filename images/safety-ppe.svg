<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">อุปกรณ์ป้องกันส่วนบุคคล (PPE) — เลือกตามงานและการประเมินความเสี่ยง</text>
<circle cx="250" cy="105" r="30" fill="#fde68a" stroke="#0f172a" stroke-width="2"/><path d="M 216 92 Q 250 52 284 92 L 290 96 L 210 96 Z" fill="#facc15" stroke="#0f172a" stroke-width="2"/><rect x="205.0" y="138.0" width="90.0" height="150.0" rx="10" fill="#f97316" stroke="#0f172a" stroke-width="2"/>
<rect x="180.0" y="145.0" width="25.0" height="120.0" rx="8" fill="#f97316" stroke="#0f172a" stroke-width="2"/>
<rect x="295.0" y="145.0" width="25.0" height="120.0" rx="8" fill="#f97316" stroke="#0f172a" stroke-width="2"/>
<rect x="175.0" y="262.0" width="34.0" height="26.0" rx="0" fill="#1f2937" stroke="#0f172a" stroke-width="1"/>
<rect x="291.0" y="262.0" width="34.0" height="26.0" rx="0" fill="#1f2937" stroke="#0f172a" stroke-width="1"/>
<rect x="208.0" y="288.0" width="38.0" height="140.0" rx="6" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
<rect x="254.0" y="288.0" width="38.0" height="140.0" rx="6" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
<rect x="202.0" y="425.0" width="46.0" height="26.0" rx="4" fill="#111827" stroke="#0f172a" stroke-width="1"/>
<rect x="252.0" y="425.0" width="46.0" height="26.0" rx="4" fill="#111827" stroke="#0f172a" stroke-width="1"/>
<rect x="224.0" y="100.0" width="52.0" height="12.0" rx="4" fill="#bae6fd" stroke="#0f172a" stroke-width="1"/>
<path d="M 220 95 q -12 10 0 22" fill="none" stroke="#0f172a" stroke-width="5"/><path d="M 280 95 q 12 10 0 22" fill="none" stroke="#0f172a" stroke-width="5"/><line x1="272.0" y1="84.0" x2="384.0" y2="66.0" stroke="#64748b" stroke-width="1"/>
<text x="390.0" y="70.0" font-size="12.5" text-anchor="start" fill="#0f172a">หมวกนิรภัย (safety helmet) + สายรัดคาง</text>
<line x1="280.0" y1="106.0" x2="384.0" y2="96.0" stroke="#64748b" stroke-width="1"/>
<text x="390.0" y="100.0" font-size="12.5" text-anchor="start" fill="#0f172a">แว่นตา/หน้ากากกันสะเก็ด (eye/face protection)</text>
<line x1="284.0" y1="115.0" x2="384.0" y2="126.0" stroke="#64748b" stroke-width="1"/>
<text x="390.0" y="130.0" font-size="12.5" text-anchor="start" fill="#0f172a">ที่ครอบหู/ที่อุดหู (hearing protection)</text>
<line x1="295.0" y1="180.0" x2="384.0" y2="176.0" stroke="#64748b" stroke-width="1"/>
<text x="390.0" y="180.0" font-size="12.5" text-anchor="start" fill="#0f172a">ชุดหมี (coverall) — ไม่หลวมจนติดเครื่องจักร</text>
<line x1="308.0" y1="270.0" x2="384.0" y2="256.0" stroke="#64748b" stroke-width="1"/>
<text x="390.0" y="260.0" font-size="12.5" text-anchor="start" fill="#0f172a">ถุงมือตามงาน (สารเคมี ความร้อน ตัด เชือก)</text>
<line x1="292.0" y1="440.0" x2="384.0" y2="436.0" stroke="#64748b" stroke-width="1"/>
<text x="390.0" y="440.0" font-size="12.5" text-anchor="start" fill="#0f172a">รองเท้านิรภัยหัวเหล็ก กันลื่น</text>
<rect x="390.0" y="290.0" width="580.0" height="120.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="404.0" y="316.0" font-size="11.8" text-anchor="start" fill="#0f172a">PPE เฉพาะงาน: สายกันตก (harness) เมื่อทำงานบนที่สูง/นอกกราบ · lifejacket/work vest เมื่อทำงานนอกกราบ</text>
<text x="404.0" y="342.0" font-size="11.8" text-anchor="start" fill="#0f172a">หรือในเรือเล็ก · หน้ากากกรองฝุ่น/สารเคมี · ชุดเชื่อม/หน้ากากเชื่อม · ชุดกันสารเคมี · เครื่องวัดก๊าซส่วนบุคคล</text>
<text x="404.0" y="368.0" font-size="11.8" text-anchor="start" fill="#0f172a">PPE คือแนวป้องกันสุดท้าย (หลังการขจัด/ควบคุมทางวิศวกรรม/ขั้นตอน) — ต้องพอดี ตรวจสภาพก่อนใช้</text>
<text x="404.0" y="394.0" font-size="11.8" text-anchor="start" fill="#0f172a">ฝึกการใช้ เก็บรักษาถูกต้อง เปลี่ยนเมื่อเสื่อม · ผู้นำต้องใส่เป็นตัวอย่าง</text>
</svg>
