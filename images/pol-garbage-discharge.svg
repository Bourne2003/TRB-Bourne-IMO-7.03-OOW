<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="600" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">MARPOL Annex V: การทิ้งขยะลงทะเล (สรุประยะห่างจากฝั่งที่ใกล้ที่สุด)</text>
<rect x="470.0" y="70.0" width="50.0" height="34.0" rx="0" fill="#fecaca" stroke="#94a3b8" stroke-width="1"/>
<rect x="520.0" y="70.0" width="100.0" height="34.0" rx="0" fill="#fde68a" stroke="#94a3b8" stroke-width="1"/>
<rect x="620.0" y="70.0" width="340.0" height="34.0" rx="0" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1"/>
<line x1="470.0" y1="104.0" x2="470.0" y2="114.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="470.0" y="128.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">0 nm</text>
<line x1="520.0" y1="104.0" x2="520.0" y2="114.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="520.0" y="128.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">3 nm</text>
<line x1="620.0" y1="104.0" x2="620.0" y2="114.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="620.0" y="128.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">12 nm</text>
<line x1="810.0" y1="104.0" x2="810.0" y2="114.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="810.0" y="128.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">100 nm</text>
<text x="960.0" y="128.0" font-size="12" text-anchor="end" fill="#0f172a" font-weight="bold">ทะเลเปิด →</text>
<text x="460.0" y="92.0" font-size="12" text-anchor="end" fill="#0f172a" font-weight="bold">ระยะจากฝั่งที่ใกล้ที่สุด (ไม่ตามมาตราส่วน)</text>
<text x="40.0" y="150.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">พลาสติกทุกชนิด (รวมเชือก อวน ถุง ขี้เถ้าพลาสติก)</text>
<rect x="470.0" y="134.0" width="490.0" height="24.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="952.0" y="151.0" font-size="11.5" text-anchor="end" fill="#b91c1c" font-weight="bold">ห้ามทุกที่</text>
<text x="40.0" y="194.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">เศษอาหาร บดหรือย่อย ≤ 25 mm</text>
<rect x="520.0" y="178.0" width="440.0" height="24.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
<text x="952.0" y="195.0" font-size="11.5" text-anchor="end" fill="#15803d" font-weight="bold">&gt; 3 nm (special area &gt; 12 nm)</text>
<text x="40.0" y="238.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">เศษอาหาร ไม่บด</text>
<rect x="620.0" y="222.0" width="340.0" height="24.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
<text x="952.0" y="239.0" font-size="11.5" text-anchor="end" fill="#15803d" font-weight="bold">&gt; 12 nm (ห้ามใน special area)</text>
<text x="40.0" y="282.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">กากสินค้า (ไม่ใช่ HME) ที่เก็บด้วยวิธีปกติไม่ได้</text>
<rect x="620.0" y="266.0" width="340.0" height="24.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
<text x="952.0" y="283.0" font-size="11.5" text-anchor="end" fill="#15803d" font-weight="bold">&gt; 12 nm (special area เงื่อนไขเข้มกว่า)</text>
<text x="40.0" y="326.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">สารทำความสะอาดในน้ำล้างระวาง (ไม่เป็น HME)</text>
<rect x="620.0" y="310.0" width="340.0" height="24.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
<text x="952.0" y="327.0" font-size="11.5" text-anchor="end" fill="#15803d" font-weight="bold">ตามเงื่อนไขกากสินค้าในน้ำล้าง (น้ำล้างดาดฟ้า: ได้)</text>
<text x="40.0" y="370.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">ซากสัตว์ (animal carcasses)</text>
<rect x="810.0" y="354.0" width="150.0" height="24.0" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="1"/>
<text x="802.0" y="371.0" font-size="11.5" text-anchor="end" fill="#a16207" font-weight="bold">&gt; 100 nm ในน้ำลึกที่สุด (ห้ามใน special area)</text>
<text x="40.0" y="414.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">ขยะครัวเรือน ขี้เถ้าเตาเผา น้ำมันทำอาหาร ขยะปฏิบัติการ</text>
<rect x="470.0" y="398.0" width="490.0" height="24.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="952.0" y="415.0" font-size="11.5" text-anchor="end" fill="#b91c1c" font-weight="bold">ห้ามทิ้ง → ส่งท่า/เผา (ตามข้อกำหนด)</text>
<text x="40.0" y="458.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">ขยะอิเล็กทรอนิกส์ (E-waste), เครื่องมือประมง</text>
<rect x="470.0" y="442.0" width="490.0" height="24.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="952.0" y="459.0" font-size="11.5" text-anchor="end" fill="#b91c1c" font-weight="bold">ห้ามทิ้ง (เว้นกรณีฉุกเฉิน/ข้อยกเว้นที่กำหนด)</text>
<rect x="40.0" y="490.0" width="920.0" height="95.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="56.0" y="514.0" font-size="11.8" text-anchor="start" fill="#0f172a">Special areas (Annex V): Mediterranean, Baltic, Black Sea, Red Sea, Gulfs area, North Sea, Antarctic area, Wider Caribbean region</text>
<text x="56.0" y="534.0" font-size="11.8" text-anchor="start" fill="#0f172a">ข้อยกเว้น: ความปลอดภัยของเรือ/ชีวิต, ความเสียหายของเรือ/อุปกรณ์ (มีมาตรการป้องกันแล้ว), การสูญหายของเครื่องมือประมงโดยอุบัติเหตุ</text>
<text x="56.0" y="554.0" font-size="11.8" text-anchor="start" fill="#0f172a">แถบสีในภาพแสดงบริเวณที่อนุญาต (เมื่อเรือกำลังเดินทาง) — รายละเอียดเงื่อนไขดู MARPOL Annex V และ 2017 Guidelines (MEPC.295(71))</text>
<text x="56.0" y="574.0" font-size="11.8" text-anchor="start" fill="#0f172a">ทุกการทิ้ง/ส่งท่า/เผา ต้องบันทึกใน Garbage Record Book: วันที่ เวลา ตำแหน่ง ประเภท (A–K) ปริมาณ (m³) วิธี</text>
</svg>
