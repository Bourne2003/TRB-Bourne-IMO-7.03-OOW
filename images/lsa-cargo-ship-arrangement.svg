<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การจัดอุปกรณ์ช่วยชีวิตบนเรือสินค้า (ตัวอย่างมองจากด้านบน — ภาพแนวคิด)</text>
<path d="M 80 160 L 820 160 Q 930 160 960 260 Q 930 360 820 360 L 80 360 Q 50 360 50 330 L 50 190 Q 50 160 80 160 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.5"/><rect x="70.0" y="200.0" width="150.0" height="120.0" rx="0" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<text x="145.0" y="265.0" font-size="12" text-anchor="middle" fill="#334155" font-weight="bold">ที่พัก/สะพาน</text>
<ellipse cx="160" cy="150" rx="55" ry="14" fill="#f97316" stroke="#7c2d12" stroke-width="2"/><ellipse cx="160" cy="350" rx="55" ry="14" fill="#f97316" stroke="#7c2d12" stroke-width="2"/><text x="160.0" y="128.0" font-size="11.5" text-anchor="middle" fill="#7c2d12" font-weight="bold">เรือชูชีพปิดมิดชิด 100% (กราบซ้าย)</text>
<text x="160.0" y="384.0" font-size="11.5" text-anchor="middle" fill="#7c2d12" font-weight="bold">เรือชูชีพปิดมิดชิด 100% (กราบขวา)</text>
<ellipse cx="280" cy="168" rx="18" ry="10" fill="#fde68a" stroke="#92400e" stroke-width="2"/><ellipse cx="280" cy="352" rx="18" ry="10" fill="#fde68a" stroke="#92400e" stroke-width="2"/><ellipse cx="900" cy="220" rx="18" ry="10" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="310.0" y="128.0" font-size="11.5" text-anchor="start" fill="#92400e" font-weight="bold">แพชูชีพ (รวม 100% ย้ายข้างได้</text>
<text x="310.0" y="143.0" font-size="11.5" text-anchor="start" fill="#92400e" font-weight="bold">หรือ 100% ทั้งสองข้าง)</text>
<line x1="900.0" y1="208.0" x2="900.0" y2="150.0" stroke="#92400e" stroke-width="1.2"/>
<text x="900.0" y="128.0" font-size="11" text-anchor="middle" fill="#92400e" font-weight="bold">แพหัวเรือ (forward liferaft)</text>
<text x="900.0" y="143.0" font-size="9.5" text-anchor="middle" fill="#92400e">ถ้า survival craft ห่างหัวเรือ > 100 m</text>
<ellipse cx="320" cy="352" rx="28" ry="9" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/><text x="330.0" y="384.0" font-size="11.5" text-anchor="start" fill="#7f1d1d" font-weight="bold">Rescue boat</text>
<circle cx="240" cy="165" r="8" fill="none" stroke="#dc2626" stroke-width="4"/><circle cx="240" cy="355" r="8" fill="none" stroke="#dc2626" stroke-width="4"/><circle cx="500" cy="165" r="8" fill="none" stroke="#dc2626" stroke-width="4"/><circle cx="500" cy="355" r="8" fill="none" stroke="#dc2626" stroke-width="4"/><circle cx="760" cy="165" r="8" fill="none" stroke="#dc2626" stroke-width="4"/><circle cx="760" cy="355" r="8" fill="none" stroke="#dc2626" stroke-width="4"/><circle cx="60" cy="175" r="8" fill="none" stroke="#dc2626" stroke-width="4"/><circle cx="60" cy="345" r="8" fill="none" stroke="#dc2626" stroke-width="4"/><rect x="200.0" y="196.0" width="18.0" height="18.0" rx="0" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
<text x="209.0" y="209.0" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">E</text>
<rect x="200.0" y="300.0" width="18.0" height="18.0" rx="0" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="209.0" y="313.0" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">S</text>
<text x="500.0" y="260.0" font-size="14" text-anchor="middle" fill="#94a3b8" font-weight="bold">ระวางสินค้า</text>
<rect x="40.0" y="400.0" width="18.0" height="18.0" rx="0" fill="#f97316" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="414.0" font-size="12" text-anchor="start" fill="#0f172a">Lifeboats — ปิดมิดชิด แต่ละกราบจุ 100% (หรือ free-fall ท้ายเรือ 100%)</text>
<rect x="40.0" y="425.0" width="18.0" height="18.0" rx="0" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="439.0" font-size="12" text-anchor="start" fill="#0f172a">Liferafts — จุรวม 100% ย้ายข้างได้ง่าย (หรือ 100% แต่ละข้าง) + แพหัวเรือเมื่อ survival craft ห่างหัว/ท้ายเกิน 100 m</text>
<rect x="40.0" y="450.0" width="18.0" height="18.0" rx="0" fill="#ef4444" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="464.0" font-size="12" text-anchor="start" fill="#0f172a">Rescue boat อย่างน้อย 1 ลำ (เรือชูชีพอาจใช้แทนได้ถ้าเป็นไปตามข้อกำหนด)</text>
<rect x="40.0" y="475.0" width="18.0" height="18.0" rx="0" fill="#22c55e" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="489.0" font-size="12" text-anchor="start" fill="#0f172a">E = EPIRB 406 MHz แบบลอยปล่อยอิสระ (float-free) · S = SART/AIS-SART อย่างน้อย 1 ต่อกราบ (≥ 500 GT; SOLAS IV/7 ตั้งแต่ 2024)</text>
<rect x="40.0" y="500.0" width="18.0" height="18.0" rx="0" fill="#fecaca" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="514.0" font-size="12" text-anchor="start" fill="#0f172a">วงกลมแดง = ห่วงชูชีพ (lifebuoys) กระจายสองกราบ — บางลูกมีไฟ ควัน หรือเชือก (ตามจำนวนที่กำหนดตามความยาวเรือ)</text>
<rect x="40.0" y="525.0" width="18.0" height="18.0" rx="0" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="539.0" font-size="12" text-anchor="start" fill="#0f172a">Immersion suit สำหรับทุกคน · lifejacket ทุกคน + สำรอง · VHF พกพา (≥ 3 เครื่อง) · line-throwing appliance · พลุ 12 นัดบนสะพาน</text>
</svg>
