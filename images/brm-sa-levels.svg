<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="400" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Situational Awareness 3 ระดับ (Endsley) ในบริบทสะพานเดินเรือ</text>
<rect x="40" y="90" width="280" height="160" rx="12" fill="#bfdbfe" stroke="#1e3a8a"/>
<text x="180" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">ระดับ 1 Perception</text>
<text x="180" y="170" text-anchor="middle" font-size="13">รับรู้: เห็นไฟแดงทางขวา ระยะ 3'</text><text x="180" y="196" text-anchor="middle" font-size="13">เรดาร์ CPA 0.2' · ลมแรงขึ้น</text>
<path d="M 322 170 L 358 170" stroke="#0f172a" stroke-width="3" marker-end="url(#ar)"/>
<rect x="360" y="90" width="280" height="160" rx="12" fill="#93c5fd" stroke="#1e3a8a"/>
<text x="500" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">ระดับ 2 Comprehension</text>
<text x="500" y="170" text-anchor="middle" font-size="13">เข้าใจ: เรือกลตัดหน้า</text><text x="500" y="196" text-anchor="middle" font-size="13">เราเป็น give-way · ความเสี่ยงสูง</text>
<path d="M 642 170 L 678 170" stroke="#0f172a" stroke-width="3" marker-end="url(#ar)"/>
<rect x="680" y="90" width="280" height="160" rx="12" fill="#60a5fa" stroke="#1e3a8a"/>
<text x="820" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">ระดับ 3 Projection</text>
<text x="820" y="170" text-anchor="middle" font-size="13">คาดการณ์: 10 นาทีข้างหน้า</text><text x="820" y="196" text-anchor="middle" font-size="13">ถ้าหันขวา 40° จะใกล้เรือประมง?</text>
<path d="M 880 255 Q 520 330 180 255" fill="none" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="400" y="320" font-size="13" fill="#15803d" font-weight="bold">ตัดสินใจ → ทำ → ตรวจผล → รับรู้ใหม่ (วงจรต่อเนื่อง)</text>
<text x="40" y="365" font-size="13" fill="#b91c1c">สัญญาณ SA หลุด: ความคลุมเครือ จดจ่อสิ่งเดียว สับสน ไม่ทำตามแผน/ขั้นตอน ข้อมูลขัดแย้งไม่ได้แก้ ไม่มีใครขับเรือ (no one conning) สื่อสารไม่ชัด</text>
</svg>
