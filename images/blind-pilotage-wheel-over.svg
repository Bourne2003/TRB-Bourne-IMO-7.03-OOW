<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arg" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4ade80"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">วางแผน PI และจุด wheel-over (ตัวอย่างจำลอง: ขา 045° → 090°)</text>
<rect x="20" y="50" width="590" height="420" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="315" y="72" text-anchor="middle" font-size="14" font-weight="bold">บนแผนที่/ECDIS (ทิศเหนือขึ้น)</text>
<path d="M 99.0 381.0 L 330.0 150.0 L 583.0 150.0" fill="none" stroke="#0f172a" stroke-width="2.5"/>
<text x="184.8" y="282.0" font-size="13" font-weight="bold" text-anchor="end">045°T</text><text x="506.0" y="136.8" font-size="13" font-weight="bold">090°T</text>
<circle cx="330.0" cy="150.0" r="4" fill="#0f172a"/><text x="322.0" y="140.0" font-size="13" text-anchor="end" font-weight="bold">WP B</text>
<path d="M 405.2 344.7 L 413.2 362.7 L 397.2 362.7 Z" fill="#f59e0b" stroke="#0f172a"/><text x="417.2" y="374.7" font-size="13" font-weight="bold">ประภาคาร L</text>
<text x="417.2" y="390.7" font-size="11">160°T 2.0' จาก B</text>
<line x1="264.3" y1="215.7" x2="405.2" y2="356.7" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="326.8" y="286.2" font-size="12" fill="#b45309" font-weight="bold" text-anchor="end">CIR 1.81'</text>
<line x1="405.2" y1="150.0" x2="405.2" y2="356.7" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="413.2" y="253.4" font-size="12" fill="#0369a1" font-weight="bold" text-anchor="start">CIR 1.88'</text>
<circle cx="291.1" cy="188.9" r="6" fill="#dc2626"/><text x="281.1" y="182.9" font-size="12" fill="#dc2626" font-weight="bold" text-anchor="end">WOP (0.5' ก่อน B)</text>
<circle cx="264.3" cy="215.7" r="4" fill="#b45309"/><text x="254.3" y="219.7" font-size="11" fill="#b45309" text-anchor="end">L ตรงกราบ (0.85' ก่อน B)</text>
<text x="36" y="440" font-size="12">ระหว่างจุดตรงกราบกับ WOP = 0.85 − 0.50 = 0.35' → ที่ WOP เป้าอยู่ท้ายแนวกราบ 0.35'</text>
<text x="36" y="458" font-size="12">มาตราส่วนในภาพ: 1 ไมล์ ≈ 110 px (ภาพประกอบ ไม่ใช่แผนที่จริง)</text>
<text x="805" y="72" text-anchor="middle" font-size="14" font-weight="bold">จอเรดาร์ขณะถึง WOP (RM, north-up)</text>
<circle cx="805" cy="290" r="175" fill="#052e16" stroke="#334155" stroke-width="4"/>
<circle cx="805" cy="290" r="60" fill="none" stroke="#166534" stroke-dasharray="3 4"/>
<circle cx="805" cy="290" r="120" fill="none" stroke="#166534" stroke-dasharray="3 4"/>
<line x1="805" y1="290" x2="928.7" y2="166.3" stroke="#bbf7d0" stroke-width="2"/>
<line x1="949.8" y1="299.0" x2="839.5" y2="409.3" stroke="#facc15" stroke-width="2.5"/>
<text x="941.8" y="303.0" font-size="12" fill="#facc15" text-anchor="end">PI 1.81'</text>
<line x1="805" y1="290" x2="881.9" y2="366.9" stroke="#94a3b8" stroke-dasharray="3 3"/>
<line x1="860.0" y1="374.7" x2="874.1" y2="388.8" stroke="#f87171" stroke-width="3"/>
<circle cx="867.1" cy="381.8" r="6" fill="#4ade80"/>
<text x="851.1" y="385.8" font-size="12" fill="#f87171" text-anchor="end">WO (ท้ายกราบ 0.35')</text>
<line x1="677.2" y1="402.8" x2="932.8" y2="402.8" stroke="#fde68a" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="687.2" y="418.8" font-size="11" fill="#fde68a">PI ขาใหม่ 090° = 1.88'</text>
<circle cx="805" cy="290" r="4" fill="#fff"/>
<text x="805" y="487" text-anchor="middle" font-size="12">เช็คซ้ำ: เป้าระยะ 1.85' แบริ่ง 146°T (VRM + EBL)</text>
<text x="20" y="500" font-size="13">CIR = 2.0 × sin(160° − 045°) = 1.81' · จุดตรงกราบ = 2.0 × |cos 115°| = 0.85' ก่อน B · CIR ขาใหม่ = 2.0 × sin(160° − 090°) = 1.88'</text>
<text x="20" y="522" font-size="13">เมื่อเป้าเลื่อนตามเส้น PI มาถึงขีด WO ให้สั่งหางเสือ แล้วย้ายไปดูเส้น PI ขาใหม่ (เป้าควรเข้ามาอยู่บนเส้น 1.88' หลังเลี้ยวเสร็จ)</text>
<text x="20" y="544" font-size="12" fill="#64748b">วงระยะบนจอ 1' และ 2' · เส้นสีเทา = แนวกราบขวา (beam)</text>
</svg>
