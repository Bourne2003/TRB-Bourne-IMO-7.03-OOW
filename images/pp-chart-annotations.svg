<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <rect width="900" height="600" fill="#eef6fb"/>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fde2e2"/><line x1="0" y1="0" x2="0" y2="10" stroke="#dc2626" stroke-width="3"/>
    </pattern>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#b91c1c"/></marker>
  </defs>
  <!-- land -->
  <path d="M 0 0 L 900 0 L 900 70 Q 780 90 700 140 Q 640 180 600 170 Q 560 160 520 200 Q 470 250 400 230 Q 330 210 280 160 Q 220 110 140 120 Q 70 130 0 110 z" fill="#f5deb3" stroke="#8b6b3d" stroke-width="2"/>
  <text x="120" y="60" font-size="16" fill="#6b4f2a">แผ่นดิน (ตัวอย่างจำลอง)</text>
  <!-- headland lighthouse -->
  <circle cx="520" cy="200" r="7" fill="#a21caf"/>
  <path d="M 520 200 L 535 186" stroke="#a21caf" stroke-width="2"/>
  <text x="540" y="196" font-size="13" fill="#701a75">ประภาคาร A (Fl.10s)</text>
  <!-- island -->
  <path d="M 650 420 Q 690 395 730 415 Q 760 440 735 470 Q 700 490 665 470 Q 635 448 650 420 z" fill="#f5deb3" stroke="#8b6b3d" stroke-width="2"/>
  <text x="664" y="448" font-size="12" fill="#6b4f2a">เกาะ B</text>
  <!-- no-go areas -->
  <path d="M 300 175 Q 360 230 430 245 Q 470 255 500 225 L 505 260 Q 440 300 360 280 Q 300 260 270 200 z" fill="url(#hatch)" stroke="#dc2626" stroke-width="2"/>
  <path d="M 600 380 Q 640 360 700 370 Q 780 390 790 450 Q 795 510 720 520 Q 640 520 610 470 Q 590 420 600 380 z" fill="url(#hatch)" stroke="#dc2626" stroke-width="2" opacity="0.85"/>
  <text x="315" y="300" font-size="13" fill="#b91c1c" font-weight="bold">NO-GO (&lt; 11.5 m)</text>
  <text x="625" y="540" font-size="13" fill="#b91c1c" font-weight="bold">NO-GO</text>
  <!-- track -->
  <polyline points="60,330 430,360 560,330 900,232.5" fill="none" stroke="#111827" stroke-width="3"/>
  <circle cx="430" cy="360" r="6" fill="#fff" stroke="#111827" stroke-width="2"/>
  <circle cx="560" cy="330" r="6" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="418" y="385" font-size="13" fill="#111827">WP2</text>
  <text x="540" y="300" font-size="13" fill="#111827">WP3</text>
  <text x="468" y="345" font-size="11" fill="#111827" font-weight="bold" transform="rotate(-13 468 345)">077°T 1.9'</text>
  <text x="150" y="328" font-size="14" fill="#111827" font-weight="bold" transform="rotate(4.6 150 328)">095°T  12.4'</text>
  <text x="660" y="282" font-size="14" fill="#111827" font-weight="bold" transform="rotate(-16 660 282)">074°T  8.6'</text>
  <!-- XTL corridor -->
  <polyline points="60,310 430,340 560,310 900,212.5" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <polyline points="60,350 430,380 560,350 900,252.5" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="370" font-size="12" fill="#1d4ed8">XTL ± 0.3'</text>
  <!-- wheel over -->
  <!-- WOP = R·tan(Δ/2) ก่อน WP2: Δ = 095°→077° = 18°, R ≈ 1.0' → 0.16' (≈11 px ที่มาตราส่วน 1' ≈ 69 px) -->
  <line x1="420.6" y1="344.1" x2="418.2" y2="374.1" stroke="#ea580c" stroke-width="3"/>
  <text x="330" y="410" font-size="12" fill="#c2410c" font-weight="bold">WOP: Lt A 2.7' (VRM)</text>
  <!-- parallel index -->
  <!-- PI line ขนานกับเส้นทาง 095°T ผ่านปลายแหลม (headland) ที่ห่างเส้นทาง 1.8' -->
  <line x1="60" y1="205.8" x2="445" y2="237" stroke="#16a34a" stroke-width="2" stroke-dasharray="2 4"/>
  <circle cx="445" cy="236.5" r="3.5" fill="#15803d"/>
  <text x="40" y="197" font-size="12" fill="#15803d" font-weight="bold">PI line: Headland 1.8' N of track</text>
  <!-- clearing bearing to Lt C on islet -->
  <circle cx="872" cy="320" r="12" fill="#f5deb3" stroke="#8b6b3d" stroke-width="2"/>
  <circle cx="872" cy="320" r="5" fill="#a21caf"/>
  <text x="822" y="302" font-size="12" fill="#701a75">Lt C (Q)</text>
  <line x1="560" y1="352.8" x2="858.1" y2="321.5" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="640" y="337" font-size="12" fill="#b91c1c" font-weight="bold" transform="rotate(-6 640 337)">Clearing brg: Lt C NLT 084°</text>
  <text x="700" y="358" font-size="11" fill="#b91c1c">↓ ด้านอันตราย (&lt; 084°)</text>
  <!-- abort point -->
  <rect x="226" y="333" width="14" height="14" fill="#facc15" stroke="#854d0e" stroke-width="2"/>
  <text x="190" y="290" font-size="12" fill="#854d0e" font-weight="bold">ABORT POINT</text>
  <line x1="233" y1="296" x2="233" y2="332" stroke="#854d0e"/>
  <!-- anchorage -->
  <g transform="translate(110,470)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#7c3aed" stroke-dasharray="5 4" stroke-width="2"/>
    <text x="-11" y="8" font-size="22" fill="#7c3aed">⚓</text>
    <text x="-70" y="58" font-size="12" fill="#6d28d9">Contingency anchorage</text>
  </g>
  <!-- scale bar (มาตราส่วนโดยประมาณของภาพ) -->
  <line x1="760" y1="585" x2="829" y2="585" stroke="#0f172a" stroke-width="3"/>
  <line x1="760" y1="579" x2="760" y2="591" stroke="#0f172a" stroke-width="2"/><line x1="829" y1="579" x2="829" y2="591" stroke="#0f172a" stroke-width="2"/>
  <text x="760" y="574" font-size="11" fill="#0f172a">≈ 1 ไมล์ทะเล</text>
  <!-- legend -->
  <rect x="610" y="20" width="275" height="128" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="622" y="42" font-size="13" font-weight="bold" fill="#0f172a">คำอธิบายสัญลักษณ์</text>
  <line x1="622" y1="58" x2="660" y2="58" stroke="#111827" stroke-width="3"/><text x="668" y="62" font-size="12">เส้นทาง + เข็ม/ระยะ</text>
  <line x1="622" y1="78" x2="660" y2="78" stroke="#2563eb" stroke-dasharray="6 5"/><text x="668" y="82" font-size="12">Cross track limit</text>
  <line x1="622" y1="98" x2="660" y2="98" stroke="#ea580c" stroke-width="3"/><text x="668" y="102" font-size="12">Wheel-over point</text>
  <line x1="622" y1="118" x2="660" y2="118" stroke="#16a34a" stroke-dasharray="2 4" stroke-width="2"/><text x="668" y="122" font-size="12">Parallel index</text>
  <rect x="628" y="130" width="22" height="12" fill="url(#hatch)"/><text x="668" y="141" font-size="12">No-go area</text>
</svg>
