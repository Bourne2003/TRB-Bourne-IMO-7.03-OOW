<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="610" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ภาวะตัวเย็นเกิน (Hypothermia) กับ ภาวะลมแดด (Heat stroke) — เปรียบเทียบ</text>
<rect x="30.0" y="60.0" width="455.0" height="400.0" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="257.0" y="90.0" font-size="16" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Hypothermia (ตัวเย็นเกิน)</text>
<text x="48.0" y="122.0" font-size="12.3" text-anchor="start" fill="#0f172a">สาเหตุ: อยู่ในน้ำเย็น/ลมหนาว เปียก</text>
<text x="48.0" y="149.0" font-size="12.3" text-anchor="start" fill="#0f172a">อาการ: สั่น → หยุดสั่น พูดไม่ชัด สับสน</text>
<text x="48.0" y="176.0" font-size="12.3" text-anchor="start" fill="#0f172a">เดินเซ ง่วง ชีพจร/หายใจช้า → หมดสติ</text>
<text x="48.0" y="203.0" font-size="12.3" text-anchor="start" fill="#0f172a"></text>
<text x="48.0" y="230.0" font-size="12.3" text-anchor="start" fill="#1d4ed8" font-weight="bold">การดูแล</text>
<text x="48.0" y="257.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ย้ายสู่ที่อุ่น เคลื่อนย้ายเบา ๆ ในท่านอน</text>
<text x="48.0" y="284.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ถอดเสื้อผ้าเปียก ห่มผ้าแห้ง/TPA คลุมศีรษะ</text>
<text x="48.0" y="311.0" font-size="12.3" text-anchor="start" fill="#0f172a">• อุ่นค่อยเป็นค่อยไป (ห้องอุ่น ผ้าห่ม ถุงร้อนที่ลำตัว</text>
<text x="48.0" y="338.0" font-size="12.3" text-anchor="start" fill="#0f172a">  ห่อผ้า) — ห้ามถู/นวดแขนขา ห้ามแอลกอฮอล์</text>
<text x="48.0" y="365.0" font-size="12.3" text-anchor="start" fill="#0f172a">• รู้สึกตัวดี กลืนได้: เครื่องดื่มอุ่นหวาน</text>
<text x="48.0" y="392.0" font-size="12.3" text-anchor="start" fill="#0f172a">• หมดสติ: ตรวจหายใจนานขึ้น (≤ 1 นาที) ก่อน CPR</text>
<text x="48.0" y="419.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ปรึกษา TMAS</text>
<rect x="515.0" y="60.0" width="455.0" height="400.0" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="742.0" y="90.0" font-size="16" text-anchor="middle" fill="#b91c1c" font-weight="bold">Heat illness (ลมแดด/เพลียแดด)</text>
<text x="533.0" y="122.0" font-size="12.3" text-anchor="start" fill="#0f172a">สาเหตุ: ทำงานในที่ร้อน (ห้องเครื่อง ดาดฟ้า ระวาง)</text>
<text x="533.0" y="149.0" font-size="12.3" text-anchor="start" fill="#0f172a">Heat exhaustion: เหงื่อมาก อ่อนเพลีย ปวดหัว</text>
<text x="533.0" y="176.0" font-size="12.3" text-anchor="start" fill="#0f172a">คลื่นไส้ ตะคริว ผิวเย็นชื้น</text>
<text x="533.0" y="203.0" font-size="12.3" text-anchor="start" fill="#0f172a">Heat stroke (อันตรายถึงชีวิต): อุณหภูมิกายสูงมาก</text>
<text x="533.0" y="230.0" font-size="12.3" text-anchor="start" fill="#0f172a">ผิวร้อน (อาจแห้ง) สับสน ชัก หมดสติ</text>
<text x="533.0" y="257.0" font-size="12.3" text-anchor="start" fill="#0f172a"></text>
<text x="533.0" y="284.0" font-size="12.3" text-anchor="start" fill="#b91c1c" font-weight="bold">การดูแล</text>
<text x="533.0" y="311.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ย้ายสู่ที่เย็น ถอดเสื้อผ้าส่วนเกิน</text>
<text x="533.0" y="338.0" font-size="12.3" text-anchor="start" fill="#0f172a">• Heat stroke: ทำให้เย็นเร็วที่สุด — ราดน้ำเย็น พัดลม</text>
<text x="533.0" y="365.0" font-size="12.3" text-anchor="start" fill="#0f172a">  ประคบเย็นที่ขาหนีบ รักแร้ คอ</text>
<text x="533.0" y="392.0" font-size="12.3" text-anchor="start" fill="#0f172a">• รู้สึกตัวดี: ดื่มน้ำ/เกลือแร่ทีละน้อย</text>
<text x="533.0" y="419.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ป้องกัน: ดื่มน้ำ พัก หมุนเวียนงาน ระบายอากาศ</text>
<text x="500.0" y="486.0" font-size="12.5" text-anchor="middle" fill="#1e3a8a" font-weight="bold">ระดับความรุนแรงของ hypothermia ตามอุณหภูมิแกนกลาง (core) — ใช้ร่วมกับอาการ เพราะบนเรือมักวัดอุณหภูมิแกนกลางไม่ได้</text>
<rect x="30.0" y="500.0" width="229.0" height="64.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="144.0" y="524.0" font-size="13" text-anchor="middle" fill="#15803d" font-weight="bold">ปกติ ~37°C</text>
<text x="144.0" y="546.0" font-size="11.3" text-anchor="middle" fill="#0f172a">ผิวอุ่น รู้สึกตัวดี</text>
<rect x="267.0" y="500.0" width="229.0" height="64.0" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="381.0" y="524.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="bold">เล็กน้อย 35–32°C</text>
<text x="381.0" y="546.0" font-size="11.3" text-anchor="middle" fill="#0f172a">สั่นมาก รู้สึกตัว มือไม่คล่อง</text>
<rect x="504.0" y="500.0" width="229.0" height="64.0" rx="8" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/>
<text x="618.0" y="524.0" font-size="13" text-anchor="middle" fill="#1e40af" font-weight="bold">ปานกลาง 32–28°C</text>
<text x="618.0" y="546.0" font-size="11.3" text-anchor="middle" fill="#0f172a">สั่นลด/หยุด สับสน ง่วง</text>
<rect x="741.0" y="500.0" width="229.0" height="64.0" rx="8" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="855.0" y="524.0" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="bold">รุนแรง &lt; 28°C</text>
<text x="855.0" y="546.0" font-size="11.3" text-anchor="middle" fill="#0f172a">หมดสติ ชีพจรช้าเบา เสี่ยงหัวใจหยุดเต้น</text>
<text x="500.0" y="592.0" font-size="11.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">Heat stroke: อุณหภูมิแกนกลางมักสูงกว่า ~40°C ร่วมกับอาการทางสมอง (สับสน ชัก หมดสติ) — ทำให้เย็นทันทีแล้วปรึกษา TMAS</text>
</svg>
