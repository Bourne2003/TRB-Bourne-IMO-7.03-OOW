<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ระบบใบอนุญาตทำงาน (Permit to work) — งานที่มีความเสี่ยงสูง</text>
<rect x="25.0" y="70.0" width="148.0" height="90.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="99.0" y="108.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">ระบุงานและอันตราย</text>
<line x1="174.0" y1="115.0" x2="185.0" y2="115.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="187.0" y="70.0" width="148.0" height="90.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="261.0" y="99.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">ประเมินความเสี่ยง</text>
<text x="261.0" y="117.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">+ toolbox talk</text>
<line x1="336.0" y1="115.0" x2="347.0" y2="115.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="349.0" y="70.0" width="148.0" height="90.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="423.0" y="90.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">เตรียมการ:</text>
<text x="423.0" y="108.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">แยกระบบ (LOTO)</text>
<text x="423.0" y="126.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">ระบายอากาศ วัดก๊าซ</text>
<line x1="498.0" y1="115.0" x2="509.0" y2="115.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="511.0" y="70.0" width="148.0" height="90.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="585.0" y="90.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">ผู้มีอำนาจอนุมัติ</text>
<text x="585.0" y="108.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">ออก permit</text>
<text x="585.0" y="126.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">(เวลา/ขอบเขต)</text>
<line x1="660.0" y1="115.0" x2="671.0" y2="115.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="673.0" y="70.0" width="148.0" height="90.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="747.0" y="99.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">ทำงานตามเงื่อนไข</text>
<text x="747.0" y="117.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">เฝ้าดู/สื่อสาร</text>
<line x1="822.0" y1="115.0" x2="833.0" y2="115.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="835.0" y="70.0" width="148.0" height="90.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="909.0" y="90.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">เสร็จงาน:</text>
<text x="909.0" y="108.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">ตรวจพื้นที่ คืนระบบ</text>
<text x="909.0" y="126.0" font-size="11.3" text-anchor="middle" fill="#1e3a8a" font-weight="bold">ปิด permit</text>
<rect x="25.0" y="190.0" width="305.0" height="115.0" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
<text x="39.0" y="216.0" font-size="14" text-anchor="start" fill="#b91c1c" font-weight="bold">งานร้อน (Hot work)</text>
<text x="39.0" y="244.0" font-size="11" text-anchor="start" fill="#0f172a">เชื่อม ตัด เจียร นอกโรงงานซ่อม — ย้ายวัสดุติดไฟ</text>
<text x="39.0" y="264.0" font-size="11" text-anchor="start" fill="#0f172a">ตรวจก๊าซ fire watch ระหว่าง/หลังงาน ถังดับเพลิงพร้อม</text>
<rect x="345.0" y="190.0" width="305.0" height="115.0" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/>
<text x="359.0" y="216.0" font-size="14" text-anchor="start" fill="#c2410c" font-weight="bold">เข้าพื้นที่อับอากาศ</text>
<text x="359.0" y="244.0" font-size="11" text-anchor="start" fill="#0f172a">ระบายอากาศ ตรวจวัด O₂/ไวไฟ/พิษ คนเฝ้าทางเข้า</text>
<text x="359.0" y="264.0" font-size="11" text-anchor="start" fill="#0f172a">สื่อสาร อุปกรณ์กู้ภัยพร้อม (MSC.581(110))</text>
<rect x="665.0" y="190.0" width="305.0" height="115.0" rx="10" fill="#fff" stroke="#ca8a04" stroke-width="2"/>
<text x="679.0" y="216.0" font-size="14" text-anchor="start" fill="#ca8a04" font-weight="bold">งานบนที่สูง/นอกกราบ</text>
<text x="679.0" y="244.0" font-size="11" text-anchor="start" fill="#0f172a">สายกันตกยึดจุดแข็งแรง นั่งร้าน/ม้านั่ง (bosun chair)</text>
<text x="679.0" y="264.0" font-size="11" text-anchor="start" fill="#0f172a">lifejacket ห่วงชูชีพพร้อม ไม่ทำขณะเรือแล่น/คลื่นแรง</text>
<rect x="25.0" y="320.0" width="305.0" height="115.0" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
<text x="39.0" y="346.0" font-size="14" text-anchor="start" fill="#1d4ed8" font-weight="bold">งานไฟฟ้า/แยกระบบ</text>
<text x="39.0" y="374.0" font-size="11" text-anchor="start" fill="#0f172a">ตัดไฟ ล็อกและติดป้าย (LOTO) ตรวจว่าไม่มีไฟ</text>
<text x="39.0" y="394.0" font-size="11" text-anchor="start" fill="#0f172a">เฉพาะผู้มีความสามารถ (ETO)</text>
<rect x="345.0" y="320.0" width="305.0" height="115.0" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text x="359.0" y="346.0" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">งานระบบแรงดัน/ท่อ</text>
<text x="359.0" y="374.0" font-size="11" text-anchor="start" fill="#0f172a">ลดแรงดัน ระบายของเหลว ปิดวาล์วล็อก</text>
<text x="359.0" y="394.0" font-size="11" text-anchor="start" fill="#0f172a">ป้องกันการรั่ว (น้ำมัน ไอน้ำ สารเคมี)</text>
<rect x="665.0" y="320.0" width="305.0" height="115.0" rx="10" fill="#fff" stroke="#0369a1" stroke-width="2"/>
<text x="679.0" y="346.0" font-size="14" text-anchor="start" fill="#0369a1" font-weight="bold">งานใต้น้ำ/ดำน้ำ</text>
<text x="679.0" y="374.0" font-size="11" text-anchor="start" fill="#0f172a">ประสานห้องเครื่อง ล็อกใบจักร/หางเสือ/sea chest</text>
<text x="679.0" y="394.0" font-size="11" text-anchor="start" fill="#0f172a">ชักธง A แจ้งท่า/VTS</text>
<text x="500.0" y="460.0" font-size="12" text-anchor="middle" fill="#334155">Permit ไม่ใช่กระดาษ — เป็นกระบวนการคิดและควบคุม: ถ้าเงื่อนไขเปลี่ยน (เช่น alarm ดัง ก๊าซเปลี่ยน) หยุดงานและประเมินใหม่</text>
</svg>
