<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การสูญเสียแรงลอยตัวบางส่วน (Bilging) — วิธี lost buoyancy (เรือรูปกล่องตัวอย่าง)</text>
<rect x="80.0" y="120.0" width="520.0" height="180.0" rx="0" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<rect x="304.0" y="120.0" width="72.0" height="180.0" rx="0" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5"/>
<text x="340.0" y="112.0" font-size="12" text-anchor="middle" fill="#075985" font-weight="bold">ช่องที่น้ำเข้า l = 12 m</text>
<line x1="50.0" y1="200.0" x2="630.0" y2="200.0" stroke="#0284c7" stroke-width="2"/>
<text x="634.0" y="204.0" font-size="11.5" text-anchor="start" fill="#0284c7">WL เดิม 6.00 m</text>
<line x1="50.0" y1="173.0" x2="630.0" y2="173.0" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 4"/>
<text x="634.0" y="177.0" font-size="11.5" text-anchor="start" fill="#b91c1c" font-weight="bold">WL ใหม่ 6.82 m</text>
<line x1="65.0" y1="200.0" x2="65.0" y2="173.0" stroke="#b91c1c" stroke-width="2" marker-end="url(#arR)"/>
<text x="60.0" y="190.5" font-size="11" text-anchor="end" fill="#b91c1c" font-weight="bold">sinkage</text>
<path d="M 340 306 l 12 22 l -24 0 z" fill="#b91c1c"/><text x="358.0" y="324.0" font-size="11" text-anchor="start" fill="#b91c1c">รูรั่ว</text>
<text x="340.0" y="356.0" font-size="12" text-anchor="middle" fill="#334155">เรือรูปกล่อง L 100 m × B 15 m × T 6 m</text>
<rect x="40.0" y="380.0" width="920.0" height="80.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="56.0" y="404.0" font-size="12.3" text-anchor="start" fill="#0f172a" font-weight="bold">Sinkage = ปริมาตรแรงลอยตัวที่เสีย ÷ พื้นที่ระนาบน้ำที่เหลือ = (μ × l × B × T) ÷ (L × B − μ × l × B)</text>
<text x="56.0" y="426.0" font-size="12.3" text-anchor="start" fill="#0f172a">ช่องว่าง μ = 1.0 → 1,080 ÷ 1,320 = 0.82 m (draught 6.82 m)  ·  ช่องมีสินค้า μ = 0.6 → 648 ÷ 1,392 = 0.47 m</text>
<text x="56.0" y="448.0" font-size="12.3" text-anchor="start" fill="#0f172a">μ (permeability) = สัดส่วนปริมาตรที่น้ำเข้าได้ — ห้องว่าง/ที่พัก ~0.95, ห้องเครื่อง ~0.85, เก็บของ ~0.60 (ค่าตาม SOLAS ใช้ในการคำนวณออกแบบ)</text>
<rect x="745.0" y="60.0" width="230.0" height="300.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="759.0" y="86.0" font-size="12.3" text-anchor="start" fill="#7f1d1d" font-weight="bold">ผลที่ตามมา</text>
<text x="759.0" y="113.0" font-size="12.3" text-anchor="start" fill="#7f1d1d">• จม (sinkage) — freeboard ลด</text>
<text x="759.0" y="140.0" font-size="12.3" text-anchor="start" fill="#7f1d1d">• Trim ถ้าช่องไม่อยู่กลางลำ</text>
<text x="759.0" y="167.0" font-size="12.3" text-anchor="start" fill="#7f1d1d">• List ถ้าน้ำเข้าไม่สมมาตร</text>
<text x="759.0" y="194.0" font-size="12.3" text-anchor="start" fill="#7f1d1d">• GM เปลี่ยน (เพิ่มหรือลดได้)</text>
<text x="759.0" y="221.0" font-size="12.3" text-anchor="start" fill="#7f1d1d">• Free surface ของน้ำที่เข้า</text>
<text x="759.0" y="248.0" font-size="12.3" text-anchor="start" fill="#7f1d1d">  (ช่องไม่เต็มหรือไม่เปิดถึงทะเล)</text>
<text x="759.0" y="275.0" font-size="12.3" text-anchor="start" fill="#7f1d1d">• ช่องเปิดจมน้ำ → น้ำลาม</text>
<text x="759.0" y="302.0" font-size="12.3" text-anchor="start" fill="#7f1d1d">  (progressive flooding)</text>
<text x="759.0" y="329.0" font-size="12.3" text-anchor="start" fill="#7f1d1d">• ความแข็งแรงตามยาวเปลี่ยน</text>
</svg>
