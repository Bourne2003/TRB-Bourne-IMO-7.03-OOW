<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker><marker id="arY" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#facc15"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">แผนผังการทำงานของเรดาร์แบบพัลส์ (Pulse radar block diagram)</text>
<rect x="40" y="80" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="125.0" y="109.0" text-anchor="middle" font-size="14" font-weight="bold">Timebase / Trigger</text>
<text x="125.0" y="129.0" text-anchor="middle" font-size="11" fill="#334155">กำหนดจังหวะ PRF</text>
<rect x="260" y="80" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="345.0" y="109.0" text-anchor="middle" font-size="14" font-weight="bold">Modulator</text>
<text x="345.0" y="129.0" text-anchor="middle" font-size="11" fill="#334155">สร้างพัลส์แรงสูง</text>
<rect x="480" y="80" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="565.0" y="109.0" text-anchor="middle" font-size="14" font-weight="bold">Transmitter</text>
<text x="565.0" y="129.0" text-anchor="middle" font-size="11" fill="#334155">Magnetron / Solid-state</text>
<rect x="700" y="80" width="170" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="785.0" y="109.0" text-anchor="middle" font-size="14" font-weight="bold">Duplexer (T/R)</text>
<text x="785.0" y="129.0" text-anchor="middle" font-size="11" fill="#334155">สลับส่ง-รับ</text>
<rect x="700" y="250" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="785.0" y="279.0" text-anchor="middle" font-size="14" font-weight="bold">Receiver</text>
<text x="785.0" y="299.0" text-anchor="middle" font-size="11" fill="#334155">ขยาย + กรอง (gain, STC, FTC)</text>
<rect x="480" y="250" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="565.0" y="279.0" text-anchor="middle" font-size="14" font-weight="bold">Processor</text>
<text x="565.0" y="299.0" text-anchor="middle" font-size="11" fill="#334155">digital, tracking, AIS</text>
<rect x="260" y="250" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="345.0" y="279.0" text-anchor="middle" font-size="14" font-weight="bold">Display (PPI)</text>
<text x="345.0" y="299.0" text-anchor="middle" font-size="11" fill="#334155">ระยะ-ทิศ, EBL/VRM</text>
<rect x="40" y="250" width="170" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="125.0" y="279.0" text-anchor="middle" font-size="14" font-weight="bold">Heading / Speed</text>
<text x="125.0" y="299.0" text-anchor="middle" font-size="11" fill="#334155">Gyro (THD), Log, GNSS</text>
<line x1="210" y1="115" x2="258" y2="115" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="430" y1="115" x2="478" y2="115" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="650" y1="115" x2="698" y2="115" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="785" y1="150" x2="785" y2="248" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="700" y1="285" x2="652" y2="285" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="480" y1="285" x2="432" y2="285" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="210" y1="285" x2="258" y2="285" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ar)"/>
<polyline points="180,150 180,200 345,200 345,246" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="190" y="194" font-size="11">sync (เริ่มเส้นกวาดพร้อมการส่งพัลส์)</text>
<rect x="885" y="60" width="100" height="14" fill="#334155"/><line x1="935" y1="74" x2="935" y2="110" stroke="#334155" stroke-width="6"/>
<text x="935" y="52" text-anchor="middle" font-size="13" font-weight="bold">Antenna (scanner)</text>
<line x1="870" y1="115" x2="930" y2="115" stroke="#0f172a" stroke-width="2.5"/>
<path d="M 940 130 q 15 30 0 60 M 955 125 q 20 40 0 80" fill="none" stroke="#b91c1c" stroke-width="2"/>
<text x="880" y="230" font-size="12" fill="#b91c1c">พัลส์ / echo</text>
<rect x="40" y="350" width="920" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
<text x="56" y="378" font-size="13">ระยะ = (c × t) / 2  — คลื่นวิทยุเดินทาง ≈ 300 m/µs (ทางเดียว) → เป้าที่ 1 nm ใช้เวลาไป-กลับประมาณ 12.36 µs</text>
<text x="56" y="404" font-size="13">X-band 9.2–9.5 GHz (λ ≈ 3 cm): ภาพคม แยกเป้าดี ตรวจ SART/racon X · S-band 2.9–3.1 GHz (λ ≈ 10 cm): ทะลุฝน/คลื่นดีกว่า</text>
<text x="56" y="430" font-size="13">Pulse length สั้น → แยกเป้าในระยะดี (ใช้ระยะใกล้) · ยาว → พลังงานมาก ตรวจไกล (ระยะไกล) · PRF สัมพันธ์กับ pulse length</text>
</svg>
