<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ECDIS กับเซนเซอร์และระบบที่เชื่อมต่อ</text>
<rect x="390" y="180" width="220" height="110" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/>
<text x="500.0" y="229.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">ECDIS</text>
<text x="500.0" y="249.0" text-anchor="middle" font-size="11" fill="#dbeafe">SENC + presentation + alarms</text>
<rect x="40" y="60" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="150.0" y="94.0" text-anchor="middle" font-size="14" font-weight="bold">GNSS 1/2</text>
<text x="150.0" y="114.0" text-anchor="middle" font-size="11" fill="#334155">ตำแหน่ง SOG COG</text>
<line x1="260" y1="100" x2="390" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="180" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="150.0" y="214.0" text-anchor="middle" font-size="14" font-weight="bold">Gyro (THD)</text>
<text x="150.0" y="234.0" text-anchor="middle" font-size="11" fill="#334155">heading</text>
<line x1="260" y1="220" x2="390" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="300" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="150.0" y="334.0" text-anchor="middle" font-size="14" font-weight="bold">Speed log</text>
<text x="150.0" y="354.0" text-anchor="middle" font-size="11" fill="#334155">STW (และ/หรือ SOG)</text>
<line x1="260" y1="340" x2="390" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="390" y="60" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="500.0" y="94.0" text-anchor="middle" font-size="14" font-weight="bold">ENC + updates</text>
<text x="500.0" y="114.0" text-anchor="middle" font-size="11" fill="#334155">AVCS / S-63 permits</text>
<line x1="500" y1="140" x2="500" y2="178" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="740" y="60" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="850.0" y="94.0" text-anchor="middle" font-size="14" font-weight="bold">Radar / ARPA</text>
<text x="850.0" y="114.0" text-anchor="middle" font-size="11" fill="#334155">overlay + tracked targets</text>
<line x1="740" y1="100" x2="610" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="740" y="180" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="850.0" y="214.0" text-anchor="middle" font-size="14" font-weight="bold">AIS</text>
<text x="850.0" y="234.0" text-anchor="middle" font-size="11" fill="#334155">เป้า AIS, AtoN</text>
<line x1="740" y1="220" x2="610" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="740" y="300" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="850.0" y="334.0" text-anchor="middle" font-size="14" font-weight="bold">Echo sounder</text>
<text x="850.0" y="354.0" text-anchor="middle" font-size="11" fill="#334155">ความลึก (บางระบบ)</text>
<line x1="740" y1="340" x2="610" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="390" y="360" width="220" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="500.0" y="394.0" text-anchor="middle" font-size="14" font-weight="bold">Back-up ECDIS</text>
<text x="500.0" y="414.0" text-anchor="middle" font-size="11" fill="#334155">แหล่งไฟแยก + route เดียวกัน</text>
<line x1="500" y1="292" x2="500" y2="358" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<text x="492" y="330" text-anchor="end" font-size="11" fill="#334155">route + ENC เดียวกัน (พร้อมรับช่วง)</text>
<text x="500" y="460" text-anchor="middle" font-size="12" fill="#b91c1c">ถ้าเซนเซอร์ตัวเดียวผิด (เช่น GNSS) ทุกจอที่ใช้ข้อมูลนั้นผิดพร้อมกัน → ต้องยืนยันตำแหน่งด้วยวิธีอิสระเสมอ</text>
</svg>
