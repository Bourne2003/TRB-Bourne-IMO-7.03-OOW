<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="530" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การเข้าพื้นที่อับอากาศ (Enclosed space entry) — ขั้นตอนและค่าบรรยากาศ</text>
<rect x="30.0" y="58.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="80.0" font-size="12.2" text-anchor="start" fill="#0f172a">1. ตรวจทะเบียนพื้นที่อับอากาศ (Register of enclosed spaces) ห้องที่เชื่อมกัน</text>
<rect x="30.0" y="101.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="123.0" font-size="12.2" text-anchor="start" fill="#0f172a">2. ประเมินความเสี่ยง ระบุอันตราย (O₂ ต่ำ CO₂ ก๊าซพิษ ไวไฟ)</text>
<rect x="30.0" y="144.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="166.0" font-size="12.2" text-anchor="start" fill="#0f172a">3. Permit to enter ออกโดยผู้มีอำนาจ — อายุไม่เกิน 8 ชั่วโมง</text>
<rect x="30.0" y="187.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="209.0" font-size="12.2" text-anchor="start" fill="#0f172a">4. แยกระบบ: ปิดวาล์ว ล็อก/ป้าย ท่อ ปั๊ม ไฟฟ้า ไอน้ำ CO₂ ดับเพลิง</text>
<rect x="30.0" y="230.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="252.0" font-size="12.2" text-anchor="start" fill="#0f172a">5. ระบายอากาศอย่างเพียงพอ (และต่อเนื่องระหว่างทำงาน)</text>
<rect x="30.0" y="273.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="295.0" font-size="12.2" text-anchor="start" fill="#0f172a">6. วัดบรรยากาศหลายระดับด้วยเครื่องที่สอบเทียบแล้ว (หยุดพัดลม ~10 นาทีก่อนวัด)</text>
<rect x="30.0" y="316.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="338.0" font-size="12.2" text-anchor="start" fill="#0f172a">7. ทีมเข้า (ห้ามเข้าคนเดียว) + คนเฝ้าทางเข้า + การสื่อสาร + บันทึก</text>
<rect x="30.0" y="359.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="381.0" font-size="12.2" text-anchor="start" fill="#0f172a">8. อุปกรณ์กู้ภัยพร้อมที่ทางเข้า: SCBA สายรัดตัว รอก เปล</text>
<rect x="30.0" y="402.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="424.0" font-size="12.2" text-anchor="start" fill="#0f172a">9. ทุกคนพกเครื่องวัดส่วนบุคคล (O₂ CO₂ ไวไฟ พิษ) วัดต่อเนื่อง</text>
<rect x="30.0" y="445.0" width="560.0" height="35.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
<text x="44.0" y="467.0" font-size="12.2" text-anchor="start" fill="#0f172a">10. เสร็จงาน: นับคน ปิดพื้นที่ ปิด permit</text>
<rect x="620.0" y="58.0" width="350.0" height="232.0" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="795.0" y="85.0" font-size="14" text-anchor="middle" fill="#14532d" font-weight="bold">เกณฑ์บรรยากาศก่อนเข้า (ค่าคงที่)</text>
<text x="636.0" y="114.0" font-size="12.2" text-anchor="start" fill="#0f172a" font-weight="bold">ออกซิเจน (O₂)</text>
<text x="954.0" y="114.0" font-size="12" text-anchor="end" fill="#14532d">20.9% โดยปริมาตร (ค่าปกติของอากาศ)</text>
<text x="636.0" y="144.0" font-size="12.2" text-anchor="start" fill="#0f172a" font-weight="bold">คาร์บอนไดออกไซด์ (CO₂)</text>
<text x="954.0" y="144.0" font-size="12" text-anchor="end" fill="#14532d">ต่ำกว่า 0.5% (5,000 ppm)</text>
<text x="636.0" y="174.0" font-size="12.2" text-anchor="start" fill="#0f172a" font-weight="bold">ก๊าซไวไฟ</text>
<text x="954.0" y="174.0" font-size="12" text-anchor="end" fill="#14532d">ต่ำกว่า 1% ของ LFL</text>
<text x="636.0" y="204.0" font-size="12.2" text-anchor="start" fill="#0f172a" font-weight="bold">ก๊าซพิษ (H₂S, CO ฯลฯ)</text>
<text x="954.0" y="204.0" font-size="12" text-anchor="end" fill="#14532d">ต่ำกว่า 50% ของ OEL</text>
<text x="636.0" y="234.0" font-size="12.2" text-anchor="start" fill="#0f172a" font-weight="bold">ตรวจที่</text>
<text x="954.0" y="234.0" font-size="12" text-anchor="end" fill="#14532d">หลายระดับ: บน กลาง ล่าง</text>
<text x="636.0" y="264.0" font-size="12.2" text-anchor="start" fill="#0f172a" font-weight="bold">เครื่องมือ</text>
<text x="954.0" y="264.0" font-size="12" text-anchor="end" fill="#14532d">SOLAS XI-1/7 (วัด CO₂ ได้ด้วย)</text>
<rect x="620.0" y="302.0" width="350.0" height="196.0" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="636.0" y="328.0" font-size="12" text-anchor="start" fill="#7f1d1d" font-weight="bold">กฎเหล็ก</text>
<text x="636.0" y="348.0" font-size="12" text-anchor="start" fill="#7f1d1d">• ห้ามเข้าคนเดียว — ต้องมีทีมและคนเฝ้าทางเข้า</text>
<text x="636.0" y="368.0" font-size="12" text-anchor="start" fill="#7f1d1d">• ห้ามลงไปช่วยคนหมดสติโดยไม่มี SCBA</text>
<text x="636.0" y="388.0" font-size="12" text-anchor="start" fill="#7f1d1d">  — ผู้เสียชีวิตจำนวนมากคือ "ผู้ช่วย"</text>
<text x="636.0" y="408.0" font-size="12" text-anchor="start" fill="#7f1d1d">• หยุดพัดลม/ออกมาพัก → วัดใหม่ก่อนเข้า</text>
<text x="636.0" y="428.0" font-size="12" text-anchor="start" fill="#7f1d1d">• ห้องที่ติดกัน/เชื่อมกัน ถือว่าอันตราย</text>
<text x="636.0" y="448.0" font-size="12" text-anchor="start" fill="#7f1d1d">  จนกว่าจะพิสูจน์ได้ว่าปลอดภัย</text>
<text x="636.0" y="468.0" font-size="12" text-anchor="start" fill="#7f1d1d">• ฝึกการเข้าและกู้ภัยอย่างน้อยทุก 2 เดือน</text>
<text x="500.0" y="518.0" font-size="11.5" text-anchor="middle" fill="#334155">อ้างอิง: IMO Res. MSC.581(110) (รับรอง 27 มิ.ย. 2025 ใช้แทน A.1050(27) ตั้งแต่ ธ.ค. 2025), SOLAS XI-1/7, SOLAS III/19.3.6 และ SMS</text>
</svg>
