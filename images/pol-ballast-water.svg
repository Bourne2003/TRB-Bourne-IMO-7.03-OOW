<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="480" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Ballast Water Management (BWM Convention): D-1 exchange กับ D-2 standard</text>
<rect x="40.0" y="60.0" width="450.0" height="380.0" rx="12" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
<text x="265.0" y="88.0" font-size="15" text-anchor="middle" fill="#075985" font-weight="bold">D-1 Ballast water exchange (เดิม)</text>
<path d="M 60 120 L 60 400 L 100 400 Q 90 260 100 120 Z" fill="#d6d3d1" stroke="#57534e"/><text x="80.0" y="115.0" font-size="11" text-anchor="middle" fill="#44403c" font-weight="bold">ฝั่ง</text>
<line x1="210.0" y1="120.0" x2="210.0" y2="400.0" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4"/>
<text x="210.0" y="418.0" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="bold">50 nm</text>
<line x1="380.0" y1="120.0" x2="380.0" y2="400.0" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/>
<text x="380.0" y="418.0" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">200 nm</text>
<rect x="385.0" y="200.0" width="95.0" height="90.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="432.0" y="230.0" font-size="12" text-anchor="middle" fill="#14532d" font-weight="bold">ดีที่สุด</text>
<text x="432.0" y="248.0" font-size="11" text-anchor="middle" fill="#0f172a">≥ 200 nm</text>
<text x="432.0" y="264.0" font-size="11" text-anchor="middle" fill="#0f172a">ลึก ≥ 200 m</text>
<rect x="215.0" y="200.0" width="160.0" height="90.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="295.0" y="230.0" font-size="12" text-anchor="middle" fill="#713f12" font-weight="bold">ถ้าทำไม่ได้</text>
<text x="295.0" y="248.0" font-size="11" text-anchor="middle" fill="#0f172a">≥ 50 nm และ</text>
<text x="295.0" y="264.0" font-size="11" text-anchor="middle" fill="#0f172a">ลึก ≥ 200 m</text>
<rect x="112.0" y="305.0" width="368.0" height="66.0" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
<text x="296.0" y="323.0" font-size="12" text-anchor="middle" fill="#0f172a">ประสิทธิภาพ ≥ 95% ปริมาตร (sequential)</text>
<text x="296.0" y="341.0" font-size="12" text-anchor="middle" fill="#0f172a">หรือสูบผ่าน 3 เท่าของปริมาตรถัง (flow-through)</text>
<text x="296.0" y="361.0" font-size="11.5" text-anchor="middle" fill="#475569">ไม่ต้องเบี่ยงเส้นทาง/ไม่ทำเมื่อไม่ปลอดภัย (B-4)</text>
<rect x="510.0" y="60.0" width="450.0" height="380.0" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="735.0" y="88.0" font-size="15" text-anchor="middle" fill="#14532d" font-weight="bold">D-2 Performance standard (ปัจจุบัน)</text>
<text x="530.0" y="118.0" font-size="12.3" text-anchor="start" fill="#0f172a">เรือทุกลำต้องเป็นไปตาม D-2 แล้ว (ช่วงเปลี่ยนผ่าน</text>
<text x="530.0" y="140.0" font-size="12.3" text-anchor="start" fill="#0f172a">สิ้นสุด 8 ก.ย. 2024) → ใช้ Ballast Water</text>
<text x="530.0" y="162.0" font-size="12.3" text-anchor="start" fill="#0f172a">Management System (BWMS) ที่ได้รับการรับรอง</text>
<text x="530.0" y="184.0" font-size="12.3" text-anchor="start" fill="#0f172a"></text>
<text x="530.0" y="206.0" font-size="12.3" text-anchor="start" fill="#0f172a">น้ำที่ปล่อยต้องมีสิ่งมีชีวิตไม่เกินเกณฑ์:</text>
<text x="530.0" y="228.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ขนาด ≥ 50 µm: &lt; 10 ตัวต่อ m³</text>
<text x="530.0" y="250.0" font-size="12.3" text-anchor="start" fill="#0f172a">• ขนาด 10–50 µm: &lt; 10 ตัวต่อ mL</text>
<text x="530.0" y="272.0" font-size="12.3" text-anchor="start" fill="#0f172a">• แบคทีเรียตัวชี้วัด (V. cholerae &lt; 1 cfu/100 mL,</text>
<text x="530.0" y="294.0" font-size="12.3" text-anchor="start" fill="#0f172a">  E. coli &lt; 250, enterococci &lt; 100 cfu/100 mL)</text>
<text x="530.0" y="316.0" font-size="12.3" text-anchor="start" fill="#0f172a"></text>
<text x="530.0" y="338.0" font-size="12.3" text-anchor="start" fill="#0f172a" font-weight="bold">เอกสาร: BWM Plan · BWRB (แบบใหม่ 1 ก.พ. 2025)</text>
<text x="530.0" y="360.0" font-size="12.3" text-anchor="start" fill="#0f172a">· International BWM Certificate</text>
<text x="530.0" y="382.0" font-size="12.3" text-anchor="start" fill="#0f172a">OOW: ตำแหน่ง/เวลา/ปริมาณ ทุกการรับ-ปล่อย</text>
<text x="530.0" y="404.0" font-size="12.3" text-anchor="start" fill="#0f172a">และติดตามข้อกำหนดท้องถิ่น (เช่น สหรัฐฯ)</text>
<text x="500.0" y="465.0" font-size="11.5" text-anchor="middle" fill="#475569">ภาพแสดงหลักการ — รายละเอียดและข้อยกเว้นดู BWM Convention, Guidelines G1–G14 และข้อกำหนดของรัฐเจ้าท่า</text>
</svg>
