<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arg" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4ade80"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">มาตรการจัดเส้นทางเดินเรือ (Routeing measures) — สัญลักษณ์บนแผนที่โดยสรุป</text>
<rect x="20" y="60" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="135" y="84" text-anchor="middle" font-size="13" font-weight="bold">Traffic lane + separation zone</text>
<rect x="40" y="178" width="190" height="24" fill="#a21caf" opacity="0.3"/><path d="M 40 120 L 230 120 M 40 260 L 230 260" stroke="#a21caf" stroke-dasharray="8 5" stroke-width="1.5"/><polygon points="170.0,146.5 122.0,146.5 122.0,143.0 100.0,150.0 122.0,157.0 122.0,153.5 170.0,153.5" fill="#fff" stroke="#a21caf" stroke-width="2"/><polygon points="100.0,226.5 148.0,226.5 148.0,223.0 170.0,230.0 148.0,237.0 148.0,233.5 100.0,233.5" fill="#fff" stroke="#a21caf" stroke-width="2"/><text x="135" y="194" text-anchor="middle" font-size="10">separation zone</text><text x="135" y="278" text-anchor="middle" font-size="11">ลูกศรโปร่ง = ทิศการจราจรที่กำหนด</text><text x="135" y="293" text-anchor="middle" font-size="11">เดินชิดขวา (zone อยู่ทางซ้ายเรา)</text>
<rect x="265" y="60" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380" y="84" text-anchor="middle" font-size="13" font-weight="bold">Roundabout</text>
<circle cx="380" cy="190" r="22" fill="#a21caf" opacity="0.3"/><circle cx="380" cy="190" r="60" fill="none" stroke="#a21caf" stroke-dasharray="6 4"/><path d="M 440 190 A 60 60 0 0 0 380 130" fill="none" stroke="#a21caf" stroke-width="3" marker-end="url(#ar)"/>
<text x="380" y="280" text-anchor="middle" font-size="11">วนทวนเข็มนาฬิการอบจุดกลาง</text>
<rect x="510" y="60" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="625" y="84" text-anchor="middle" font-size="13" font-weight="bold">Inshore traffic zone</text>
<rect x="530" y="120" width="190" height="50" fill="#fef9c3" stroke="#ca8a04" stroke-dasharray="5 3"/><rect x="530" y="170" width="190" height="40" fill="#e0f2fe"/><text x="625" y="150" text-anchor="middle" font-size="11">ITZ (ระหว่าง lane กับฝั่ง)</text><rect x="530" y="90" width="190" height="30" fill="#f5deb3"/>
<text x="625" y="109" text-anchor="middle" font-size="11">ฝั่ง (coast)</text><rect x="530" y="168" width="190" height="5" fill="#a21caf" opacity="0.45"/><polygon points="655.0,192.0 617.0,192.0 617.0,189.0 595.0,195.0 617.0,201.0 617.0,198.0 655.0,198.0" fill="#fff" stroke="#a21caf" stroke-width="2"/><text x="625" y="230" text-anchor="middle" font-size="11">traffic lane ของ TSS</text><text x="625" y="278" text-anchor="middle" font-size="11">ใช้ตาม COLREG Rule 10(d)</text>
<rect x="755" y="60" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="870" y="84" text-anchor="middle" font-size="13" font-weight="bold">Two-way route</text>
<path d="M 785 165 L 955 165 M 785 215 L 955 215" stroke="#a21caf" stroke-dasharray="8 5" stroke-width="2"/><polygon points="930.0,176.2 892.0,176.2 892.0,173.5 870.0,179.0 892.0,184.5 892.0,181.8 930.0,181.8" fill="#fff" stroke="#a21caf" stroke-width="2" stroke-dasharray="5 3"/><polygon points="810.0,198.2 848.0,198.2 848.0,195.5 870.0,201.0 848.0,206.5 848.0,203.8 810.0,203.8" fill="#fff" stroke="#a21caf" stroke-width="2" stroke-dasharray="5 3"/><text x="870" y="260" text-anchor="middle" font-size="11">สองทาง — ให้ชิดขวา (GPSR 8.7)</text>
<rect x="20" y="305" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="135" y="329" text-anchor="middle" font-size="13" font-weight="bold">Recommended track / route</text>
<path d="M 50 475 L 220 395" stroke="#111827" stroke-width="2"/><path d="M 80 461 L 120 442" stroke="#111827" stroke-width="2" marker-end="url(#ar)"/><text x="135" y="515" text-anchor="middle" font-size="11">เส้นเดี่ยว/เส้นประ ตามที่แผนที่กำหนด</text>
<rect x="265" y="305" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380" y="329" text-anchor="middle" font-size="13" font-weight="bold">Deep-water route (DW)</text>
<path d="M 295 415 L 465 415 M 295 455 L 465 455" stroke="#a21caf" stroke-dasharray="10 5" stroke-width="2"/><text x="380" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#a21caf">DW 22m</text><text x="380" y="515" text-anchor="middle" font-size="11">สำหรับเรือกินน้ำลึก (สำรวจแล้ว)</text>
<rect x="510" y="305" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="625" y="329" text-anchor="middle" font-size="13" font-weight="bold">Precautionary area</text>
<rect x="550" y="375" width="150" height="120" fill="none" stroke="#a21caf" stroke-dasharray="6 4" stroke-width="2"/><path d="M 625 409 L 649 451 L 601 451 Z" fill="none" stroke="#a21caf" stroke-width="2.5"/><text x="625" y="446" text-anchor="middle" font-size="22" font-weight="bold" fill="#a21caf">!</text><text x="625" y="520" text-anchor="middle" font-size="11">ระวังเป็นพิเศษ (อาจมีทิศแนะนำ)</text>
<rect x="755" y="305" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="870" y="329" text-anchor="middle" font-size="13" font-weight="bold">Area to be avoided (ATBA)</text>
