af" stroke-width="2" fill="none"/><path d="M 829.2 483.7 L 817.2 484.3 M 823.2 484.0 L 822.8 477.0" stroke="#a21caf" stroke-width="2" fill="none"/><path d="M 804.6 481.0 L 803.4 469.1 M 804.0 475.0 L 811.0 474.4" stroke="#a21caf" stroke-width="2" fill="none"/><path d="M 802.6 461.1 L 801.4 449.2 M 802.0 455.1 L 809.0 454.5" stroke="#a21caf" stroke-width="2" fill="none"/><path d="M 800.6 441.2 L 799.4 429.3 M 800.0 435.2 L 807.0 434.6" stroke="#a21caf" stroke-width="2" fill="none"/><path d="M 798.6 421.3 L 797.4 409.4 M 798.0 415.3 L 805.0 414.7" stroke="#a21caf" stroke-width="2" fill="none"/><path d="M 796.6 401.4 L 795.4 389.5 M 796.0 395.4 L 803.0 394.8" stroke="#a21caf" stroke-width="2" fill="none"/>
<text x="870" y="440" text-anchor="middle" font-size="13" fill="#a21caf" font-weight="bold">ATBA</text><text x="870" y="515" text-anchor="middle" font-size="11">หลีกเลี่ยงทั้งหมดหรือบางประเภทเรือ</text><text x="870" y="529" text-anchor="middle" font-size="10">ขอบเป็น T-dash ก้านชี้เข้าพื้นที่</text>
</svg>
