<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker><marker id="arO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c2410c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ผลของน้ำตื้น (Shallow-water effects) ตามอัตราส่วน h/T</text>
<defs><linearGradient id="gS" x1="0" x2="1"><stop offset="0" stop-color="#fecaca"/><stop offset="0.5" stop-color="#fde68a"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient></defs><rect x="80" y="110" width="840" height="34" fill="url(#gS)" stroke="#0f172a"/><line x1="80.0" y1="144.0" x2="80.0" y2="154.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="80.0" y="170.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">1.0</text>
<line x1="136.0" y1="144.0" x2="136.0" y2="154.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="136.0" y="170.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">1.2</text>
<line x1="220.0" y1="144.0" x2="220.0" y2="154.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="220.0" y="170.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">1.5</text>
<line x1="360.0" y1="144.0" x2="360.0" y2="154.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="360.0" y="170.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">2.0</text>
<line x1="640.0" y1="144.0" x2="640.0" y2="154.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="640.0" y="170.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">3.0</text>
<line x1="920.0" y1="144.0" x2="920.0" y2="154.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="920.0" y="170.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">4.0</text>
<text x="80.0" y="100.0" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">h/T (ความลึกน้ำ ÷ กินน้ำลึก)</text>
<text x="90.0" y="132.0" font-size="12" text-anchor="start" fill="#7f1d1d" font-weight="bold">ผลรุนแรงมาก</text>
<text x="360.0" y="132.0" font-size="12" text-anchor="middle" fill="#78350f" font-weight="bold">เริ่มเห็นผลชัด (≈ &lt; 1.5–2)</text>
<text x="910.0" y="132.0" font-size="12" text-anchor="end" fill="#14532d" font-weight="bold">น้ำลึก (ผลน้อย)</text>
<circle cx="230" cy="310" r="55" fill="none" stroke="#15803d" stroke-width="3"/><circle cx="280" cy="310" r="105" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 5"/><text x="210.0" y="314.0" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">น้ำลึก</text>
<text x="280.0" y="438.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">น้ำตื้น h/T ≈ 1.2: tactical diameter</text>
<text x="280.0" y="455.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">อาจโตขึ้นเกือบ 2 เท่า</text>
<text x="470.0" y="200.0" font-size="13" text-anchor="start" fill="#0f172a">• Squat เพิ่ม (จมและเปลี่ยน trim) — UKC ลดลง</text>
<text x="470.0" y="226.0" font-size="13" text-anchor="start" fill="#0f172a">• ความต้านทานเพิ่ม → ความเร็วลดที่รอบเท่าเดิม รอบเครื่องตก</text>
<text x="470.0" y="252.0" font-size="13" text-anchor="start" fill="#0f172a">• วงเลี้ยวโตขึ้น หางเสือตอบสนองช้า ต้องใช้มุมหางเสือมากขึ้น</text>
<text x="470.0" y="278.0" font-size="13" text-anchor="start" fill="#0f172a">• ทรงทิศ (directional stability) เปลี่ยน — บางลำ "ตรง" ขึ้น บางลำ sheer</text>
<text x="470.0" y="304.0" font-size="13" text-anchor="start" fill="#0f172a">• มวลน้ำติดเรือ (added mass) เพิ่ม → เร่ง/หยุด/หันช้าลง</text>
<text x="470.0" y="330.0" font-size="13" text-anchor="start" fill="#0f172a">• Transverse thrust และการตอบสนองต่อการถอยผิดคาดได้</text>
<text x="470.0" y="356.0" font-size="13" text-anchor="start" fill="#0f172a">• คลื่นหัว/ท้ายใหญ่ขึ้น กระทบเรือเล็กและเรือที่จอด</text>
<text x="470.0" y="382.0" font-size="13" text-anchor="start" fill="#0f172a">• แรงจากกระแสน้ำ/ลมด้านข้างต่อใต้ท้องเรือเพิ่มมาก (UKC น้อย)</text>
<text x="470.0" y="408.0" font-size="13" text-anchor="start" fill="#0f172a">• ใบจักรดูดตะกอน/ทำลายท้องร่องน้ำ เครื่องร้อน (cooling intake)</text>
</svg>
