<rect x="600" y="380" width="380" height="240" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="614.0" y="406.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">สัญญาณเตือนว่ากำลังเกิด squat/น้ำตื้น:</text>
<text x="614.0" y="425.0" font-size="12.5" text-anchor="start" fill="#0f172a">• ความเร็วลดลงเองที่รอบเครื่องเท่าเดิม</text>
<text x="614.0" y="444.0" font-size="12.5" text-anchor="start" fill="#0f172a">• รอบเครื่องตก ตัวเรือสั่น (vibration)</text>
<text x="614.0" y="463.0" font-size="12.5" text-anchor="start" fill="#0f172a">• คลื่นหัว/ท้ายสูงขึ้น ร่องคลื่นท้ายเปลี่ยน</text>
<text x="614.0" y="482.0" font-size="12.5" text-anchor="start" fill="#0f172a">• หางเสือตอบสนองช้า เรือ sheer</text>
<text x="614.0" y="501.0" font-size="12.5" text-anchor="start" fill="#0f172a">• น้ำขุ่นโคลนขึ้นในร่องน้ำท้ายเรือ</text>
<text x="614.0" y="520.0" font-size="12.5" text-anchor="start" fill="#0f172a">• echo sounder แสดง UKC ลดลง</text>
<text x="614.0" y="539.0" font-size="12.5" text-anchor="start" fill="#0f172a"></text>
<text x="614.0" y="558.0" font-size="12.5" text-anchor="start" fill="#0f172a" font-weight="bold">แก้ไขที่ได้ผลที่สุด: ลดความเร็ว</text>
<text x="614.0" y="577.0" font-size="12.5" text-anchor="start" fill="#0f172a">(squat แปรผันประมาณ V² — ลดเร็วครึ่ง</text>
<text x="614.0" y="596.0" font-size="12.5" text-anchor="start" fill="#0f172a">squat เหลือประมาณ 1/4)</text>
