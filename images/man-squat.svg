<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker><marker id="arO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c2410c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Squat และ blockage factor (สูตร Barrass)</text>
<text x="230.0" y="75.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ภาคตัดขวางร่องน้ำ</text>
<path d="M 40 110 L 90 110 L 130 270 L 330 270 L 370 110 L 420 110" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><rect x="60" y="110" width="340" height="0" /><line x1="40.0" y1="140.0" x2="420.0" y2="140.0" stroke="#0284c7" stroke-width="2"/>
<rect x="190" y="125" width="80" height="70" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/><text x="230.0" y="165.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">b × T</text>
<line x1="110.0" y1="300.0" x2="350.0" y2="300.0" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arO)"/>
<line x1="350.0" y1="300.0" x2="110.0" y2="300.0" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arO)"/>
<text x="230.0" y="318.0" font-size="11" text-anchor="middle" fill="#c2410c">B = ความกว้างร่อง (ร่องคางหมูใช้พื้นที่หน้าตัดจริงแทน B × h)</text>
<line x1="430.0" y1="140.0" x2="430.0" y2="270.0" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arO)"/>
