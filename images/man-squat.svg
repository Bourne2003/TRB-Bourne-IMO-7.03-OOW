<text x="438.0" y="210.0" font-size="13" text-anchor="start" fill="#c2410c" font-weight="bold">h</text>
<text x="230.0" y="350.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">Blockage factor  S = (b × T) / (B × h)</text>
<text x="230.0" y="370.0" font-size="12" text-anchor="middle" fill="#334155">น้ำเปิด S &lt; ~0.10 · ร่องจำกัด S ≈ 0.10–0.27</text>
<text x="745.0" y="75.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ลักษณะการจม (โปรไฟล์)</text>
<line x1="520.0" y1="130.0" x2="970.0" y2="130.0" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>
<polygon points="540,105 940,105 960,120 940,160 560,160 540,145" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5" transform="rotate(2.5 750 130)"/><text x="745.0" y="190.0" font-size="12" text-anchor="middle" fill="#b91c1c">Cb &gt; 0.7 (เรือป้อม เช่น tanker/bulk) → หัวจมมากกว่า (trim by head)</text>
<polygon points="540,105 940,105 960,120 940,160 560,160 540,145" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5" transform="translate(0 110) rotate(-2.5 750 130)"/><line x1="520.0" y1="240.0" x2="970.0" y2="240.0" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="745.0" y="300.0" font-size="12" text-anchor="middle" fill="#1d4ed8">Cb &lt; 0.7 (เรือเพรียว เช่น container) → ท้ายจมมากกว่า (trim by stern)</text>
<text x="745.0" y="318.0" font-size="11" text-anchor="middle" fill="#334155">Cb ≈ 0.7 → จมเกือบเท่ากันทั้งหัวท้าย · มี static trim อยู่แล้ว squat มากที่ปลายด้านที่จมกว่า</text>
