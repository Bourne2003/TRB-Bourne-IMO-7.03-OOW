<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การจัดทีมเหตุฉุกเฉินไฟไหม้ตาม Muster list (ตัวอย่างโครงสร้างทั่วไป)</text>
