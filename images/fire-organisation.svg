<text x="500.0" y="452.0" font-size="12" text-anchor="middle" fill="#334155">ใช้ชื่อตำแหน่ง/หน้าที่ตาม muster list ของเรือจริง (SOLAS III/8, III/37) — การสื่อสารด้วยวิทยุพกพาชนิดป้องกันการระเบิด อย่างน้อย 2 เครื่องต่อทีมดับเพลิง</text>
