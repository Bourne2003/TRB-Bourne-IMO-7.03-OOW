<text x="500.0" y="82.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Command (สะพานเดินเรือ)</text>
<text x="500.0" y="106.0" font-size="11.5" text-anchor="middle" fill="#0f172a">นายเรือ + OOW: สั่งการ เดินเรือ สื่อสาร บันทึก</text>
