<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker><marker id="arO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c2410c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">แรงผลักด้านข้างของใบจักร (Transverse thrust / paddle-wheel effect)</text>
<circle cx="170" cy="220" r="85" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/><ellipse cx="170.0" cy="182.5" rx="14" ry="38" transform="rotate(0 170.0 182.5)" fill="#94a3b8" stroke="#0f172a"/><ellipse cx="202.5" cy="238.8" rx="14" ry="38" transform="rotate(120 202.5 238.8)" fill="#94a3b8" stroke="#0f172a"/><ellipse cx="137.5" cy="238.8" rx="14" ry="38" transform="rotate(240 137.5 238.8)" fill="#94a3b8" stroke="#0f172a"/><circle cx="170" cy="220" r="12" fill="#0f172a"/><path d="M 270 180 A 108 108 0 0 1 270 260" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arG)"/><text x="282.0" y="220.0" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">ahead</text>
<path d="M 70 180 A 108 108 0 0 0 70 260" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR)"/><text x="58.0" y="220.0" font-size="12" text-anchor="end" fill="#b91c1c" font-weight="bold">astern</text>
<text x="170.0" y="85.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ใบจักรเวียนขวา (RH FPP) มองจากท้าย</text>
<text x="170.0" y="335.0" font-size="12" text-anchor="middle" fill="#15803d">เดินหน้า: หมุนตามเข็มนาฬิกา</text>
<text x="170.0" y="353.0" font-size="12" text-anchor="middle" fill="#b91c1c">ถอยหลัง: หมุนทวนเข็มนาฬิกา</text>
<text x="170.0" y="380.0" font-size="11" text-anchor="middle" fill="#475569">กราบซ้าย ← · → กราบขวา</text>
<text x="500.0" y="85.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">สั่งถอยหลัง (astern) ขณะหยุด/ช้า</text>
<polygon points="500.0,135.0 522.0,183.4 522.0,375.0 478.0,375.0 478.0,183.4" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<line x1="510.0" y1="360.0" x2="430.0" y2="360.0" stroke="#b91c1c" stroke-width="4" marker-end="url(#arR)"/>
<text x="500.0" y="395.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">ท้ายปัดไปซ้าย (stern cants to port)</text>
<line x1="490.0" y1="155.0" x2="570.0" y2="155.0" stroke="#15803d" stroke-width="3" marker-end="url(#arG)"/>
<text x="578.0" y="159.0" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">หัวหันขวา</text>
<text x="500.0" y="418.0" font-size="12" text-anchor="middle" fill="#0f172a">ผลชัดมากเมื่อถอยหลังและความเร็วต่ำ · เดินหน้าก็มี</text>
<text x="500.0" y="434.0" font-size="12" text-anchor="middle" fill="#0f172a">แต่เล็กกว่ามากและหางเสือแก้ได้</text>
<text x="820.0" y="85.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ใช้ประโยชน์: เข้าเทียบกราบซ้าย</text>
<rect x="670" y="105" width="40" height="300" fill="#a8a29e" stroke="#57534e"/><text x="690.0" y="420.0" font-size="12" text-anchor="middle" fill="#57534e" font-weight="bold">ท่า</text>
<polygon points="749.0,122.7 779.2,163.6 821.5,362.9 780.4,371.6 738.1,172.3" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<path d="M 805 365 q -30 15 -55 10" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR)"/><path d="M 745 125 q 30 -10 50 0" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arG)"/><text x="865.0" y="205.0" font-size="12" text-anchor="start" fill="#0f172a">เข้าทำมุมเล็ก</text>
<text x="865.0" y="223.0" font-size="12" text-anchor="start" fill="#0f172a">สั่งถอยเพื่อหยุด</text>
<text x="865.0" y="241.0" font-size="12" text-anchor="start" fill="#0f172a">→ ท้ายเข้าหาท่า</text>
<text x="865.0" y="259.0" font-size="12" text-anchor="start" fill="#0f172a">→ หัวออก</text>
<text x="865.0" y="277.0" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">= ลำขนานท่า</text>
<text x="500.0" y="455.0" font-size="12" text-anchor="middle" fill="#334155">CPP: เพลาหมุนทิศเดียวตลอด ทิศ transverse thrust ตอนถอยขึ้นกับทิศหมุนของเพลา — ดูจาก pilot card/wheelhouse poster และลองสังเกตในที่ปลอดภัย</text>
</svg>
