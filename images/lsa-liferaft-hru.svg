<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">แพชูชีพแบบโยน (Throw-over liferaft): HRU, weak link และการปล่อยอัตโนมัติเมื่อเรือจม</text>
<text x="180.0" y="66.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">ตำแหน่งเก็บบนแท่น (cradle)</text>
<rect x="80.0" y="120.0" width="200.0" height="70.0" rx="30" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
<text x="180.0" y="160.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">ถังแพชูชีพ (canister)</text>
<rect x="60.0" y="190.0" width="240.0" height="14.0" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
<text x="180.0" y="225.0" font-size="11" text-anchor="middle" fill="#334155">cradle บนดาดฟ้า</text>
<line x1="180.0" y1="120.0" x2="180.0" y2="95.0" stroke="#0f172a" stroke-width="2"/>
<line x1="180.0" y1="95.0" x2="310.0" y2="95.0" stroke="#0f172a" stroke-width="2"/>
<rect x="310.0" y="85.0" width="50.0" height="22.0" rx="0" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
<text x="335.0" y="100.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">HRU</text>
<line x1="360.0" y1="96.0" x2="380.0" y2="96.0" stroke="#0f172a" stroke-width="2"/>
<line x1="380.0" y1="96.0" x2="380.0" y2="190.0" stroke="#0f172a" stroke-width="2"/>
<text x="386.0" y="182.0" font-size="11" text-anchor="start" fill="#0f172a">ยึดกับเรือ</text>
<path d="M 280 160 q 40 10 60 -20" fill="none" stroke="#c2410c" stroke-width="2.5"/><circle cx="345" cy="135" r="6" fill="none" stroke="#c2410c" stroke-width="2.5"/><text x="300.0" y="122.0" font-size="11" text-anchor="end" fill="#c2410c" font-weight="bold">weak link</text>
<line x1="351.0" y1="135.0" x2="380.0" y2="135.0" stroke="#c2410c" stroke-width="2"/>
<text x="180.0" y="260.0" font-size="11.5" text-anchor="middle" fill="#c2410c" font-weight="bold">Painter (เชือกผูกแพ) ต่อกับ weak link ที่ยึดกับจุดแข็งแรงของเรือ</text>
<text x="180.0" y="278.0" font-size="11" text-anchor="middle" fill="#c2410c">(หรือ weak link ที่ติดกับส่วนที่ยึดตายของ HRU ตามแบบ)</text>
<text x="180.0" y="296.0" font-size="11" text-anchor="middle" fill="#7f1d1d" font-weight="bold">ห้ามผูกกับสายรัด/ส่วนที่ถูกปลด และห้ามผูกตรงกับเรือโดยข้าม weak link</text>
<text x="700.0" y="66.0" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">เมื่อเรือจม (float-free)</text>
<rect x="440" y="90" width="520" height="240" fill="#bae6fd" opacity="0.5"/><line x1="440.0" y1="90.0" x2="960.0" y2="90.0" stroke="#0284c7" stroke-width="2"/>
<path d="M 450 330 L 520 250 L 555 268 L 495 330 Z" fill="#475569" opacity="0.8"/><path d="M 540 235 Q 610 215 650 170 Q 720 120 790 100" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="540" cy="235" r="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="562.0" y="257.0" font-size="11" text-anchor="start" fill="#0f172a" font-weight="bold">1. ที่ความลึกไม่เกิน 4 m</text>
<text x="562.0" y="272.0" font-size="10.5" text-anchor="start" fill="#334155">HRU ตัดสายยึด canister</text>
<circle cx="650" cy="170" r="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="650.0" y="202.0" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="bold">2. canister ลอยขึ้น</text>
<text x="650.0" y="217.0" font-size="10.5" text-anchor="middle" fill="#334155">painter ถูกดึงออกจนสุด</text>
<circle cx="790" cy="100" r="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="790.0" y="132.0" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="bold">3. แรงดึง painter</text>
<text x="790.0" y="147.0" font-size="10.5" text-anchor="middle" fill="#334155">เปิดวาล์วก๊าซ → แพพองตัว</text>
<circle cx="900" cy="140" r="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="900.0" y="172.0" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="bold">4. แรงลอยตัวของแพ</text>
<text x="900.0" y="187.0" font-size="10.5" text-anchor="middle" fill="#334155">ดึง weak link ขาด → แพเป็นอิสระ</text>
<rect x="40.0" y="360.0" width="920.0" height="145.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="56.0" y="384.0" font-size="11.8" text-anchor="start" fill="#0f172a">การโยนแพด้วยมือ (ขณะเรือยังลอย): ตรวจ painter ยึดกับจุดแข็งแรงของเรือ → ตรวจด้านข้างเรือโล่ง (ไม่มีคน/สิ่งกีดขวาง) → ปลดสายรัด</text>
<text x="56.0" y="409.0" font-size="11.8" text-anchor="start" fill="#0f172a">→ ยก/โยนลงน้ำ → ดึง painter ออกให้สุด (ยาวพอสำหรับระยะถึงน้ำเมื่อเรือเบาที่สุด) แล้วกระตุกแรง ๆ → แพพอง → ดึงเข้าข้างเรือ</text>
<text x="56.0" y="434.0" font-size="11.8" text-anchor="start" fill="#0f172a">→ ลงแพทางบันได/ตาข่ายหรือลงน้ำแล้วขึ้นแพ (หลีกเลี่ยงการกระโดดใส่หลังคาแพ) → ตัด painter ด้วยมีด (อยู่ใกล้ทางเข้า) → พายออกห่างเรือ</text>
<text x="56.0" y="459.0" font-size="11.8" text-anchor="start" fill="#0f172a">HRU: แบบใช้แล้วทิ้งมีอายุตามที่ผู้ผลิตกำหนด (ทั่วไป 2 ปี) — แบบบำรุงรักษาได้ต้องตรวจทุก 12 เดือน · แพต้องส่งสถานีบริการที่ได้รับอนุมัติ</text>
<text x="56.0" y="484.0" font-size="11.8" text-anchor="start" fill="#0f172a">ทุก 12 เดือน (ขยายได้ถึง 17 เดือนตามเงื่อนไข) · ตรวจทุกสัปดาห์/เดือน: สายรัด HRU วันหมดอายุ ตำแหน่ง painter ป้ายวิธีใช้</text>
</svg>
