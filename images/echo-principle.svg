<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
  <rect width="900" height="500" fill="#fff"/>
  <defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">หลักการ Echo Sounder</text>
  <rect x="0" y="120" width="900" height="300" fill="#dbeafe"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#1d4ed8" stroke-width="2"/>
  <text x="20" y="112" font-size="13" fill="#1d4ed8">ผิวน้ำ</text>
  <path d="M 120 70 L 520 70 L 500 190 Q 320 215 140 190 Z" fill="#475569"/>
