  <rect x="300" y="195" width="40" height="14" fill="#0f172a"/>
  <text x="348" y="228" font-size="12" font-weight="bold">Transducer</text>
  <path d="M 305 209 L 250 405 L 390 405 L 335 209 Z" fill="#fde68a" opacity="0.55"/>
  <g fill="none" stroke="#d97706" stroke-width="2">
    <path d="M 296 250 Q 320 262 344 250"/><path d="M 284 300 Q 320 316 356 300"/><path d="M 272 350 Q 320 368 368 350"/>
  </g>
  <path d="M 0 420 Q 150 400 300 412 T 600 410 T 900 425 L 900 500 L 0 500 Z" fill="#d6b98c" stroke="#92400e" stroke-width="2"/>
  <text x="40" y="470" font-size="13" fill="#78350f">พื้นทะเล</text>
  <line x1="430" y1="209" x2="430" y2="410" stroke="#0f172a" stroke-width="1.6" marker-start="url(#m)" marker-end="url(#m)"/>
  <text x="438" y="320" font-size="13" font-weight="bold">Depth below transducer</text>
  <line x1="560" y1="120" x2="560" y2="410" stroke="#15803d" stroke-width="1.6" marker-start="url(#m)" marker-end="url(#m)"/>
  <text x="568" y="270" font-size="13" fill="#15803d" font-weight="bold">Depth below surface</text>
  <line x1="660" y1="120" x2="660" y2="200" stroke="#b91c1c" stroke-width="1.6" marker-start="url(#m)" marker-end="url(#m)"/>
  <text x="668" y="165" font-size="13" fill="#b91c1c" font-weight="bold">Draught (keel offset)</text>
  <rect x="610" y="40" width="270" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="622" y="64" font-size="14" font-weight="bold">Depth = V × t ÷ 2</text>
  <text x="622" y="86" font-size="12">V ≈ 1,500 m/s · t = เวลาไป-กลับ</text>
</svg>
