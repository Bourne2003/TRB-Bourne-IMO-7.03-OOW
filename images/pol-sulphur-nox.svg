<text x="652.0" y="82.0" font-size="11.8" text-anchor="start" fill="#0f172a" font-weight="bold">SOx ECA (0.10% m/m) — วันที่ใช้ขีดจำกัด</text>
<text x="652.0" y="103.5" font-size="11.8" text-anchor="start" fill="#0f172a">• Baltic · North Sea (2015) · North American</text>
<text x="652.0" y="125.0" font-size="11.8" text-anchor="start" fill="#0f172a">  · US Caribbean (2015)</text>
<text x="652.0" y="146.5" font-size="11.8" text-anchor="start" fill="#0f172a">• Mediterranean (1 พ.ค. 2025)</text>
<text x="652.0" y="168.0" font-size="11.8" text-anchor="start" fill="#0f172a">• Canadian Arctic · Norwegian Sea (1 มี.ค. 2027)</text>
<text x="652.0" y="189.5" font-size="11.8" text-anchor="start" fill="#0f172a">• North-East Atlantic (1 ก.ย. 2028) — รับรองแล้ว</text>
<text x="652.0" y="211.0" font-size="11.8" text-anchor="start" fill="#0f172a">  ตรวจรายการ/เส้นเขตล่าสุดก่อนเดินทาง</text>
<text x="652.0" y="232.5" font-size="11.8" text-anchor="start" fill="#0f172a"></text>
<text x="652.0" y="254.0" font-size="11.8" text-anchor="start" fill="#0f172a" font-weight="bold">NOx (Reg. 13) — เครื่องดีเซล &gt; 130 kW</text>
<text x="652.0" y="275.5" font-size="11.8" text-anchor="start" fill="#0f172a">• Tier I (2000) · Tier II (2011) ทั่วโลก</text>
<text x="652.0" y="297.0" font-size="11.8" text-anchor="start" fill="#0f172a">• Tier III ใน NOx ECA ตามวันสร้างเรือ:</text>
<text x="652.0" y="318.5" font-size="11.8" text-anchor="start" fill="#0f172a">  N. American/US Caribbean 2016 · Baltic/</text>
<text x="652.0" y="340.0" font-size="11.8" text-anchor="start" fill="#0f172a">  North Sea 2021 · Canadian Arctic 2025 ·</text>
<text x="652.0" y="361.5" font-size="11.8" text-anchor="start" fill="#0f172a">  Norwegian Sea 2026 · NE Atlantic 2027</text>
<text x="652.0" y="383.0" font-size="11.8" text-anchor="start" fill="#0f172a"></text>
<text x="652.0" y="404.5" font-size="11.8" text-anchor="start" fill="#0f172a">ห้ามบรรทุกเชื้อเพลิง &gt; 0.50% เพื่อใช้ (ไม่มี</text>
