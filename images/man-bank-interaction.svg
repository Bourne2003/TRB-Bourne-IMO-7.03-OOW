<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="585" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker><marker id="arO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c2410c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Bank effect และ interaction ระหว่างเรือ (pressure fields)</text>
<text x="250.0" y="70.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Bank effect (ตลิ่งอยู่กราบซ้าย เรือมุ่งไปทางขวา)</text>
<path d="M 40 110 L 460 110 L 460 90 L 40 90 Z" fill="#d6d3d1" stroke="#57534e"/><text x="250.0" y="104.0" font-size="12" text-anchor="middle" fill="#44403c" font-weight="bold">ตลิ่ง / ขอบร่องน้ำ (bank)</text>
<polygon points="400.0,190.0 345.0,215.0 100.0,215.0 100.0,165.0 345.0,165.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<line x1="380.0" y1="165.0" x2="380.0" y2="210.0" stroke="#15803d" stroke-width="3" marker-end="url(#arG)"/>
<text x="388.0" y="240.0" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">Bank cushion: หัวถูกดันออก</text>
<line x1="120.0" y1="160.0" x2="120.0" y2="125.0" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR)"/>
<text x="120.0" y="240.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">Bank suction: ท้ายถูกดูดเข้า</text>
<text x="250.0" y="270.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">ผลรวม: เรือ sheer หันหัวหนีตลิ่ง (ไปกลางร่อง)</text>
<text x="250.0" y="288.0" font-size="12" text-anchor="middle" fill="#334155">แก้: หางเสือหันเข้าหาตลิ่ง ลดความเร็ว รักษาระยะ</text>
<text x="250.0" y="306.0" font-size="12" text-anchor="middle" fill="#334155">ความเร็วสูง + ใกล้ตลิ่ง + UKC น้อย = ผลแรงที่สุด</text>
<text x="750.0" y="70.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Pressure field รอบตัวเรือที่แล่น</text>
<ellipse cx="890" cy="190" rx="70" ry="60" fill="#fecaca" opacity="0.8"/><ellipse cx="610" cy="190" rx="60" ry="50" fill="#fecaca" opacity="0.8"/><ellipse cx="750" cy="190" rx="110" ry="70" fill="#bfdbfe" opacity="0.8"/><polygon points="900.0,190.0 845.0,215.0 600.0,215.0 600.0,165.0 845.0,165.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<text x="900.0" y="126.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">+ ความดันสูง (หัว)</text>
<text x="600.0" y="134.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">+ (ท้าย)</text>
<text x="750.0" y="282.0" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="bold">− ความดันต่ำ (กลางลำ) = แรงดูด</text>
<line x1="790.0" y1="305.0" x2="860.0" y2="305.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<text x="784.0" y="309.0" font-size="11" text-anchor="end" fill="#0f172a">ทิศเดินเรือ</text>
<text x="500.0" y="330.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">การแซงในร่องน้ำแคบ (overtaking) — ช่วงอันตราย</text>
<polygon points="250.0,395.0 225.8,406.0 130.0,406.0 130.0,384.0 225.8,384.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="145.0,430.0 118.6,442.0 15.0,442.0 15.0,418.0 118.6,418.0" fill="#bfdbfe" stroke="#0f172a" stroke-width="1.5"/>
<text x="190.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="bold">1. หัวเรือแซงถึงท้ายเรือถูกแซง</text>
<text x="190.0" y="488.0" font-size="11.5" text-anchor="middle" fill="#334155">+ ชน + → ผลักกัน: ท้ายเรือถูกแซงถูกดันออก</text>
<text x="190.0" y="504.0" font-size="11.5" text-anchor="middle" fill="#334155">หัวเรือถูกแซงจึงหันเข้าหาทางเรือแซง</text>
<polygon points="560.0,395.0 535.8,406.0 440.0,406.0 440.0,384.0 535.8,384.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="565.0,430.0 538.6,442.0 435.0,442.0 435.0,418.0 538.6,418.0" fill="#bfdbfe" stroke="#0f172a" stroke-width="1.5"/>
<text x="500.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="bold">2. ขนานกันกลางลำ</text>
<text x="500.0" y="488.0" font-size="11.5" text-anchor="middle" fill="#334155">− กับ − → แรงดูดดึงเข้าหากัน</text>
<text x="500.0" y="504.0" font-size="11.5" text-anchor="middle" fill="#334155">ทั้งสองลำ (ยิ่งใกล้ยิ่งแรง)</text>
<polygon points="870.0,395.0 845.8,406.0 750.0,406.0 750.0,384.0 845.8,384.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="970.0,430.0 943.6,442.0 840.0,442.0 840.0,418.0 943.6,418.0" fill="#bfdbfe" stroke="#0f172a" stroke-width="1.5"/>
<text x="810.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="bold">3. หัวเรือถูกแซงอยู่ช่วงท้ายเรือแซง</text>
<text x="810.0" y="488.0" font-size="11.5" text-anchor="middle" fill="#334155">หัวเรือถูกแซงถูกดูดเข้าหา อาจ sheer</text>
<text x="810.0" y="504.0" font-size="11.5" text-anchor="middle" fill="#334155">ตัดท้ายเรือแซง — ช่วงอันตรายมาก</text>
<text x="60.0" y="375.0" font-size="11" text-anchor="start" fill="#475569">เทา = เรือถูกแซง (ช้า) · ฟ้า = เรือแซง</text>
<text x="500.0" y="548.0" font-size="12" text-anchor="middle" fill="#0f172a">ข้อปฏิบัติ: ตกลงกันทาง VHF/สัญญาณเสียง (Rule 9(e)) · ลดความเร็วของเรือที่ถูกแซง (แต่คงหางเสือ) · ระยะด้านข้างให้มากที่สุด</text>
<text x="500.0" y="568.0" font-size="12" text-anchor="middle" fill="#b91c1c">เรือเล็ก/เรือลากจูงใกล้หัวเรือใหญ่อาจถูกดูดเข้าหาหรือหมุนตัดหน้า — ระวังเป็นพิเศษ</text>
</svg>
