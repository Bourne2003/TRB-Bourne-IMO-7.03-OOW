<text x="500.0" y="250.0" font-size="11.8" text-anchor="middle" fill="#0f172a">Intermediate survey: ภายใน ±3 เดือนของวันครบรอบปีที่ 2 หรือ 3 (แทน annual ครั้งนั้น) · Renewal: ภายใน 3 เดือนก่อนหมดอายุ (ใบใหม่นับต่อจากวันหมดอายุเดิม)</text>
<text x="500.0" y="274.0" font-size="11.8" text-anchor="middle" fill="#0f172a">ISM/ISPS/MLC ใช้รอบ audit/inspection คล้ายกัน (intermediate ระหว่างปีที่ 2–3) · Bottom inspection 2 ครั้งในรอบ 5 ปี</text>
<text x="500.0" y="310.0" font-size="11.8" text-anchor="middle" fill="#475569">การสำรวจแต่ละครั้งต้องสลักหลัง (endorse) ในใบรับรอง — OOW ช่วยเตรียมอุปกรณ์/สาธิตการทำงานให้ surveyor</text>
