<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">รอบการสำรวจแบบประสาน (HSSC) ของใบรับรองอายุ 5 ปี — ตัวอย่างแนวคิด</text>
