<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="590" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">MARPOL Annex I: เกณฑ์การปล่อยน้ำปนน้ำมัน (หลักทั่วไป)</text>
<rect x="40.0" y="60.0" width="450.0" height="510.0" rx="12" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/>
<text x="265.0" y="88.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">จากห้องเครื่อง (ทุกเรือ ≥ 400 GT)</text>
<rect x="60.0" y="120.0" width="170.0" height="50.0" rx="8" fill="#e2e8f0" stroke="#1f2937" stroke-width="1.5"/>
<text x="145.0" y="150.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">Bilge wells</text>
<rect x="60.0" y="200.0" width="170.0" height="50.0" rx="8" fill="#e2e8f0" stroke="#1f2937" stroke-width="1.5"/>
<text x="145.0" y="230.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">Bilge holding tank</text>
<rect x="60.0" y="280.0" width="170.0" height="50.0" rx="8" fill="#e2e8f0" stroke="#1f2937" stroke-width="1.5"/>
<text x="145.0" y="310.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">Oily water separator</text>
<rect x="60.0" y="360.0" width="170.0" height="50.0" rx="8" fill="#e2e8f0" stroke="#1f2937" stroke-width="1.5"/>
<text x="145.0" y="390.0" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="bold">15 ppm alarm (OCM)</text>
<line x1="145.0" y1="170.0" x2="145.0" y2="198.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="145.0" y1="250.0" x2="145.0" y2="278.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="145.0" y1="330.0" x2="145.0" y2="358.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="230.0" y1="385.0" x2="330.0" y2="385.0" stroke="#15803d" stroke-width="3" marker-end="url(#ar)"/>
<text x="280.0" y="375.0" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">≤ 15 ppm</text>
<text x="340.0" y="390.0" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">ลงทะเล</text>
<path d="M 145 410 L 145 450 L 300 450" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arR)"/><text x="160.0" y="470.0" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="bold">&gt; 15 ppm → หยุดปล่อยอัตโนมัติ / ส่งกลับ</text>
<text x="250.0" y="230.0" font-size="11.5" text-anchor="start" fill="#334155">Sludge tank → incinerator</text>
<text x="250.0" y="246.0" font-size="11.5" text-anchor="start" fill="#334155">หรือส่งท่า (reception facility)</text>
<text x="56.0" y="494.0" font-size="11.5" text-anchor="start" fill="#334155">เงื่อนไข: เรือกำลังเดินทาง (en route) · ผ่านอุปกรณ์กรองที่รับรอง</text>
<text x="56.0" y="512.0" font-size="11.5" text-anchor="start" fill="#334155">ไม่เจือจาง · ไม่มาจาก cargo pump room/ปนกากสินค้าของ tanker</text>
<text x="56.0" y="530.0" font-size="11.5" text-anchor="start" fill="#334155">alarm + หยุดอัตโนมัติ (บังคับชัดเจนเมื่อ ≥ 10,000 GT — Reg. 14)</text>
<text x="56.0" y="548.0" font-size="11.5" text-anchor="start" fill="#334155">ห้ามใน Antarctic area และ Arctic (Polar Code) · บันทึก ORB Part I</text>
<rect x="510.0" y="60.0" width="450.0" height="510.0" rx="12" fill="#fffbeb" stroke="#a16207" stroke-width="2"/>
<text x="735.0" y="88.0" font-size="15" text-anchor="middle" fill="#78350f" font-weight="bold">จากส่วนสินค้าของเรือ tanker (cargo area)</text>
<text x="540.0" y="130.0" font-size="13" text-anchor="start" fill="#0f172a">✔ ไม่อยู่ใน special area</text>
<text x="540.0" y="160.0" font-size="13" text-anchor="start" fill="#0f172a">✔ ห่างฝั่งที่ใกล้ที่สุดมากกว่า 50 ไมล์ทะเล</text>
<text x="540.0" y="190.0" font-size="13" text-anchor="start" fill="#0f172a">✔ เรือกำลังเดินทาง (en route)</text>
<text x="540.0" y="220.0" font-size="13" text-anchor="start" fill="#0f172a">✔ อัตราปล่อยทันที ≤ 30 ลิตรต่อไมล์ทะเล</text>
<text x="540.0" y="250.0" font-size="13" text-anchor="start" fill="#0f172a">✔ ปริมาณรวม ≤ 1/30,000 ของสินค้าที่บรรทุก</text>
<text x="540.0" y="280.0" font-size="13" text-anchor="start" fill="#0f172a">   (tanker ส่งมอบหลัง 31 ธ.ค. 1979)</text>
<text x="540.0" y="310.0" font-size="13" text-anchor="start" fill="#0f172a">✔ ระบบ ODMCS (oil discharge monitoring</text>
<text x="540.0" y="340.0" font-size="13" text-anchor="start" fill="#0f172a">   and control system) ทำงาน</text>
<text x="540.0" y="370.0" font-size="13" text-anchor="start" fill="#0f172a">✔ มี slop tank ตามที่กำหนด</text>
<text x="540.0" y="400.0" font-size="13" text-anchor="start" fill="#0f172a">✔ บันทึก Oil Record Book Part II</text>
<text x="735.0" y="470.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">ต้องครบทุกข้อพร้อมกัน — ไม่ครบข้อใดข้อหนึ่ง = ห้ามปล่อย</text>
<text x="735.0" y="492.0" font-size="11.5" text-anchor="middle" fill="#475569">น้ำอับเฉาสะอาด/แยก (clean/segregated ballast) มีเกณฑ์ต่างหาก</text>
<text x="735.0" y="510.0" font-size="11.5" text-anchor="middle" fill="#475569">ข้อกำหนดท้องถิ่นอาจเข้มกว่า — ตรวจก่อนเสมอ</text>
</svg>
