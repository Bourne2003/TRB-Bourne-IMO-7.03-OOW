<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">โครงสร้างส่วนหัว (Bow) และส่วนท้าย (Stern) — ชื่อที่ควรรู้</text>
<text x="250.0" y="66.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ส่วนหัวเรือ</text>
<path d="M 60 120 L 380 120 L 440 110 L 410 300 Q 440 330 400 360 Q 360 370 330 350 L 60 350 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.5"/><line x1="200.0" y1="120.0" x2="200.0" y2="350.0" stroke="#b91c1c" stroke-width="3"/>
<text x="200.0" y="380.0" font-size="11.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">Collision bulkhead</text>
<line x1="200.0" y1="170.0" x2="405.0" y2="170.0" stroke="#475569" stroke-width="3"/>
<line x1="200.0" y1="220.0" x2="405.0" y2="220.0" stroke="#475569" stroke-width="3"/>
<line x1="200.0" y1="270.0" x2="405.0" y2="270.0" stroke="#475569" stroke-width="3"/>
<text x="300.0" y="196.0" font-size="11" text-anchor="middle" fill="#334155">Panting stringers / breasthooks</text>
<rect x="240.0" y="125.0" width="60.0" height="40.0" rx="0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<text x="270.0" y="150.0" font-size="9.5" text-anchor="middle" fill="#0f172a">chain locker</text>
<line x1="380.0" y1="135.0" x2="425.0" y2="175.0" stroke="#0f172a" stroke-width="4"/>
<text x="440.0" y="168.0" font-size="11" text-anchor="start" fill="#0f172a" font-weight="bold">Hawse pipe</text>
<text x="300.0" y="320.0" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Fore peak tank</text>
<text x="420.0" y="380.0" font-size="11.5" text-anchor="middle" fill="#0f172a" font-weight="bold">Bulbous bow</text>
<text x="450.0" y="120.0" font-size="11.5" text-anchor="start" fill="#0f172a" font-weight="bold">Stem</text>
<text x="750.0" y="66.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">ส่วนท้ายเรือ</text>
<path d="M 940 120 L 600 120 L 560 160 L 580 260 L 640 300 L 940 350 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.5"/><line x1="800.0" y1="120.0" x2="800.0" y2="350.0" stroke="#b91c1c" stroke-width="3"/>
<text x="800.0" y="380.0" font-size="11.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">Aft peak bulkhead</text>
<path d="M 640 300 L 640 360 L 600 360" fill="none" stroke="#0f172a" stroke-width="5"/><text x="655.0" y="395.0" font-size="11" text-anchor="start" fill="#0f172a" font-weight="bold">Stern frame / sole piece</text>
<path d="M 625 255 L 590 255 L 585 345 L 625 345 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/><text x="580.0" y="300.0" font-size="11.5" text-anchor="end" fill="#0f172a" font-weight="bold">Rudder</text>
<line x1="605.0" y1="150.0" x2="605.0" y2="255.0" stroke="#0f172a" stroke-width="5"/>
<text x="598.0" y="205.0" font-size="11" text-anchor="end" fill="#0f172a" font-weight="bold">Rudder stock</text>
<ellipse cx="655" cy="320" rx="7" ry="28" fill="#94a3b8" stroke="#0f172a"/><text x="668.0" y="340.0" font-size="11" text-anchor="start" fill="#0f172a" font-weight="bold">Propeller</text>
<line x1="662.0" y1="320.0" x2="790.0" y2="300.0" stroke="#475569" stroke-width="4"/>
<text x="720.0" y="300.0" font-size="10.5" text-anchor="middle" fill="#334155">Stern tube / shaft</text>
<text x="700.0" y="200.0" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Aft peak tank</text>
<text x="700.0" y="150.0" font-size="11.5" text-anchor="middle" fill="#0f172a" font-weight="bold">Steering gear room</text>
<rect x="40.0" y="420.0" width="920.0" height="90.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="56.0" y="446.0" font-size="12" text-anchor="start" fill="#0f172a">ส่วนหัวรับแรง panting และ pounding → เสริมด้วย panting beams/stringers, breasthooks, โครงถี่ขึ้น, แผ่นหนาขึ้น (และพื้นหัวเรือรับ slamming)</text>
<text x="56.0" y="470.0" font-size="12" text-anchor="start" fill="#0f172a">ส่วนท้ายรับแรงจากใบจักร/หางเสือและการสั่น → stern frame แข็งแรง, rudder stock + carrier + bearings, stern tube + seals (ป้องกันน้ำมันรั่ว)</text>
<text x="56.0" y="494.0" font-size="12" text-anchor="start" fill="#0f172a">Collision bulkhead และ aft peak bulkhead คือผนังกั้นน้ำที่ต้องมีทุกเรือ — ช่องว่างหน้า/ท้ายสุดมักเป็นถังอับเฉาปรับ trim</text>
</svg>
