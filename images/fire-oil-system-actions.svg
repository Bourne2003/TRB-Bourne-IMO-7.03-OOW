<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ไฟไหม้จากระบบน้ำมันในห้องเครื่อง — ลำดับการกระทำทั่วไป</text>
<rect x="30.0" y="70.0" width="220.0" height="180.0" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/>
<rect x="30.0" y="70.0" width="220.0" height="40.0" rx="12" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<rect x="30.0" y="95.0" width="220.0" height="15.0" rx="0" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<text x="140.0" y="97.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">1. ตรวจพบ / สัญญาณ</text>
<text x="140.0" y="150.0" font-size="11.5" text-anchor="middle" fill="#0f172a">alarm, กดสัญญาณไฟไหม้</text>
<text x="140.0" y="174.0" font-size="11.5" text-anchor="middle" fill="#0f172a">แจ้งสะพานเดินเรือ</text>
<line x1="252.0" y1="160.0" x2="268.0" y2="160.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="270.0" y="70.0" width="220.0" height="180.0" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/>
<rect x="270.0" y="70.0" width="220.0" height="40.0" rx="12" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<rect x="270.0" y="95.0" width="220.0" height="15.0" rx="0" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<text x="380.0" y="97.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">2. ตัดเชื้อเพลิง</text>
<text x="380.0" y="150.0" font-size="11.5" text-anchor="middle" fill="#0f172a">หยุดปั๊มน้ำมัน/purifiers (emergency stop)</text>
<text x="380.0" y="174.0" font-size="11.5" text-anchor="middle" fill="#0f172a">ปิด quick-closing valves จากระยะไกล</text>
<line x1="492.0" y1="160.0" x2="508.0" y2="160.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="510.0" y="70.0" width="220.0" height="180.0" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2.5"/>
<rect x="510.0" y="70.0" width="220.0" height="40.0" rx="12" fill="#c2410c" stroke="#c2410c" stroke-width="0"/>
<rect x="510.0" y="95.0" width="220.0" height="15.0" rx="0" fill="#c2410c" stroke="#c2410c" stroke-width="0"/>
<text x="620.0" y="97.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">3. ตัดอากาศ</text>
<text x="620.0" y="150.0" font-size="11.5" text-anchor="middle" fill="#0f172a">หยุดพัดลม ปิด fire dampers</text>
<text x="620.0" y="174.0" font-size="11.5" text-anchor="middle" fill="#0f172a">ปิดประตู skylight ช่องเปิด</text>
<line x1="732.0" y1="160.0" x2="748.0" y2="160.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="750.0" y="70.0" width="220.0" height="180.0" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2.5"/>
<rect x="750.0" y="70.0" width="220.0" height="40.0" rx="12" fill="#c2410c" stroke="#c2410c" stroke-width="0"/>
<rect x="750.0" y="95.0" width="220.0" height="15.0" rx="0" fill="#c2410c" stroke="#c2410c" stroke-width="0"/>
<text x="860.0" y="97.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">4. ดับในขั้นต้น</text>
<text x="860.0" y="150.0" font-size="11.5" text-anchor="middle" fill="#0f172a">ถังโฟม/ผง, water mist/local application</text>
<text x="860.0" y="174.0" font-size="11.5" text-anchor="middle" fill="#0f172a">ห้ามใช้น้ำแบบลำ (jet) กับน้ำมัน</text>
<rect x="30.0" y="290.0" width="220.0" height="180.0" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/>
<rect x="30.0" y="290.0" width="220.0" height="40.0" rx="12" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<rect x="30.0" y="315.0" width="220.0" height="15.0" rx="0" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="140.0" y="317.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">5. ถ้าควบคุมไม่ได้</text>
<text x="140.0" y="370.0" font-size="11.5" text-anchor="middle" fill="#0f172a">อพยพ นับคนให้ครบ ปิดห้อง</text>
<text x="140.0" y="394.0" font-size="11.5" text-anchor="middle" fill="#0f172a">นายเรือสั่งปล่อย CO₂ ตามขั้นตอน</text>
<line x1="252.0" y1="380.0" x2="268.0" y2="380.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="270.0" y="290.0" width="220.0" height="180.0" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/>
<rect x="270.0" y="290.0" width="220.0" height="40.0" rx="12" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<rect x="270.0" y="315.0" width="220.0" height="15.0" rx="0" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="380.0" y="317.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">6. Boundary cooling</text>
<text x="380.0" y="370.0" font-size="11.5" text-anchor="middle" fill="#0f172a">ฉีดน้ำหล่อเย็นผนัง/ดาดฟ้ารอบห้อง</text>
<text x="380.0" y="394.0" font-size="11.5" text-anchor="middle" fill="#0f172a">เฝ้าทุกด้าน (6 ด้าน)</text>
<line x1="492.0" y1="380.0" x2="508.0" y2="380.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="510.0" y="290.0" width="220.0" height="180.0" rx="12" fill="#fff" stroke="#15803d" stroke-width="2.5"/>
<rect x="510.0" y="290.0" width="220.0" height="40.0" rx="12" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<rect x="510.0" y="315.0" width="220.0" height="15.0" rx="0" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="620.0" y="317.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">7. เดินเรือและสื่อสาร</text>
<text x="620.0" y="370.0" font-size="11.5" text-anchor="middle" fill="#0f172a">ไฟ NUC, แจ้ง MRCC/เรือใกล้เคียง</text>
<text x="620.0" y="394.0" font-size="11.5" text-anchor="middle" fill="#0f172a">บริษัท, เตรียม LSA</text>
<line x1="732.0" y1="380.0" x2="748.0" y2="380.0" stroke="#0f172a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="750.0" y="290.0" width="220.0" height="180.0" rx="12" fill="#fff" stroke="#15803d" stroke-width="2.5"/>
<rect x="750.0" y="290.0" width="220.0" height="40.0" rx="12" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<rect x="750.0" y="315.0" width="220.0" height="15.0" rx="0" fill="#15803d" stroke="#15803d" stroke-width="0"/>
<text x="860.0" y="317.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">8. หลังดับ</text>
<text x="860.0" y="370.0" font-size="11.5" text-anchor="middle" fill="#0f172a">รอให้เย็น (ห้ามเปิดเร็ว — ติดใหม่)</text>
<text x="860.0" y="394.0" font-size="11.5" text-anchor="middle" fill="#0f172a">วัดก๊าซก่อนเข้า เฝ้าระวัง บันทึก</text>
<text x="500.0" y="530.0" font-size="11.5" text-anchor="middle" fill="#334155">สาเหตุที่พบบ่อย: น้ำมันพ่น/รั่วจากท่อแรงดันสูง ข้อต่อ ตัวกรอง ลงบนพื้นผิวร้อน (ท่อไอเสีย turbocharger) — SOLAS II-2/4 กำหนดฉนวนพื้นผิวร้อนและท่อน้ำมันแรงดันสูงแบบมีปลอก</text>
<text x="500.0" y="550.0" font-size="11.5" text-anchor="middle" fill="#b91c1c">ขั้นตอนจริงตาม SMS และ fire safety operational booklet ของเรือ — การปล่อย CO₂ เป็นการตัดสินใจของนายเรือ</text>
</svg>
