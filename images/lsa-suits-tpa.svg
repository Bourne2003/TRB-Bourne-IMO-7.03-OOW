<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Lifejacket · Immersion suit · Thermal protective aid (TPA) — ต่างกันอย่างไร</text>
<rect x="40.0" y="60.0" width="295.0" height="380.0" rx="14" fill="#fff" stroke="#f97316" stroke-width="2.5"/>
<rect x="40.0" y="60.0" width="295.0" height="46.0" rx="14" fill="#f97316" stroke="#f97316" stroke-width="0"/>
<rect x="40.0" y="90.0" width="295.0" height="16.0" rx="0" fill="#f97316" stroke="#f97316" stroke-width="0"/>
<text x="187.0" y="90.0" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Lifejacket</text>
<path d="M 147 130 L 172 130 L 177 200 L 142 200 Z" fill="#f97316"/><path d="M 227 130 L 202 130 L 197 200 L 232 200 Z" fill="#f97316"/><circle cx="159" cy="145" r="4" fill="#facc15"/><text x="58.0" y="270.0" font-size="12" text-anchor="start" fill="#0f172a">• ลอยตัว พลิกคนหมดสติให้หน้าหงาย</text>
<text x="58.0" y="300.0" font-size="12" text-anchor="start" fill="#0f172a">• ไฟ (light) นกหวีด แถบสะท้อนแสง</text>
<text x="58.0" y="330.0" font-size="12" text-anchor="start" fill="#0f172a">• สวมได้ถูกต้องภายใน 1 นาที</text>
<text x="58.0" y="360.0" font-size="12" text-anchor="start" fill="#0f172a">• กระโดดจากสูง ≥ 4.5 m ได้ไม่บาดเจ็บ</text>
<text x="58.0" y="390.0" font-size="12" text-anchor="start" fill="#0f172a">• ทุกคน + สำรองที่สถานีเฝ้ายาม</text>
<rect x="355.0" y="60.0" width="295.0" height="380.0" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
<rect x="355.0" y="60.0" width="295.0" height="46.0" rx="14" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<rect x="355.0" y="90.0" width="295.0" height="16.0" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<text x="502.0" y="90.0" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Immersion suit</text>
<circle cx="502" cy="128" r="16" fill="#dc2626"/><rect x="472.0" y="145.0" width="60.0" height="70.0" rx="10" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<rect x="472.0" y="210.0" width="24.0" height="30.0" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<rect x="508.0" y="210.0" width="24.0" height="30.0" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<text x="373.0" y="270.0" font-size="12" text-anchor="start" fill="#0f172a">• ป้องกันความเย็นในน้ำ ลดการเสียความร้อน</text>
<text x="373.0" y="300.0" font-size="12" text-anchor="start" fill="#0f172a">• สวมได้เองภายใน 2 นาที</text>
<text x="373.0" y="330.0" font-size="12" text-anchor="start" fill="#0f172a">• แบบมีฉนวน: อุณหภูมิแกนกลางลดไม่เกิน 2°C</text>
<text x="373.0" y="360.0" font-size="12" text-anchor="start" fill="#0f172a">• หลัง 6 ชม. ในน้ำ 0–2°C (ตามมาตรฐาน)</text>
<text x="373.0" y="390.0" font-size="12" text-anchor="start" fill="#0f172a">• เรือสินค้า: มีให้ทุกคน (SOLAS III/32)</text>
<rect x="670.0" y="60.0" width="295.0" height="380.0" rx="14" fill="#fff" stroke="#ca8a04" stroke-width="2.5"/>
<rect x="670.0" y="60.0" width="295.0" height="46.0" rx="14" fill="#ca8a04" stroke="#ca8a04" stroke-width="0"/>
<rect x="670.0" y="90.0" width="295.0" height="16.0" rx="0" fill="#ca8a04" stroke="#ca8a04" stroke-width="0"/>
<text x="817.0" y="90.0" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">Thermal protective aid</text>
<path d="M 777 130 Q 817 115 857 130 L 862 230 L 772 230 Z" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><text x="688.0" y="270.0" font-size="12" text-anchor="start" fill="#0f172a">• ถุง/ชุดวัสดุนำความร้อนต่ำ ใช้ในเรือ/แพ</text>
<text x="688.0" y="300.0" font-size="12" text-anchor="start" fill="#0f172a">• ลดการเสียความร้อนของผู้รอดชีวิต</text>
<text x="688.0" y="330.0" font-size="12" text-anchor="start" fill="#0f172a">• ใช้กับคนที่เปียก/ตัวเย็น</text>
<text x="688.0" y="360.0" font-size="12" text-anchor="start" fill="#0f172a">• ถอดออกได้ภายใน 2 นาทีถ้าขัดการว่ายน้ำ</text>
<text x="688.0" y="390.0" font-size="12" text-anchor="start" fill="#0f172a">• มีในเรือชูชีพ 10% ของความจุ หรืออย่างน้อย 2</text>
<text x="500.0" y="460.0" font-size="11.5" text-anchor="middle" fill="#334155">Immersion suit แบบไม่มีฉนวนต้องสวมทับเสื้อผ้าอุ่น — ตรวจซิป ขนาด ทดสอบแรงดันอากาศ ≤ 3 ปี (ถี่ขึ้นเมื่ออายุ > 10 ปี — MSC/Circ.1114)</text>
</svg>
