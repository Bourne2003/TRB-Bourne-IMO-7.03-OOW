<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
  <rect width="960" height="560" fill="#fff"/>
  <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#334155"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">การแก้ค่ามุมเงย: Hs → Ha → Ho</text>
  <!-- left panel: dip geometry -->
  <text x="225" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Dip of the horizon</text>
  <path d="M 20.0 468.2 A 360 360 0 0 1 440.0 511.7 L 440 500 L 20 500 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="160" y="485" font-size="13" fill="#1d4ed8">ผิวน้ำทะเล (โลกโค้ง)</text>
  <line x1="110" y1="431.4" x2="110" y2="340" stroke="#0f172a" stroke-width="3"/>
  <circle cx="110" cy="340" r="7" fill="#0f172a"/>
  <text x="24" y="370" font-size="13">ความสูงตา h</text>
  <line x1="110" y1="340" x2="440" y2="340" stroke="#15803d" stroke-width="2"/>
  <text x="200" y="332" font-size="13" fill="#15803d" font-weight="bold">Sensible horizon (แนวราบผ่านตา)</text>
  <line x1="110" y1="340" x2="389.2" y2="471.2" stroke="#b91c1c" stroke-width="2"/><circle cx="353.0" cy="454.2" r="4" fill="#b91c1c"/>
  <text x="150" y="388" font-size="13" fill="#b91c1c" font-weight="bold" transform="rotate(25 150 388)">Visible horizon</text>
  <path d="M 230 340 A 120 120 0 0 1 218.6 391.0" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="238" y="360" font-size="14" fill="#7c3aed" font-weight="bold">Dip</text>
  <line x1="110" y1="340" x2="330" y2="110" stroke="#d97706" stroke-width="2"/>
  <text x="300" y="98" font-size="13" fill="#b45309" font-weight="bold">★ ดาว</text>
  <text x="40" y="530" font-size="12" fill="#334155">มุมที่วัดจาก visible horizon มากเกินไปเท่ากับ dip → ลบออกเสมอ</text>
  <text x="40" y="548" font-size="12" fill="#334155">Dip (') ≈ 1.76 √h (h เป็นเมตร) · 22 m → 8.3'</text>
  <!-- right panel: flow -->
  <g font-size="14">
    <rect x="520" y="60" width="200" height="38" rx="8" fill="#1e3a8a"/><text x="620" y="85" text-anchor="middle" fill="#fff" font-weight="bold">Hs (sextant altitude)</text>
    <line x1="620" y1="98" x2="620" y2="124" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
    <text x="640" y="116" fill="#334155">± IE ("on" ลบ / "off" บวก)</text>
    <line x1="620" y1="124" x2="620" y2="152" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
    <text x="640" y="144" fill="#b91c1c">− Dip (ลบเสมอ)</text>
    <rect x="520" y="154" width="200" height="38" rx="8" fill="#2563eb"/><text x="620" y="179" text-anchor="middle" fill="#fff" font-weight="bold">Ha (apparent altitude)</text>
    <line x1="620" y1="192" x2="620" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
    <text x="640" y="212" fill="#b91c1c">− Refraction (ลบเสมอ)</text>
    <line x1="620" y1="222" x2="620" y2="252" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
    <text x="640" y="242" fill="#15803d">± SD (+LL / −UL) ดวงอาทิตย์ ดวงจันทร์</text>
    <line x1="620" y1="252" x2="620" y2="282" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
    <text x="640" y="272" fill="#15803d">+ Parallax (ใหญ่มากกับดวงจันทร์)</text>
    <line x1="620" y1="282" x2="620" y2="312" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
    <text x="640" y="302" fill="#334155">± Additional (temp/pressure, Venus/Mars)</text>
    <rect x="520" y="314" width="200" height="38" rx="8" fill="#15803d"/><text x="620" y="339" text-anchor="middle" fill="#fff" font-weight="bold">Ho (observed altitude)</text>
  </g>
  <rect x="500" y="380" width="440" height="160" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="514" y="404" font-size="13" font-weight="bold">ตัวอย่าง A (Sun LL)</text>
  <text x="514" y="428" font-size="13">Hs 39°02.8' + IE 1.5' − Dip 8.3' = Ha 38°56.0'</text>
  <text x="514" y="452" font-size="13">Ha − Refr 1.2' + SD 16.2' + Par 0.1' = Ho 39°11.1'</text>
  <text x="514" y="482" font-size="13" font-weight="bold">ดาวฤกษ์: แก้แค่ IE, Dip, Refraction</text>
  <text x="514" y="506" font-size="13">ดวงจันทร์: ใช้ตาราง Moon (altitude + HP) แยก LL/UL</text>
  <text x="514" y="530" font-size="13">ดวงอาทิตย์: ตาราง Oct–Mar / Apr–Sept</text>
</svg>
