<text x="260.0" y="415.0" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">เส้นผ่านศูนย์กลางนอก 178 mm</text>
<rect x="480.0" y="60.0" width="490.0" height="320.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="494.0" y="86.0" font-size="12.3" text-anchor="start" fill="#0f172a" font-weight="bold">ขนาดมาตรฐาน (FSS Code บทที่ 2)</text>
<text x="494.0" y="108.5" font-size="12.3" text-anchor="start" fill="#0f172a">• เส้นผ่านศูนย์กลางนอก 178 mm</text>
<text x="494.0" y="131.0" font-size="12.3" text-anchor="start" fill="#0f172a">• เส้นผ่านศูนย์กลางใน 64 mm</text>
<text x="494.0" y="153.5" font-size="12.3" text-anchor="start" fill="#0f172a">• วงกลมรูน็อต (bolt circle) 132 mm</text>
<text x="494.0" y="176.0" font-size="12.3" text-anchor="start" fill="#0f172a">• รู 4 รู Ø 19 mm เว้นระยะเท่ากัน มีร่องเปิดถึงขอบหน้าแปลน</text>
<text x="494.0" y="198.5" font-size="12.3" text-anchor="start" fill="#0f172a">• ความหนาหน้าแปลนอย่างน้อย 14.5 mm หน้าเรียบ (flat face)</text>
<text x="494.0" y="221.0" font-size="12.3" text-anchor="start" fill="#0f172a">• น็อต 4 ชุด Ø 16 mm ยาว 50 mm และแหวน 8 ตัว</text>
<text x="494.0" y="243.5" font-size="12.3" text-anchor="start" fill="#0f172a">• วัสดุรับแรงดันใช้งาน 1.0 N/mm²</text>
<text x="494.0" y="266.0" font-size="12.3" text-anchor="start" fill="#0f172a"></text>
<text x="494.0" y="288.5" font-size="12.3" text-anchor="start" fill="#0f172a">เรือ ≥ 500 GT ต้องมีอย่างน้อย 1 ชุด (SOLAS II-2/10.2.1.7)</text>
<text x="494.0" y="311.0" font-size="12.3" text-anchor="start" fill="#0f172a">ใช้ต่อระบบน้ำดับเพลิงระหว่างเรือกับฝั่ง/เรือลำอื่น</text>
<text x="494.0" y="333.5" font-size="12.3" text-anchor="start" fill="#0f172a">เก็บพร้อมปะเก็นและอุปกรณ์ ใช้ได้ทั้งสองกราบ</text>
<text x="494.0" y="356.0" font-size="12.3" text-anchor="start" fill="#0f172a">ตำแหน่งระบุใน fire control plan</text>
</svg>
