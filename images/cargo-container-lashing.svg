<text x="600.0" y="110.0" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">ส่วนประกอบหลัก</text>
<rect x="600.0" y="128.0" width="16.0" height="16.0" rx="0" fill="#f59e0b" stroke="#0f172a" stroke-width="0.8"/>
<text x="626.0" y="141.0" font-size="12" text-anchor="start" fill="#0f172a">Twistlock (SATL/FAT) และ stacking cone — ยึดมุมตู้ระหว่างชั้น</text>
<rect x="600.0" y="158.0" width="16.0" height="16.0" rx="0" fill="#b91c1c" stroke="#0f172a" stroke-width="0.8"/>
<text x="626.0" y="171.0" font-size="12" text-anchor="start" fill="#0f172a">Lashing rod — ยึดแนวทแยงจากฝาระวาง/lashing bridge</text>
<rect x="600.0" y="188.0" width="16.0" height="16.0" rx="0" fill="#f97316" stroke="#0f172a" stroke-width="0.8"/>
<text x="626.0" y="201.0" font-size="12" text-anchor="start" fill="#0f172a">Turnbuckle (bottle screw) — ปรับความตึง lashing rod</text>
<rect x="600.0" y="218.0" width="16.0" height="16.0" rx="0" fill="#334155" stroke="#0f172a" stroke-width="0.8"/>
<text x="626.0" y="231.0" font-size="12" text-anchor="start" fill="#0f172a">Corner casting — จุดยึดมุมตู้ 8 มุม (ISO)</text>
<rect x="600.0" y="248.0" width="16.0" height="16.0" rx="0" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.8"/>
<text x="626.0" y="261.0" font-size="12" text-anchor="start" fill="#0f172a">Lashing bridge — ให้ lash ได้สูงขึ้น ลดแรงต่อชั้นบน</text>
<rect x="600.0" y="278.0" width="16.0" height="16.0" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="0.8"/>
<text x="626.0" y="291.0" font-size="12" text-anchor="start" fill="#0f172a">Bridge fitting / buttress — ยึดระหว่างแถวบนสุด (บางเรือ)</text>
<text x="600.0" y="340.0" font-size="15" text-anchor="start" fill="#0f172a" font-weight="bold">แรงที่กระทำต่อตู้ในทะเล</text>
<text x="600.0" y="366.0" font-size="12" text-anchor="start" fill="#0f172a">• แรงขวาง (transverse) จากการโคลง — มากที่สุดที่ชั้นบนและหัว/ท้ายเรือ</text>
<text x="600.0" y="388.0" font-size="12" text-anchor="start" fill="#0f172a">• แรงตามยาว (longitudinal) จากการโต้ (pitch)</text>
<text x="600.0" y="410.0" font-size="12" text-anchor="start" fill="#0f172a">• แรงตั้ง (vertical) จากการ heave/pitch — ตู้ยกตัว (racking/tipping)</text>
<text x="600.0" y="432.0" font-size="12" text-anchor="start" fill="#0f172a">• ลมบนตู้ชั้นบนและคลื่นกระแทก (green sea)</text>
<text x="600.0" y="454.0" font-size="12" text-anchor="start" fill="#0f172a">• ขีดจำกัด: น้ำหนักกองตู้ (stack weight), ความสูงกอง, GM สูงเกิน</text>
<text x="600.0" y="476.0" font-size="12" text-anchor="start" fill="#0f172a">  → โคลงเร็ว แรงเร่งสูง (ตรวจด้วย lashing computer)</text>
<text x="600.0" y="498.0" font-size="12" text-anchor="start" fill="#0f172a">• Parametric rolling ทำให้ lashing ล้มเหลวทั้งกองได้</text>
<text x="320.0" y="70.0" font-size="13" text-anchor="middle" fill="#334155" font-weight="bold">ตัวอย่างการยึดแบบ cross lashing (มองจากหัว/ท้าย)</text>
<text x="320.0" y="520.0" font-size="12" text-anchor="middle" fill="#b91c1c">การจัดยึดจริงต้องเป็นไปตาม Cargo Securing Manual (CSM) ของเรือ และผลคำนวณ lashing software</text>
</svg>
