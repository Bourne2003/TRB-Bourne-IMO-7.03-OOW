<text x="54" y="368" font-size="13">SOLAS II-1/19: แผนควบคุมความเสียหายติดถาวรบนสะพาน แสดงขอบเขตช่องผนึกน้ำแต่ละชั้น ช่องเปิดและวิธีปิด ตำแหน่งควบคุม</text>
<text x="54" y="392" font-size="13">ระบบ cross-flooding ฯลฯ และมีคู่มือ (damage control booklet) — เส้นสีแดง = ผนังกั้นน้ำ · เส้นเขียว = ระบบสูบน้ำท้องเรือ (bilge)</text>
