<path d="M 270 172 L 330 172 L 330 260 L 600 260" fill="none" stroke="#0369a1" stroke-width="2.5" stroke-dasharray="6 3"/><text x="470.0" y="276.0" font-size="11" text-anchor="middle" fill="#075985">ท่อ CO₂ ไปห้องเครื่อง/ระวาง (total flooding)</text>
