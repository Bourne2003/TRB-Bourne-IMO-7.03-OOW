<text x="915.0" y="175.0" font-size="10" text-anchor="middle" fill="#0f172a" font-weight="bold">ISC</text>
<rect x="40.0" y="376.0" width="18.0" height="18.0" rx="0" fill="#fde68a" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="390.0" font-size="12" text-anchor="start" fill="#0f172a">FCP — Fire control plan (ติดถาวร + สำเนาในกล่องกันน้ำนอกที่พักให้หน่วยดับเพลิงฝั่ง)</text>
<rect x="40.0" y="402.0" width="18.0" height="18.0" rx="0" fill="#bbf7d0" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="416.0" font-size="12" text-anchor="start" fill="#0f172a">FO — Fire-fighter's outfits (เรือสินค้าอย่างน้อย 2 ชุด, tanker เพิ่ม) + SCBA ≥ 1,200 L อากาศ</text>
<rect x="40.0" y="428.0" width="18.0" height="18.0" rx="0" fill="#7c3aed" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="442.0" font-size="12" text-anchor="start" fill="#0f172a">Detectors และ manual call points → แผงระบบตรวจจับ/สัญญาณบนสะพานเดินเรือ</text>
<rect x="40.0" y="454.0" width="18.0" height="18.0" rx="0" fill="#fecaca" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="468.0" font-size="12" text-anchor="start" fill="#0f172a">Fire pumps: เรือ ≥ 1,000 GT อย่างน้อย 2 เครื่องแยกกัน + emergency fire pump ตามข้อกำหนด</text>
<rect x="40.0" y="480.0" width="18.0" height="18.0" rx="0" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="494.0" font-size="12" text-anchor="start" fill="#0f172a">ISC — International shore connection: ต่อน้ำจากฝั่ง/เรืออื่นเข้า fire main (ขนาดหน้าแปลนมาตรฐาน)</text>
<rect x="40.0" y="506.0" width="18.0" height="18.0" rx="0" fill="#e0f2fe" stroke="#0f172a" stroke-width="1"/>
<text x="68.0" y="520.0" font-size="12" text-anchor="start" fill="#0f172a">ระบบคงที่ (fixed): CO₂, โฟม, water mist/local application, sprinkler, ผงเคมี, inert gas (tanker)</text>
<text x="500.0" y="552.0" font-size="11.5" text-anchor="middle" fill="#475569">ถังดับเพลิงแบบหิ้ว (portable) และแบบล้อ (semi-portable) ติดตั้งตามแผน fire control plan · EEBD สำหรับหนีออกจากพื้นที่อันตราย (อย่างน้อย 10 นาที)</text>
</svg>
