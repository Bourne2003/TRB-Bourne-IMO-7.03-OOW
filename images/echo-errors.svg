<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
  <rect width="980" height="520" fill="#fff"/>
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">สัญญาณลวงและความคลาดเคลื่อนของ Echo Sounder</text>
  <g font-size="13">
    <!-- panel 1 multiple echo -->
    <rect x="20" y="50" width="300" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="34" y="74" font-weight="bold">1. Multiple echo</text>
    <rect x="110" y="86" width="60" height="16" fill="#475569"/>
    <line x1="130" y1="102" x2="130" y2="220" stroke="#d97706" stroke-width="2"/>
    <line x1="140" y1="220" x2="140" y2="102" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="150" y1="102" x2="150" y2="220" stroke="#d97706" stroke-width="2" stroke-dasharray="2 3"/>
    <rect x="40" y="220" width="260" height="14" fill="#d6b98c"/>
    <text x="180" y="150">พื้น → ผิว/ท้องเรือ → พื้น</text>
    <text x="180" y="170">เห็นเส้นที่ 2× ความลึก</text>
    <!-- panel 2 second trace -->
    <rect x="340" y="50" width="300" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="354" y="74" font-weight="bold">2. Second trace echo</text>
    <text x="354" y="100">น้ำลึกเกินช่วงสเกล</text>
    <text x="354" y="120">echo ของพัลส์ที่ 1 กลับมา</text>
    <text x="354" y="140">หลังพัลส์ที่ 2 ส่งไปแล้ว</text>
    <text x="354" y="164" fill="#b91c1c" font-weight="bold">→ แสดง "ตื้น" ผิดปกติ</text>
    <line x1="360" y1="200" x2="620" y2="200" stroke="#334155"/>
    <rect x="370" y="190" width="6" height="20" fill="#1d4ed8"/><rect x="490" y="190" width="6" height="20" fill="#1d4ed8"/><rect x="530" y="190" width="6" height="20" fill="#b91c1c"/>
    <text x="356" y="232" font-size="11">พัลส์ 1</text><text x="470" y="232" font-size="11">พัลส์ 2</text><text x="525" y="248" font-size="11" fill="#b91c1c">echo ของพัลส์ 1</text>
    <!-- panel 3 side echo -->
    <rect x="660" y="50" width="300" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="674" y="74" font-weight="bold">3. Side echo (พื้นลาด/ขอบร่อง)</text>
    <rect x="770" y="86" width="60" height="16" fill="#475569"/>
    <path d="M 680 240 L 760 240 L 900 140 L 940 140 L 940 250 L 680 250 Z" fill="#d6b98c"/>
    <line x1="800" y1="102" x2="800" y2="240" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <line x1="805" y1="102" x2="868" y2="166" stroke="#d97706" stroke-width="2.5"/>
    <text x="676" y="130">echo ใกล้สุดมาจาก</text>
    <text x="676" y="148">ด้านข้าง ไม่ใช่ใต้เรือ</text>
    <!-- panel 4 DSL -->
    <rect x="20" y="280" width="300" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="34" y="304" font-weight="bold">4. Deep scattering layer / ฝูงปลา</text>
    <g fill="#64748b" opacity="0.6"><circle cx="80" cy="370" r="3"/><circle cx="95" cy="365" r="3"/><circle cx="110" cy="372" r="3"/><circle cx="130" cy="366" r="3"/><circle cx="150" cy="371" r="3"/><circle cx="170" cy="364" r="3"/><circle cx="190" cy="370" r="3"/><circle cx="210" cy="366" r="3"/><circle cx="230" cy="372" r="3"/><circle cx="250" cy="367" r="3"/></g>
    <rect x="40" y="460" width="260" height="14" fill="#d6b98c"/>
    <text x="40" y="408">"พื้นลวง" ไม่ชัด ขึ้น-ลงตามเวลา</text>
    <text x="40" y="428">(ตอนกลางคืนขึ้นใกล้ผิว)</text>
    <!-- panel 5 aeration -->
    <rect x="340" y="280" width="300" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="354" y="304" font-weight="bold">5. Aeration (ฟองอากาศ)</text>
    <rect x="430" y="320" width="80" height="16" fill="#475569"/>
    <g fill="none" stroke="#0284c7"><circle cx="445" cy="350" r="5"/><circle cx="465" cy="356" r="4"/><circle cx="485" cy="348" r="6"/><circle cx="500" cy="360" r="4"/><circle cx="455" cy="366" r="3"/></g>
    <text x="354" y="400">คลื่นแรง เรือเบา เครื่องถอยหลัง</text>
    <text x="354" y="420">ผ่าน wake → สัญญาณหาย</text>
    <!-- panel 6 soft mud / pythagorean -->
    <rect x="660" y="280" width="300" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="674" y="304" font-weight="bold">6. Soft mud / Pythagorean error</text>
    <rect x="690" y="430" width="250" height="18" fill="#a8a29e" opacity="0.6"/><rect x="690" y="448" width="250" height="16" fill="#78350f"/>
    <text x="700" y="444" font-size="11">โคลนเหลว (200 kHz สะท้อน)</text>
    <text x="700" y="461" font-size="11" fill="#fff">พื้นแข็ง (50 kHz)</text>
    <rect x="700" y="320" width="20" height="10" fill="#0f172a"/><rect x="760" y="320" width="20" height="10" fill="#0f172a"/>
    <path d="M 710 330 L 740 420 L 770 330" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="790" y="350" font-size="12">Tx/Rx แยกกัน</text>
    <text x="790" y="368" font-size="12">น้ำตื้นมาก → แสดง</text>
    <text x="790" y="386" font-size="12">ลึกกว่าจริง</text>
  </g>
</svg>
