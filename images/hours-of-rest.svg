<text x="10" y="392" font-size="13">เกณฑ์: พัก ≥ 10 ชม./24 ชม. และ ≥ 77 ชม./7 วัน · แบ่งได้ไม่เกิน 2 ช่วง โดยช่วงหนึ่ง ≥ 6 ชม. · ระหว่างช่วงพักห่างกันไม่เกิน 14 ชม.</text>
<text x="10" y="414" font-size="13">MLC A2.3 ให้ใช้อีกแบบได้: ทำงานไม่เกิน 14 ชม./24 ชม. และ 72 ชม./7 วัน · ข้อยกเว้นตาม STCW A-VIII/1 วรรค 9: ≥ 70 ชม./7 วัน แบ่งได้ 3 ช่วง</text>
<text x="10" y="440" font-size="13" fill="#b91c1c">แถวสุดท้าย (stand-by เข้าท่า 0300–0600, ยามสินค้า 1300–1700, ซ้อม 1800–1900): พักรวมเพียง 8 ชม. แบ่ง 5 ช่วง</text>
<text x="10" y="462" font-size="13" fill="#b91c1c">ไม่มีช่วงใดถึง 6 ชม. → ผิดเกณฑ์ทั้ง 10 ชม./24 ชม. และการแบ่งช่วง (งานเข้าท่า/สินค้าไม่ใช่เหตุฉุกเฉินตาม A-VIII/1)</text>
