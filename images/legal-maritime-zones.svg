<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">เขตทางทะเลตาม UNCLOS 1982 (Maritime zones)</text>
<path d="M 40 80 L 160 80 L 160 300 L 40 300 Z" fill="#d6d3d1" stroke="#57534e"/><text x="100.0" y="190.0" font-size="14" text-anchor="middle" fill="#44403c" font-weight="bold">แผ่นดิน</text>
<rect x="160.0" y="80.0" width="90.0" height="220.0" rx="0" fill="#bae6fd" stroke="#64748b" stroke-width="1"/>
<text x="205.0" y="180.0" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="bold">น่านน้ำภายใน</text>
<text x="205.0" y="200.0" font-size="11.5" text-anchor="middle" fill="#334155">(internal)</text>
<rect x="250.0" y="80.0" width="140.0" height="220.0" rx="0" fill="#93c5fd" stroke="#64748b" stroke-width="1"/>
<text x="320.0" y="180.0" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="bold">ทะเลอาณาเขต</text>
<text x="320.0" y="200.0" font-size="11.5" text-anchor="middle" fill="#334155">12 nm</text>
<rect x="390.0" y="80.0" width="110.0" height="220.0" rx="0" fill="#bfdbfe" stroke="#64748b" stroke-width="1"/>
<text x="445.0" y="180.0" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="bold">เขตต่อเนื่อง</text>
<text x="445.0" y="200.0" font-size="11.5" text-anchor="middle" fill="#334155">24 nm</text>
<rect x="500.0" y="80.0" width="320.0" height="220.0" rx="0" fill="#dbeafe" stroke="#64748b" stroke-width="1"/>
<text x="660.0" y="180.0" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="bold">เขตเศรษฐกิจจำเพาะ (EEZ)</text>
<text x="660.0" y="200.0" font-size="11.5" text-anchor="middle" fill="#334155">200 nm</text>
<rect x="820.0" y="80.0" width="140.0" height="220.0" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
<text x="890.0" y="180.0" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="bold">ทะเลหลวง</text>
<text x="890.0" y="200.0" font-size="11.5" text-anchor="middle" fill="#334155">(high seas)</text>
<line x1="250.0" y1="70.0" x2="250.0" y2="310.0" stroke="#b91c1c" stroke-width="2.5"/>
<text x="250.0" y="64.0" font-size="11.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">เส้นฐาน (baseline)</text>
<path d="M 160 300 L 160 330 Q 500 350 820 360 L 900 450 L 960 460" fill="none" stroke="#78350f" stroke-width="3"/><text x="560.0" y="375.0" font-size="11.5" text-anchor="middle" fill="#78350f" font-weight="bold">ไหล่ทวีป (continental shelf) — สิทธิ์ทรัพยากรใต้ท้องทะเล</text>
<rect x="40.0" y="395.0" width="920.0" height="115.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="56.0" y="420.0" font-size="11.8" text-anchor="start" fill="#0f172a">ทะเลอาณาเขต: อำนาจอธิปไตยของรัฐชายฝั่ง — เรือต่างชาติมีสิทธิ์ผ่านโดยสุจริต (innocent passage) แต่ต้องเคารพกฎของรัฐ (TSS, รายงาน)</text>
<text x="56.0" y="445.0" font-size="11.8" text-anchor="start" fill="#0f172a">เขตต่อเนื่อง: รัฐควบคุมเพื่อป้องกัน/ลงโทษการละเมิดกฎศุลกากร การคลัง เข้าเมือง สุขอนามัย · EEZ: สิทธิ์ทรัพยากร และเขตอำนาจด้านสิ่งแวดล้อมบางประการ</text>
<text x="56.0" y="470.0" font-size="11.8" text-anchor="start" fill="#0f172a">ช่องแคบที่ใช้เดินเรือระหว่างประเทศ: transit passage · รัฐหมู่เกาะ: archipelagic sea lanes passage · ทะเลหลวง: เสรีภาพการเดินเรือ อยู่ใต้อำนาจรัฐเจ้าของธง</text>
<text x="56.0" y="495.0" font-size="11.8" text-anchor="start" fill="#0f172a">ระยะทั้งหมดวัดจากเส้นฐาน — รัฐเจ้าของธงต้องดูแลเรือของตน (Art. 94) · รัฐเจ้าท่ามีอำนาจตรวจเรือในท่า (port State control)</text>
</svg>
