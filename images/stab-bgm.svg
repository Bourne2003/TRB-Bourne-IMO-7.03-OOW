<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker><marker id="arB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker><marker id="arR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker><marker id="arG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">จุดสำคัญของเสถียรภาพตามขวาง: K, B, G, M และแขนตั้งตรง GZ</text>
<text x="250.0" y="70.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เรือตั้งตรง (upright)</text>
<g transform="rotate(0 250 250)"><path d="M 100 120 L 400 120 L 400 370 Q 400 400 370 400 L 130 400 Q 100 400 100 370 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/><line x1="250.0" y1="100.0" x2="250.0" y2="410.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="250.0" cy="400.0" r="5.5" fill="#0f172a"/><text x="240.0" y="404.0" font-size="13" text-anchor="end" fill="#0f172a" font-weight="bold">K</text>
<circle cx="250.0" cy="220.0" r="5.5" fill="#b91c1c"/><text x="240.0" y="224.0" font-size="13" text-anchor="end" fill="#b91c1c" font-weight="bold">G</text>
</g><rect x="50" y="250" width="400" height="210" fill="#bae6fd" opacity="0.45"/><line x1="50.0" y1="250.0" x2="450.0" y2="250.0" stroke="#0284c7" stroke-width="2"/>
<circle cx="250.0" cy="325.0" r="5.5" fill="#1d4ed8"/><text x="240.0" y="329.0" font-size="13" text-anchor="end" fill="#1d4ed8" font-weight="bold">B</text>
<circle cx="250.0" cy="140.0" r="5.5" fill="#15803d"/><text x="240.0" y="144.0" font-size="13" text-anchor="end" fill="#15803d" font-weight="bold">M</text>
<line x1="290.0" y1="140.0" x2="290.0" y2="220.0" stroke="#15803d" stroke-width="1.5"/>
<text x="296.0" y="184.0" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold">GM</text>
<line x1="340.0" y1="400.0" x2="340.0" y2="325.0" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arB)"/>
<text x="346.0" y="365.0" font-size="12" text-anchor="start" fill="#1d4ed8" font-weight="bold">KB</text>
<line x1="370.0" y1="400.0" x2="370.0" y2="220.0" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arR)"/>
<text x="376.0" y="300.0" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="bold">KG</text>
<line x1="150.0" y1="400.0" x2="150.0" y2="140.0" stroke="#15803d" stroke-width="1.2" marker-end="url(#arG)"/>
<text x="144.0" y="280.0" font-size="12" text-anchor="end" fill="#15803d" font-weight="bold">KM</text>
<line x1="250.0" y1="220.0" x2="250.0" y2="260.0" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR)"/>
<line x1="250.0" y1="325.0" x2="250.0" y2="285.0" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arB)"/>
<text x="720.0" y="70.0" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">เรือเอียงด้วยแรงภายนอก θ</text>
<g transform="rotate(20 720 250)"><path d="M 570 120 L 870 120 L 870 370 Q 870 400 840 400 L 600 400 Q 570 400 570 370 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/><line x1="720.0" y1="100.0" x2="720.0" y2="410.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="720.0" cy="400.0" r="5.5" fill="#0f172a"/><text x="710.0" y="404.0" font-size="13" text-anchor="end" fill="#0f172a" font-weight="bold">K</text>
<circle cx="720.0" cy="220.0" r="5.5" fill="#b91c1c"/><text x="710.0" y="224.0" font-size="13" text-anchor="end" fill="#b91c1c" font-weight="bold">G</text>
</g><rect x="520" y="250" width="400" height="210" fill="#bae6fd" opacity="0.45"/><line x1="520.0" y1="250.0" x2="920.0" y2="250.0" stroke="#0284c7" stroke-width="2"/>
<circle cx="757.6" cy="146.6" r="5.5" fill="#15803d"/><text x="767.6" y="150.6" font-size="13" text-anchor="start" fill="#15803d" font-weight="bold">M</text>
<circle cx="757.6" cy="335.0" r="5.5" fill="#1d4ed8"/><text x="767.6" y="339.0" font-size="13" text-anchor="start" fill="#1d4ed8" font-weight="bold">B₁</text>
<line x1="757.6" y1="335.0" x2="757.6" y2="146.6" stroke="#1d4ed8" stroke-width="1.3" stroke-dasharray="5 3"/>
<line x1="730.3" y1="221.8" x2="757.6" y2="221.8" stroke="#b91c1c" stroke-width="3"/>
<circle cx="757.6" cy="221.8" r="5.5" fill="#b91c1c"/><text x="767.6" y="225.8" font-size="13" text-anchor="start" fill="#b91c1c" font-weight="bold">Z</text>
<text x="743.9" y="209.8" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="bold">GZ</text>
<line x1="730.3" y1="221.8" x2="730.3" y2="271.8" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR)"/>
<text x="722.3" y="287.8" font-size="11" text-anchor="end" fill="#b91c1c">น้ำหนัก (Δ) ลงที่ G</text>
<line x1="757.6" y1="335.0" x2="757.6" y2="290.0" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arB)"/>
<text x="769.6" y="313.0" font-size="11" text-anchor="start" fill="#1d4ed8">แรงลอยตัวขึ้นที่ B₁</text>
<text x="720.0" y="480.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">Righting moment = Δ × GZ   ·   มุมเล็ก: GZ ≈ GM × sin θ</text>
<text x="250.0" y="480.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">GM = KM − KG   ·   KM = KB + BM   ·   BM = I ÷ V</text>
<text x="500.0" y="505.0" font-size="12" text-anchor="middle" fill="#334155">M อยู่เหนือ G → เสถียร (stable) · M ตรงกับ G → เป็นกลาง (neutral) · M ต่ำกว่า G → ไม่เสถียร (unstable)</text>
</svg>
