<rect x="40.0" y="505.0" width="920.0" height="80.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="56.0" y="530.0" font-size="12.5" text-anchor="start" fill="#0f172a">อนุสัญญาอื่น: BWM 2004 (น้ำอับเฉา D-1/D-2) · AFS 2001 (สีกันเพรียง — ห้าม TBT, cybutryne) · Hong Kong Convention (รีไซเคิลเรือ — มีผล 26 มิ.ย. 2025, IHM)</text>
<text x="56.0" y="552.0" font-size="12.5" text-anchor="start" fill="#0f172a">OPRC 1990/OPRC-HNS (เตรียมรับมือมลพิษ) · London Convention/Protocol (การทิ้งของเสีย) · Biofouling Guidelines (MEPC.378(80)) · Polar Code (ส่วนสิ่งแวดล้อม)</text>
<text x="56.0" y="574.0" font-size="12.5" text-anchor="start" fill="#b91c1c">MARPOL Protocol I — การรายงานเหตุมลพิษ · ข้อกำหนดท้องถิ่น (เช่น EU, สหรัฐฯ, ท่าเรือ) อาจเข้มกว่า MARPOL</text>
