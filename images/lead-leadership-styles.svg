<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Tahoma, 'Noto Sans Thai', 'Leelawadee UI', Sarabun, sans-serif">
<rect width="1000" height="520" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">รูปแบบภาวะผู้นำตามสถานการณ์ และแรงจูงใจ</text>
<rect x="50.0" y="80.0" width="210.0" height="150.0" rx="12" fill="#fff" stroke="#15803d" stroke-width="2.5"/>
<text x="155.0" y="112.0" font-size="12.5" text-anchor="middle" fill="#15803d" font-weight="bold">S3 Participating (ร่วมคิด)</text>
<text x="155.0" y="152.0" font-size="11.8" text-anchor="middle" fill="#0f172a">ทีมมีความสามารถ</text>
<text x="155.0" y="174.0" font-size="11.8" text-anchor="middle" fill="#0f172a">แต่ขาดความมั่นใจ/แรงจูงใจ</text>
<rect x="270.0" y="80.0" width="210.0" height="150.0" rx="12" fill="#fff" stroke="#ca8a04" stroke-width="2.5"/>
<text x="375.0" y="112.0" font-size="12.5" text-anchor="middle" fill="#ca8a04" font-weight="bold">S2 Selling/Coaching (แนะนำ)</text>
<text x="375.0" y="152.0" font-size="11.8" text-anchor="middle" fill="#0f172a">ทีมเริ่มเรียนรู้</text>
<text x="375.0" y="174.0" font-size="11.8" text-anchor="middle" fill="#0f172a">ต้องอธิบายเหตุผล</text>
<rect x="50.0" y="240.0" width="210.0" height="150.0" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="155.0" y="272.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold">S4 Delegating (มอบหมาย)</text>
<text x="155.0" y="312.0" font-size="11.8" text-anchor="middle" fill="#0f172a">ทีมชำนาญและมั่นใจ</text>
<text x="155.0" y="334.0" font-size="11.8" text-anchor="middle" fill="#0f172a">ให้อิสระ ติดตามผล</text>
<rect x="270.0" y="240.0" width="210.0" height="150.0" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/>
<text x="375.0" y="272.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="bold">S1 Telling/Directing (สั่งการ)</text>
<text x="375.0" y="312.0" font-size="11.8" text-anchor="middle" fill="#0f172a">มือใหม่ หรือเหตุฉุกเฉิน</text>
<text x="375.0" y="334.0" font-size="11.8" text-anchor="middle" fill="#0f172a">สั่งชัด ควบคุมใกล้ชิด</text>
<text x="265.0" y="68.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">เลือกรูปแบบให้เหมาะกับคนและสถานการณ์</text>
<line x1="50.0" y1="404.0" x2="480.0" y2="404.0" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="265.0" y="420.0" font-size="11" text-anchor="middle" fill="#475569">พฤติกรรมสั่งการ (directive) มากขึ้น →</text>
<line x1="36.0" y1="390.0" x2="36.0" y2="80.0" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="28" y="235" font-size="11" fill="#475569" text-anchor="middle" transform="rotate(-90 28 235)">พฤติกรรมสนับสนุน (supportive) มากขึ้น →</text><text x="265.0" y="442.0" font-size="11.5" text-anchor="middle" fill="#334155">ภาวะฉุกเฉิน → ชัดเจนเด็ดขาด · งานปกติกับทีมชำนาญ → มีส่วนร่วม/มอบหมาย</text>
<text x="265.0" y="460.0" font-size="10.5" text-anchor="middle" fill="#64748b">(Situational Leadership — Hersey &amp; Blanchard)</text>
<polygon points="728,90.0 768,90.0 813,158.0 683,158.0" fill="#7c3aed" stroke="#fff" stroke-width="2"/><text x="748.0" y="129.0" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">การบรรลุศักยภาพ</text>
<polygon points="683,158.0 813,158.0 858,226.0 638,226.0" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><text x="748.0" y="197.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">การยอมรับ ความภาคภูมิ</text>
<polygon points="638,226.0 858,226.0 903,294.0 593,294.0" fill="#0891b2" stroke="#fff" stroke-width="2"/><text x="748.0" y="265.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">การเป็นส่วนหนึ่งของทีม</text>
<polygon points="593,294.0 903,294.0 948,362.0 548,362.0" fill="#15803d" stroke="#fff" stroke-width="2"/><text x="748.0" y="333.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">ความปลอดภัย มั่นคง</text>
<polygon points="548,362.0 948,362.0 993,430.0 503,430.0" fill="#ca8a04" stroke="#fff" stroke-width="2"/><text x="748.0" y="401.0" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="bold">ปัจจัยพื้นฐาน อาหาร พักผ่อน</text>
<text x="748.0" y="70.0" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="bold">ลำดับความต้องการ (Maslow) — แนวคิดแรงจูงใจ</text>
<text x="748.0" y="460.0" font-size="11.5" text-anchor="middle" fill="#334155">บนเรือ: อาหารดี ที่พักดี พักพอ ปลอดภัย → ทีม ยอมรับ</text>
<text x="748.0" y="478.0" font-size="11.5" text-anchor="middle" fill="#334155">ความก้าวหน้า — ชมเชยงานดีต่อหน้า ติเพื่อก่อในที่ส่วนตัว</text>
</svg>
