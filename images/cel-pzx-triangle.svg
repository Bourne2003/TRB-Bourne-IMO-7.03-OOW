<circle cx="213.3" cy="236.6" r="6" fill="#b91c1c"/><text x="135.3" y="230.6" font-size="16" font-weight="bold" fill="#b91c1c">P (Pn)</text>
<circle cx="525.9" cy="275.3" r="6" fill="#854d0e"/><text x="537.9" y="279.3" font-size="16" font-weight="bold" fill="#854d0e">X (ดาว)</text>
<text x="139.1" y="152.7" font-size="14" fill="#b91c1c" font-weight="bold">PZ = 90° − Lat</text>
<text x="312.3" y="254.0" font-size="14" fill="#7c3aed" font-weight="bold">PX = 90° ∓ Dec</text>
<text x="467.8" y="171.7" font-size="14" fill="#15803d" font-weight="bold">ZX = 90° − Alt</text>
<text x="557.5" y="419.6" font-size="12" fill="#0f766e">Horizon</text>
<text x="162.5" y="419.6" font-size="13" font-weight="bold">N</text>
<text x="545.5" y="310.4" font-size="13" font-weight="bold">S</text>
<text x="337.7" y="584.1" font-size="12" fill="#1d4ed8">Equinoctial</text>
<rect x="640" y="90" width="245" height="215" rx="8" fill="#fff" stroke="#94a3b8"/>
<text x="652" y="116" font-size="13" fill="#0f172a">มุมที่ P = Hour angle (LHA)</text>
<text x="652" y="140" font-size="13" fill="#0f172a">มุมที่ Z = Azimuth angle</text>
<text x="652" y="164" font-size="13" fill="#0f172a">มุมที่ X = Parallactic angle</text>
<text x="652" y="188" font-size="13" fill="#0f172a"></text>
<text x="652" y="212" font-size="13" fill="#0f172a">sin Hc = sin L sin D</text>
<text x="652" y="236" font-size="13" fill="#0f172a">        + cos L cos D cos LHA</text>
<text x="652" y="260" font-size="13" fill="#0f172a">cos Z = (sin D − sin L sin Hc)</text>
<text x="652" y="284" font-size="13" fill="#0f172a">        / (cos L cos Hc)</text>
</svg>
